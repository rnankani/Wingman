<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wingman</title>
<link rel="icon" href="/brand/icon-32.png" />
<link rel="apple-touch-icon" href="/brand/icon-180.png" />
<style>
  /* ---------------------------------------------------------------- tokens
     Cloned palette/anatomy from the reference dashboard: near-black page and
     sidebar, slightly-lifted card surfaces, muted gray body text, and colored
     pill badges that carry meaning (subject/category, urgency) rather than
     decoration. */
  :root {
    --bg: #0d0d0f;
    --sidebar: #101012;
    --surface: #1a1a1e;
    --surface-hover: #202024;
    --surface-active: #26262b;
    --border: rgba(255,255,255,0.08);
    --border-soft: rgba(255,255,255,0.05);
    --text: #f2f2f4;
    --text-soft: #9a9aa3;
    --text-faint: #6c6c74;

    --blue-fg: #8ab4f8; --blue-bg: rgba(90,155,245,0.16);
    --green-fg: #7ee2b8; --green-bg: rgba(64,200,150,0.14);
    --purple-fg: #c9b3f5; --purple-bg: rgba(150,110,230,0.16);
    --amber-fg: #f3c07a; --amber-bg: rgba(240,168,40,0.16);
    --rose-fg: #f2a0b8; --rose-bg: rgba(230,90,130,0.16);
    --gray-fg: #c7c7cf; --gray-bg: rgba(255,255,255,0.08);

    --accent: #ff9d3f;
    --shadow-md: 0 12px 32px -12px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 14px/1.5 -apple-system, "SF Pro Text", "Segoe UI", ui-sans-serif, Inter, system-ui, sans-serif;
    overflow: hidden;
  }
  button, input { font: inherit; }
  svg { display: block; }

  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; height: 100dvh; }

  /* -------------------------------------------------------------- sidebar */
  .sidebar {
    background: var(--sidebar);
    border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column;
    padding: 1.1rem 0.9rem 0.9rem;
    min-height: 0;
  }
  .brand-row { display: flex; align-items: center; gap: 0.55rem; padding: 0.3rem 0.4rem 1rem; }
  .brand-row svg { color: var(--accent); width: 20px; height: 20px; }
  .brand-row span { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; color: var(--text); }

  .searchbar {
    display: flex; align-items: center; gap: 0.5rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.7rem;
    margin-bottom: 1.1rem;
  }
  .searchbar svg { width: 15px; height: 15px; color: var(--text-faint); flex: none; }
  .searchbar input {
    background: none; border: none; outline: none; color: var(--text); font-size: 0.85rem;
    flex: 1; min-width: 0;
  }
  .searchbar input::placeholder { color: var(--text-faint); }
  .kbd {
    font-size: 0.68rem; font-weight: 600; color: var(--text-faint); background: rgba(255,255,255,0.06);
    border: 1px solid var(--border); border-radius: 5px; padding: 0.1rem 0.35rem; flex: none;
  }

  .navlist { display: flex; flex-direction: column; gap: 0.1rem; }
  .navitem {
    display: flex; align-items: center; gap: 0.65rem; width: 100%; text-align: left;
    background: none; border: none; border-radius: 10px; padding: 0.6rem 0.65rem;
    color: var(--text-soft); cursor: pointer; font-size: 0.87rem; font-weight: 500;
  }
  .navitem svg { width: 17px; height: 17px; flex: none; }
  .navitem:hover { background: var(--surface-hover); color: var(--text); }
  .navitem[aria-current="true"] { background: var(--surface-active); color: var(--text); font-weight: 650; }
  .navitem .navcount { margin-left: auto; font-size: 0.78rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .navitem[aria-current="true"] .navcount { color: var(--text-soft); }
  .navitem .navdot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--amber-fg); animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .sidebar-spacer { flex: 1; }

  .sidebar-foot { display: flex; align-items: center; gap: 0.65rem; padding: 0.7rem 0.5rem 0.2rem; border-top: 1px solid var(--border-soft); margin-top: 0.6rem; }
  .avatar-sm {
    width: 32px; height: 32px; border-radius: 50%; background: var(--surface-active);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.82rem; color: var(--text); flex: none;
  }
  .foot-name { font-size: 0.85rem; font-weight: 650; color: var(--text); }
  .foot-sub { font-size: 0.74rem; color: var(--text-faint); }

  /* ----------------------------------------------------------------- main */
  .main { overflow-y: auto; padding: 1.6rem 2rem 3rem; min-height: 0; }
  .main-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.3rem; }
  .main-head h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .main-actions { display: flex; gap: 0.5rem; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
    border-radius: 9px; padding: 0.5rem 0.9rem; font-weight: 600; font-size: 0.8rem;
    border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--text);
    transition: background .12s ease, transform .06s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover { background: var(--surface-hover); }
  .btn-primary { background: var(--text); color: #101012; border-color: var(--text); }
  .btn-primary:hover { background: #d8d8dc; }
  .btn-danger { color: var(--rose-fg); }
  .btn-soft { color: var(--amber-fg); }
  .btn-block { flex: 1; }
  .btn[disabled] { opacity: 0.4; cursor: default; }

  .columns { display: flex; gap: 1.25rem; align-items: flex-start; flex-wrap: wrap; }
  .col { flex: 1 1 300px; min-width: 280px; max-width: 380px; }
  .col-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.7rem; padding: 0 0.2rem; }
  .col-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .col-dot.amber { background: var(--amber-fg); }
  .col-dot.blue { background: var(--blue-fg); }
  .col-dot.green { background: var(--green-fg); }
  .col-name { font-weight: 650; font-size: 0.92rem; }
  .col-count {
    width: 19px; height: 19px; border-radius: 50%; background: var(--surface-active);
    color: var(--text-soft); font-size: 0.68rem; font-weight: 700; display: flex;
    align-items: center; justify-content: center;
  }
  .col-meta { margin-left: auto; font-size: 0.76rem; color: var(--text-faint); }
  .col-stack { display: flex; flex-direction: column; gap: 0.6rem; }

  /* ------------------------------------------------------------------ card */
  .acard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 0.95rem 1.05rem; cursor: pointer;
  }
  .acard:hover { border-color: rgba(255,255,255,0.14); }
  .acard-head { display: flex; align-items: flex-start; gap: 0.6rem; }
  .acard-num {
    width: 21px; height: 21px; border-radius: 50%; background: var(--surface-active);
    color: var(--text-soft); font-size: 0.68rem; font-weight: 700; display: flex;
    align-items: center; justify-content: center; flex: none; margin-top: 0.05rem;
  }
  .acard-title { font-weight: 650; font-size: 0.9rem; line-height: 1.35; color: var(--text); flex: 1; }
  .acard-chev { color: var(--text-faint); flex: none; margin-top: 0.15rem; transition: transform .15s ease; }
  .acard[data-open="true"] .acard-chev { transform: rotate(180deg); }

  .pill {
    display: inline-flex; align-items: center; font-size: 0.68rem; font-weight: 700;
    padding: 0.14rem 0.5rem; border-radius: 999px; letter-spacing: 0.01em;
  }
  .pill-time { color: var(--text-faint); font-weight: 500; display: inline-flex; align-items: center; gap: 0.25rem; }
  .pill-time svg { width: 11px; height: 11px; }
  .badges { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin: 0.55rem 0 0 1.85rem; }

  .acard-desc {
    margin: 0.5rem 0 0 1.85rem; color: var(--text-soft); font-size: 0.8rem; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .acard[data-open="true"] .acard-desc { -webkit-line-clamp: unset; }

  .acard-divider { border-top: 1px solid var(--border-soft); margin: 0.75rem 0 0.6rem 1.85rem; }
  .acard-foot { display: flex; justify-content: space-between; margin-left: 1.85rem; font-size: 0.74rem; color: var(--text-faint); }
  .acard-foot .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .acard-actions { display: flex; gap: 0.5rem; margin: 0.8rem 0 0 1.85rem; }

  .expand { margin: 0.85rem 0 0 1.85rem; }
  .quote {
    background: rgba(255,157,63,0.08); border: 1px solid rgba(255,157,63,0.25); border-radius: 10px;
    padding: 0.75rem 0.9rem; font-size: 0.88rem; line-height: 1.5; color: var(--text); font-style: italic;
  }
  .expand-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; flex-wrap: wrap; }
  .edit-box { margin-top: 0.7rem; }
  .edit-box textarea {
    width: 100%; min-height: 72px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); padding: 0.6rem 0.75rem; resize: vertical; font: inherit;
  }
  .edit-box textarea:focus { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .resolved-tag { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; font-weight: 650; margin-top: 0.7rem; }
  .resolved-tag.ok { color: var(--green-fg); }
  .resolved-tag.no { color: var(--rose-fg); }

  .empty-col { color: var(--text-faint); font-size: 0.8rem; padding: 1rem 0.5rem; border: 1px dashed var(--border); border-radius: 14px; text-align: center; }

  /* people grid */
  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; cursor: pointer; }
  .pcard:hover { border-color: rgba(255,255,255,0.14); }
  .pcard-head { display: flex; align-items: center; gap: 0.65rem; }
  .avatar-md { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex: none; }
  .pcard-name { font-weight: 650; font-size: 0.92rem; }
  .pcard-badges { display: flex; gap: 0.4rem; margin: 0.65rem 0 0; flex-wrap: wrap; }
  .pcard-desc { margin: 0.6rem 0 0; color: var(--text-soft); font-size: 0.8rem; line-height: 1.5; }
  .pcard-divider { border-top: 1px solid var(--border-soft); margin: 0.75rem 0 0.55rem; }
  .pcard-why { font-size: 0.78rem; color: var(--purple-fg); background: var(--purple-bg); border-radius: 8px; padding: 0.45rem 0.6rem; }
  .pcard-kv { display: grid; grid-template-columns: 96px 1fr; gap: 0.4rem 0.7rem; font-size: 0.8rem; margin-top: 0.7rem; }
  .pcard-kv dt { color: var(--text-faint); }
  .pcard-kv dd { margin: 0; color: var(--text-soft); }

  .toast {
    position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
    background: var(--surface-active); border: 1px solid var(--border); color: var(--text); padding: 0.55rem 1rem;
    border-radius: 999px; font-size: 0.8rem; font-weight: 600; box-shadow: var(--shadow-md); opacity: 0;
    transition: opacity .25s ease, transform .25s ease; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-6 9-9 18-9-1 6-4 10-9 12l-3 6-2-6-6-3z"/></svg>
      <span>Wingman</span>
    </div>

    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="Search people & activity" autocomplete="off" />
      <span class="kbd">⌘K</span>
    </div>

    <nav class="navlist">
      <button class="navitem" data-view="now" aria-current="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Now
        <span class="navdot" id="navDot" style="display:none"></span>
        <span class="navcount" id="countNow"></span>
      </button>
      <button class="navitem" data-view="people">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        People
        <span class="navcount" id="countPeople"></span>
      </button>
    </nav>

    <div class="sidebar-spacer"></div>

    <button class="navitem" onclick="window.location.href='/status'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
      Status
    </button>

    <div class="sidebar-foot">
      <div class="avatar-sm" id="meAvatar">Y</div>
      <div>
        <div class="foot-name">You</div>
        <div class="foot-sub" id="meSub">Not started</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <h1 id="mainTitle">Now</h1>
      <div class="main-actions" id="mainActions"></div>
    </div>
    <div class="columns" id="columns"></div>
  </main>

</div>
<div class="toast" id="toast"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const timeAgo = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
};
const CLOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

let view = 'now';                 // 'now' | 'people'
let events = [];
let approvals = [];
let profiles = [];
let schema = { levels: ['L0','L1','L2','L3'], levelLabels: {}, fieldLevels: {} };
let expanded = new Set();         // acard ids currently expanded
let editingId = null;             // approval id whose edit box is open (suspends re-render)
let editDrafts = new Map();       // approval id -> draft text, survives poll
let query = '';

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------------------------------------------------------------- palette
const PALETTE = {
  blue: ['var(--blue-fg)', 'var(--blue-bg)'],
  green: ['var(--green-fg)', 'var(--green-bg)'],
  purple: ['var(--purple-fg)', 'var(--purple-bg)'],
  amber: ['var(--amber-fg)', 'var(--amber-bg)'],
  rose: ['var(--rose-fg)', 'var(--rose-bg)'],
  gray: ['var(--gray-fg)', 'var(--gray-bg)'],
};
const CANDIDATE_COLOR = { maya: 'blue', devon: 'green', priya: 'purple', sam: 'amber', lena: 'rose' };
const LEVEL_COLOR = { L0: 'gray', L1: 'blue', L2: 'amber', L3: 'rose' };

function pill(text, colorKey) {
  const [fg, bg] = PALETTE[colorKey] ?? PALETTE.gray;
  return `<span class="pill" style="color:${fg};background:${bg}">${esc(text)}</span>`;
}

// ------------------------------------------------------------------ search
function matches(hay) {
  if (!query) return true;
  return hay.toLowerCase().includes(query.toLowerCase());
}

// ------------------------------------------------------------------- cards
function actionLabel(action) {
  return { share_detail: 'Share a detail', send_intro: 'Send an introduction', book_date: 'Propose a date' }[action] ?? action;
}

function approvalCard(a, index, isTopOfQueue) {
  const id = 'appr-' + a.id;
  const open = expanded.has(id);
  const fieldPills = a.fields.map(f => pill(`${f} · ${schema.fieldLevels[f] ?? ''}`, LEVEL_COLOR[schema.fieldLevels[f]] ?? 'gray')).join('');
  const candPill = pill(a.candidateName, CANDIDATE_COLOR[a.candidateId] ?? 'gray');

  const quickActions = isTopOfQueue && !open ? `
    <div class="acard-actions">
      <button class="btn btn-primary btn-block" data-act="approve" data-id="${a.id}">Approve</button>
      <button class="btn btn-block" data-act="expand" data-target="${id}">Review</button>
    </div>` : '';

  const expandBlock = open ? renderApprovalExpand(a) : '';

  return `
    <div class="acard" data-open="${open}" data-kind="approval" data-target="${id}">
      <div class="acard-head">
        <div class="acard-num">${index}</div>
        <div class="acard-title">${esc(actionLabel(a.action))} — ${esc(a.candidateName)}</div>
        <svg class="acard-chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="badges">${candPill}${fieldPills}<span class="pill-time">${CLOCK_SVG}${timeAgo(a.ts)}</span></div>
      <div class="acard-desc">${esc(a.sentence)}</div>
      ${quickActions}
      ${expandBlock}
    </div>`;
}

function renderApprovalExpand(a) {
  const resolved = a.status === 'resolved';
  if (resolved) {
    const ok = a.decision !== 'decline';
    return `
      <div class="expand">
        <div class="quote">${esc(a.sentSentence || a.sentence)}</div>
        <div class="resolved-tag ${ok ? 'ok' : 'no'}">
          ${ok ? '✓ Sent' + (a.decision === 'edit' ? ' (edited)' : a.decision === 'vaguer' ? ' (said less)' : '') : '✕ Declined'}
        </div>
      </div>`;
  }
  const draft = editDrafts.has(a.id) ? editDrafts.get(a.id) : a.sentence;
  return `
    <div class="expand">
      <div class="quote">${esc(a.sentence)}</div>
      <div class="expand-actions">
        <button class="btn btn-primary" data-act="approve" data-id="${a.id}">Approve</button>
        <button class="btn" data-act="edit-toggle" data-id="${a.id}">Edit</button>
        <button class="btn btn-soft" data-act="vaguer" data-id="${a.id}">Say less</button>
        <button class="btn btn-danger" data-act="decline" data-id="${a.id}">Decline</button>
      </div>
      ${editingId === a.id ? `
        <div class="edit-box">
          <textarea id="editText">${esc(draft)}</textarea>
          <div class="expand-actions">
            <button class="btn btn-primary" data-act="send-edit" data-id="${a.id}">Send edited</button>
          </div>
        </div>` : ''}
    </div>`;
}

function eventCard(e, index) {
  const id = 'evt-' + e.id;
  const open = expanded.has(id);
  const colorKey = e.state === 'did' ? 'green' : 'blue';
  const statusPill = pill(e.state === 'did' ? 'Done' : 'In progress', colorKey);
  return `
    <div class="acard" data-open="${open}" data-kind="event" data-target="${id}">
      <div class="acard-head">
        <div class="acard-num">${index}</div>
        <div class="acard-title">${esc(e.title)}</div>
        <svg class="acard-chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="badges">${pill(e.actor, 'gray')}${statusPill}<span class="pill-time">${CLOCK_SVG}${timeAgo(e.ts)}</span></div>
      <div class="acard-desc">${esc(e.detail)}</div>
      <div class="acard-divider"></div>
      <div class="acard-foot"><span>${timeAgo(e.ts)}</span><span class="mono">${esc(e.actor)}</span></div>
    </div>`;
}

// ----------------------------------------------------------------- columns
function renderNow() {
  $('mainTitle').textContent = 'Now';
  $('mainActions').innerHTML = `
    <button class="btn btn-primary" id="runDemoBtn">Run demo</button>
    <button class="btn" id="resetDemoBtn">Reset</button>`;
  $('runDemoBtn').addEventListener('click', async () => {
    await fetch('/api/demo/run', { method: 'POST' });
    toast('Wingman is on it.');
    await load();
  });
  $('resetDemoBtn').addEventListener('click', async () => {
    await fetch('/api/demo/reset', { method: 'POST' });
    expanded.clear(); editDrafts.clear(); editingId = null;
    toast('Cleared.');
    await load();
  });

  const pending = approvals.filter(a => a.status === 'pending' && matches(a.sentence + ' ' + a.candidateName));
  const doing = [...events].reverse().filter(e => e.state === 'doing' && matches(e.title + ' ' + e.detail)).slice(0, 8);
  const done = [...events].reverse().filter(e => e.state === 'did' && matches(e.title + ' ' + e.detail)).slice(0, 8);

  const waitingCol = `
    <div class="col">
      <div class="col-head">
        <div class="col-dot amber"></div>
        <div class="col-name">Waiting on you</div>
        <div class="col-count">${pending.length}</div>
      </div>
      <div class="col-stack">
        ${pending.length ? pending.map((a, i) => approvalCard(a, i + 1, i === 0)).join('') : `<div class="empty-col">Nothing needs you right now.</div>`}
      </div>
    </div>`;

  const doingCol = `
    <div class="col">
      <div class="col-head">
        <div class="col-dot blue"></div>
        <div class="col-name">In progress</div>
        <div class="col-count">${doing.length}</div>
      </div>
      <div class="col-stack">
        ${doing.length ? doing.map((e, i) => eventCard(e, i + 1)).join('') : `<div class="empty-col">Nothing running.</div>`}
      </div>
    </div>`;

  const doneCol = `
    <div class="col">
      <div class="col-head">
        <div class="col-dot green"></div>
        <div class="col-name">Done</div>
        <div class="col-count">${done.length}</div>
      </div>
      <div class="col-stack">
        ${done.length ? done.map((e, i) => eventCard(e, i + 1)).join('') : `<div class="empty-col">Nothing finished yet.</div>`}
      </div>
    </div>`;

  $('columns').innerHTML = waitingCol + doingCol + doneCol;
  wireCardEvents();
}

function reasonFor(me, cand) {
  if (!me) return "Your wingman doesn't know you yet — talk to it first, and this will explain the match.";
  const share = ['interests', 'hobbies', 'tastes', 'goodSaturday'];
  const words = (s) => (s || '').toLowerCase().match(/[a-z]{4,}/g) || [];
  const mine = new Set(share.flatMap(f => words(me.fields[f])));
  const found = [];
  for (const f of share) for (const w of words(cand.fields[f])) if (mine.has(w) && !found.includes(w)) found.push(w);
  return found.length ? `You both mention "${found.slice(0, 2).join('" and "')}."` : 'A different vibe from yours — could be a good contrast.';
}

function peopleCard(p, me) {
  const id = 'ppl-' + p.userId;
  const open = expanded.has(id);
  const name = p.fields.name || p.userId;
  const initial = name.trim()[0]?.toUpperCase() ?? '?';
  const colorKey = CANDIDATE_COLOR[p.userId] ?? 'gray';
  const [fg, bg] = PALETTE[colorKey];
  const rows = open ? Object.entries(p.views.L1.fields).map(([k, v]) => `
      <dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') : '';
  return `
    <div class="pcard" data-kind="people" data-target="${id}">
      <div class="pcard-head">
        <div class="avatar-md" style="color:${fg};background:${bg}">${esc(initial)}</div>
        <div>
          <div class="pcard-name">${esc(name)}</div>
        </div>
      </div>
      <div class="pcard-badges">
        ${pill(p.fields.ageBand ?? '—', 'gray')}
        ${pill(p.fields.area ?? '—', colorKey)}
      </div>
      <div class="pcard-desc">${esc(p.fields.goodSaturday || p.fields.vibe || '')}</div>
      <div class="pcard-divider"></div>
      <div class="pcard-why">${esc(reasonFor(me, p))}</div>
      ${open ? `<dl class="pcard-kv">${rows}</dl>` : ''}
    </div>`;
}

function renderPeople() {
  $('mainTitle').textContent = 'People';
  $('mainActions').innerHTML = '';
  const me = profiles.find(x => x.userId === 'me');
  const cands = profiles.filter(p => p.isPersona).filter(p => matches((p.fields.name || p.userId) + ' ' + (p.fields.vibe || '')));
  $('columns').innerHTML = `<div class="people-grid" style="width:100%">${
    cands.length ? cands.map(p => peopleCard(p, me)).join('') : `<div class="empty-col">No candidates match.</div>`
  }</div>`;
  wireCardEvents();
}

// ------------------------------------------------------------------- wire
function wireCardEvents() {
  document.querySelectorAll('[data-target]').forEach(card => {
    card.addEventListener('click', (ev) => {
      if (ev.target.closest('button, textarea, input')) return;
      const id = card.dataset.target;
      if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
      renderCurrent();
    });
  });
  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const act = btn.dataset.act;
      const id = btn.dataset.id;
      if (act === 'expand') { expanded.add(btn.dataset.target); renderCurrent(); return; }
      if (act === 'edit-toggle') { editingId = editingId === id ? null : id; renderCurrent(); return; }
      if (act === 'approve') return decide(id, 'approve');
      if (act === 'decline') return decide(id, 'decline');
      if (act === 'vaguer') return decide(id, 'vaguer');
      if (act === 'send-edit') return decide(id, 'edit', $('editText').value);
    });
  });
  const editArea = $('editText');
  if (editArea && editingId) {
    editArea.addEventListener('input', () => editDrafts.set(editingId, editArea.value));
  }
}

async function decide(id, decision, editedText) {
  await fetch(`/api/approvals/${id}/decision`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ decision, editedText }),
  });
  editingId = null; editDrafts.delete(id);
  toast(decision === 'decline' ? 'Declined — asking for something vaguer instead.' : 'Sent.');
  await load();
}

document.querySelectorAll('.navitem[data-view]').forEach(btn => {
  btn.addEventListener('click', () => { view = btn.dataset.view; renderCurrent(); });
});
$('search').addEventListener('input', (e) => { query = e.target.value; renderCurrent(); });

function renderCurrent() {
  document.querySelectorAll('.navitem[data-view]').forEach(b => b.setAttribute('aria-current', String(b.dataset.view === view)));
  const pendingCount = approvals.filter(a => a.status === 'pending').length;
  $('countNow').textContent = pendingCount || '';
  $('countPeople').textContent = profiles.filter(p => p.isPersona).length || '';
  $('navDot').style.display = pendingCount ? 'block' : 'none';

  const me = profiles.find(p => p.userId === 'me');
  $('meSub').textContent = me ? `${me.known}/${me.total} fields known` : 'Not started';

  if (view === 'now') renderNow(); else renderPeople();
}

let lastSnapshot = '';

async function load() {
  if (editingId) return; // don't blow away an in-progress edit under the user's cursor
  const [act, pr, sc] = await Promise.all([
    fetch('/api/activity').then(r => r.json()),
    fetch('/api/profiles').then(r => r.json()),
    fetch('/api/schema').then(r => r.json()),
  ]);
  // Skip the re-render (and the DOM churn it causes — lost scroll position,
  // reset hover, stale element refs for anything mid-interaction) when
  // nothing actually changed since the last poll.
  const snapshot = JSON.stringify([act.events, act.approvals, pr.profiles]);
  if (snapshot === lastSnapshot) return;
  lastSnapshot = snapshot;
  events = act.events; approvals = act.approvals;
  profiles = pr.profiles; schema = sc;
  renderCurrent();
}

await load();
setInterval(load, 2000);
</script>
