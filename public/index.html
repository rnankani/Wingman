<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wingman</title>
<link rel="icon" href="/brand/icon-32.png" />
<link rel="apple-touch-icon" href="/brand/icon-180.png" />
<link rel="stylesheet" href="/brand/wingman.css" />
<link rel="stylesheet" href="/theme.css" />
<style>
  body { overflow: hidden; }
  .app { display: grid; grid-template-columns: 272px 1fr; height: 100vh; height: 100dvh; }

  /* ══════════════════════════════════════════════════════════════ sidebar */
  .sidebar { border-right: 1px solid oklch(0 0 0/.4); box-shadow: 1px 0 0 oklch(1 0 0/.03);
    display: flex; flex-direction: column; padding: 20px 16px 16px; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 15px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0/.5), inset 0 -1px 0 oklch(.55 .12 70/.5), var(--cast-1), 0 5px 14px -5px oklch(.8 .16 88/.55); }
  .brand-mark svg { width: 17px; height: 17px; color: var(--yolk-ink); }
  .brand span { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }

  .agent { background: linear-gradient(180deg, var(--panel-hi), var(--panel-lo)); border: 1px solid var(--line);
    border-radius: var(--r-card); box-shadow: var(--raise); padding: 11px 11px 12px; margin-bottom: 16px; text-align: center; }
  .stage { position: relative; border-radius: 12px; background: var(--well); box-shadow: var(--sink);
    padding: 6px 0 2px; margin-bottom: 9px; display: flex; justify-content: center; overflow: hidden; }
  .stage::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 55% at 50% 78%, oklch(.865 .163 94/.13), transparent 70%); }
  .stage .chikny { --chikny-scale: 0.5; position: relative; z-index: 1; }
  .agent[data-pace="waiting"] .stage, .agent[data-pace="doing"] .stage { animation: breathe 1.9s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { box-shadow: var(--sink), 0 0 0 1.5px color-mix(in oklch, var(--yolk) 50%, transparent), 0 0 0 0 oklch(.865 .163 94/.3); }
    50%     { box-shadow: var(--sink), 0 0 0 1.5px color-mix(in oklch, var(--yolk) 70%, transparent), 0 0 22px 3px oklch(.865 .163 94/.16); }
  }
  .agent-state { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .agent[data-pace="waiting"] .agent-state { color: var(--yolk); }
  .agent-sub { font-size: 12.5px; color: var(--text-4); margin-top: 1px; }

  .search { display: flex; align-items: center; gap: 9px; background: var(--well); border: 1px solid oklch(0 0 0/.35);
    border-radius: var(--r-ctl); box-shadow: var(--sink); padding: 9px 11px; margin-bottom: 14px; }
  .search svg { width: 15px; height: 15px; color: var(--text-4); flex: none; }
  .search input { background: none; border: none; outline: none; flex: 1; min-width: 0; font-size: 14px; }
  .search input::placeholder { color: var(--text-4); }
  .kbd { flex: none; font-size: 11.5px; font-weight: 500; color: var(--text-4); border-radius: 6px; padding: 2px 6px;
    background: linear-gradient(180deg, oklch(.33 0 0), oklch(.29 0 0)); box-shadow: var(--lip-soft), 0 1px 2px oklch(0 0 0/.4); }

  .nav { display: flex; flex-direction: column; gap: 6px; }
  .navitem { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
    padding: 10px 12px; border-radius: var(--r-ctl); font-size: 15px; font-weight: 500; letter-spacing: -.006em;
    color: var(--text-2); text-decoration: none; border: 1px solid var(--line);
    background: linear-gradient(180deg, oklch(.305 0 0), oklch(.283 0 0));
    box-shadow: var(--lip-soft), var(--cast-1), 0 3px 7px -3px oklch(0 0 0/.4);
    transition: transform .11s var(--ease-out), box-shadow .16s ease, color .14s ease; }
  .navitem svg { width: 18px; height: 18px; flex: none; color: var(--text-3); transition: color .14s ease; }
  .navitem:hover { transform: translateY(-1px); color: var(--text); box-shadow: var(--lip), var(--cast-1), 0 7px 15px -4px oklch(0 0 0/.48); }
  .navitem:active { transform: translateY(1px); box-shadow: var(--sink); }
  .navitem[aria-current="true"] { color: var(--text); background: linear-gradient(180deg, oklch(.355 0 0), oklch(.305 0 0));
    box-shadow: inset 0 1px 0 oklch(1 0 0/.13), var(--keel), var(--cast-1), 0 8px 18px -5px oklch(0 0 0/.5); }
  .navitem[aria-current="true"] svg { color: var(--yolk); }
  .navitem[aria-current="true"]::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 19px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: 0 0 10px oklch(.865 .163 94/.55); }
  .navitem .count { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--text-3); min-width: 21px; height: 21px;
    padding: 0 6px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    background: var(--well); box-shadow: var(--sink); font-variant-numeric: tabular-nums; }
  .navitem .count.hot { color: var(--yolk-ink); background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0/.45), 0 2px 6px -1px oklch(.8 .16 88/.5); }

  .grow { flex: 1; }
  .whoami { display: flex; align-items: center; gap: 11px; padding: 10px 11px; margin-top: 12px; border-radius: var(--r-ctl);
    background: linear-gradient(180deg, oklch(.30 0 0), oklch(.281 0 0)); border: 1px solid var(--line);
    box-shadow: var(--lip-soft), var(--cast-1); text-decoration: none; color: inherit; }
  .whoami:hover { background: linear-gradient(180deg, oklch(.33 0 0), oklch(.30 0 0)); }
  .whoami .av { width: 32px; height: 32px; border-radius: 50%; flex: none; background: var(--well); box-shadow: var(--sink);
    display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600; color: var(--text-3); }
  .whoami .nm { font-size: 14.5px; font-weight: 550; }
  .whoami .st { font-size: 12.5px; color: var(--text-4); }

  /* ═════════════════════════════════════════════════════════════════ main */
  .main { overflow-y: auto; padding: 24px 28px 60px; min-height: 0; }
  .main-top { display: flex; align-items: center; gap: 13px; margin-bottom: 3px; }
  .main-top h1 { margin: 0; font-size: 29px; font-weight: 600; letter-spacing: -.024em; }
  .main-top .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .tick { font-size: 12.5px; color: var(--text-4); font-variant-numeric: tabular-nums; }
  .headline { font-size: 20px; font-weight: 550; letter-spacing: -.018em; margin: 12px 0 3px; }
  .headline.hot { color: var(--yolk); }
  .sub-line { color: var(--text-3); font-size: 14.5px; margin: 0 0 20px; max-width: 70ch; }

  .iconbtn { width: 36px; height: 36px; padding: 0; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; }
  .iconbtn svg { width: 17px; height: 17px; }

  /* ── continue card ─────────────────────────────────────────────────── */
  .cont { display: flex; align-items: center; gap: 16px; padding: 18px 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .cont .av { width: 56px; height: 56px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; box-shadow: var(--lip), var(--cast-1), 0 7px 18px -6px oklch(0 0 0/.55); }
  .cont .who { font-size: 18px; font-weight: 600; letter-spacing: -.016em; }
  .cont .last { font-size: 14px; color: var(--text-3); margin-top: 3px; }
  .cont .go { margin-left: auto; display: flex; gap: 8px; }

  /* ── graphs ─────────────────────────────────────────────────────────── */
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .panel { padding: 18px 19px; }
  .panel > .eyebrow { display: block; margin-bottom: 14px; }

  .dial { width: 152px; height: 152px; margin: 0 auto 12px; position: relative; border-radius: 50%; }
  .dial .ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: var(--sink); transition: background .6s var(--ease-out); }
  .dial .hole { position: absolute; inset: 17px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
    box-shadow: var(--lip), var(--cast-1), 0 6px 16px -6px oklch(0 0 0/.55); }
  .dial .big { font-size: 32px; font-weight: 650; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
  .dial .small { font-size: 11.5px; color: var(--text-4); margin-top: 4px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }
  .dial-cap { text-align: center; font-size: 13.5px; color: var(--text-3); }

  .lrow { display: grid; grid-template-columns: 92px 1fr 46px; gap: 11px; align-items: center; padding: 6px 0; }
  .lrow .lname { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .ltrack { height: 14px; border-radius: 7px; background: var(--well); box-shadow: var(--sink); overflow: hidden; }
  .lfill { height: 100%; border-radius: 7px; box-shadow: var(--lip-soft); width: 0; transition: width .7s var(--ease-out); }
  .lrow .lct { font-size: 12.5px; color: var(--text-4); text-align: right; font-variant-numeric: tabular-nums; }

  /* who knows you */
  .know { display: flex; align-items: center; gap: 11px; padding: 9px 0; }
  .know .av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; box-shadow: var(--lip-soft), var(--cast-1); }
  .know .nm { font-size: 14px; font-weight: 550; flex: 1; min-width: 0; }
  .pips { display: flex; gap: 4px; }
  .pip { width: 26px; height: 7px; border-radius: 4px; background: oklch(1 0 0/.07); box-shadow: inset 0 1px 2px oklch(0 0 0/.4); }
  .pip.on { box-shadow: var(--lip-soft), 0 0 8px -1px currentColor; }

  /* ── block tower ────────────────────────────────────────────────────── */
  .run { display: grid; grid-template-columns: 292px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 1060px) { .run { grid-template-columns: 1fr; } }
  .tower { padding: 17px 15px 15px; }
  .tower-top { display: flex; align-items: baseline; gap: 8px; }
  .tower-pct { font-size: 32px; font-weight: 650; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  .tower-pct.done { color: var(--green); }
  .tower-cap { font-size: 12.5px; color: var(--text-4); }
  .tower-note { font-size: 12.5px; color: var(--text-4); margin: 2px 0 14px; }
  .blocks { display: flex; flex-direction: column-reverse; gap: 5px; }
  .block { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 10px; font-size: 13.2px; font-weight: 550;
    border: 1px solid oklch(0 0 0/.3); color: var(--text-4); background: var(--well); box-shadow: var(--sink);
    transition: color .25s ease, box-shadow .3s ease, background .3s ease; }
  .block .bi { width: 19px; height: 19px; border-radius: 6px; flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; color: var(--text-4); background: oklch(1 0 0/.06); }
  .block .bl { flex: 1; min-width: 0; }
  .block .lock { width: 13px; height: 13px; flex: none; opacity: 0; transition: opacity .3s ease; }
  .block.done { color: var(--text); border-color: var(--line);
    background: linear-gradient(180deg, oklch(.345 0 0), oklch(.30 0 0));
    box-shadow: var(--lip), var(--keel), var(--cast-1), 0 4px 10px -3px oklch(0 0 0/.45); }
  .block.done .bi { color: var(--green); background: color-mix(in oklch, var(--green) 24%, transparent); }
  .block.done .lock { opacity: 1; color: var(--green); }
  .block.just-landed { animation: land .42s var(--ease-spring); }
  @keyframes land { 0% { transform: translateY(-14px) scale(1.04); } 55% { transform: translateY(3px) scale(.995); } 100% { transform: none; } }
  .block.active { color: var(--text); border-color: color-mix(in oklch, var(--yolk) 40%, transparent);
    background: linear-gradient(180deg, oklch(.35 0 0), oklch(.30 0 0)); animation: working 1.5s ease-in-out infinite; }
  .block.active .bi { color: var(--yolk-ink); background: linear-gradient(180deg, var(--yolk), var(--yolk-deep)); }
  @keyframes working {
    0%,100% { box-shadow: var(--lip), var(--cast-1), 0 0 0 1px color-mix(in oklch, var(--yolk) 25%, transparent); }
    50%     { box-shadow: var(--lip), var(--cast-1), 0 0 0 1px color-mix(in oklch, var(--yolk) 45%, transparent), 0 0 20px 2px oklch(.865 .163 94/.16); }
  }
  .block.gate { color: var(--yolk); border-color: var(--yolk-edge); animation: working 1.05s ease-in-out infinite;
    background: linear-gradient(180deg, color-mix(in oklch, var(--yolk) 20%, oklch(.32 0 0)), color-mix(in oklch, var(--yolk) 12%, oklch(.28 0 0))); }
  .block.gate .bi { color: var(--yolk-ink); background: linear-gradient(180deg, var(--yolk), var(--yolk-deep)); }
  .crown { margin-bottom: 7px; text-align: center; padding: 9px; border-radius: 10px; font-size: 12.5px; font-weight: 650;
    color: var(--text-4); border: 1px dashed oklch(1 0 0/.11); background: var(--well); box-shadow: var(--sink); }
  .crown.lit { color: var(--yolk-ink); border: 1px solid var(--yolk-edge); animation: pop .45s var(--ease-spring);
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0/.5), var(--cast-1), 0 8px 22px -6px oklch(.8 .16 88/.65); }

  /* ── step feed ──────────────────────────────────────────────────────── */
  .feed { display: flex; flex-direction: column; gap: 10px; }
  .fitem { padding: 13px 15px; cursor: pointer; transition: transform .13s var(--ease-out), box-shadow .18s ease; }
  .fitem:hover { transform: translateY(-2px); box-shadow: var(--raise-hi); }
  .fhead { display: flex; align-items: flex-start; gap: 10px; }
  .fdot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 6px; box-shadow: 0 0 9px currentColor; }
  .fdot.doing { background: var(--blue); color: oklch(.72 .14 250/.7); }
  .fdot.did { background: var(--green); color: oklch(.72 .13 145/.7); }
  .fdot.waiting { background: var(--yolk); color: oklch(.865 .163 94/.7); }
  .ftitle { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -.012em; }
  .fstamp { font-size: 12px; color: var(--text-4); flex: none; font-variant-numeric: tabular-nums; text-align: right; }
  .fdetail { margin: 5px 0 0 19px; font-size: 13.8px; color: var(--text-3); line-height: 1.45; }
  .plain { margin: 11px 0 0 19px; padding: 12px 14px; border-radius: 11px; font-size: 14px; line-height: 1.55; color: var(--text-2);
    background: var(--well); box-shadow: var(--sink); animation: rise .3s var(--ease-out); }
  .plain b { color: var(--text); font-weight: 600; }
  .plain .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .fquote { margin: 10px 0 0 19px; padding: 11px 13px; border-radius: 11px; font-size: 14.5px; line-height: 1.5;
    background: var(--well); box-shadow: var(--sink), inset 0 0 26px oklch(.865 .163 94/.05);
    border: 1px solid color-mix(in oklch, var(--yolk) 26%, transparent); }
  .ftags, .facts { display: flex; gap: 7px; flex-wrap: wrap; margin: 10px 0 0 19px; }
  .facts .btn-lg { padding: 11px 22px; font-size: 15px; }
  .editbox { margin: 10px 0 0 19px; }
  .editbox textarea { width: 100%; min-height: 74px; resize: vertical; background: var(--well); border: 1px solid oklch(0 0 0/.35);
    border-radius: 11px; box-shadow: var(--sink); padding: 10px 12px; font-size: 14.5px; line-height: 1.5; outline: none; }
  .editbox textarea:focus { border-color: color-mix(in oklch, var(--yolk) 50%, transparent); }

  /* ── people ─────────────────────────────────────────────────────────── */
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(218px, 1fr)); gap: 15px; }
  .ptile { padding: 19px 17px; text-align: center; cursor: pointer; transition: transform .14s var(--ease-out), box-shadow .18s ease; }
  .ptile:hover { transform: translateY(-4px); box-shadow: var(--raise-hi); }
  .ptile .av { width: 58px; height: 58px; border-radius: 50%; margin: 0 auto 11px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; box-shadow: var(--lip), var(--cast-1), 0 7px 18px -6px oklch(0 0 0/.55); }
  .ptile .nm { font-size: 16px; font-weight: 600; letter-spacing: -.014em; }
  .ptile .rl { font-size: 12.5px; color: var(--text-4); margin-top: 2px; }
  .ptile .bar { display: flex; gap: 3px; margin-top: 12px; }
  .ptile .seg { height: 5px; flex: 1; border-radius: 3px; background: oklch(1 0 0/.08); box-shadow: inset 0 1px 2px oklch(0 0 0/.4); }
  .ptile .seg.on { box-shadow: var(--lip-soft), 0 0 8px -1px currentColor; }
  .ptile .cap { font-size: 11.5px; color: var(--text-4); margin-top: 8px; }

  .back { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 15px; font-size: 13.5px; font-weight: 550;
    color: var(--text-3); cursor: pointer; background: none; border: none; padding: 5px 3px; }
  .back:hover { color: var(--text); }
  .back svg { width: 15px; height: 15px; }
  .phero { display: flex; align-items: center; gap: 17px; margin-bottom: 22px; flex-wrap: wrap; }
  .phero .av { width: 78px; height: 78px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; box-shadow: var(--lip), var(--cast-1), 0 10px 26px -8px oklch(0 0 0/.6); }
  .phero h2 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.026em; }
  .phero .meta { font-size: 14px; color: var(--text-3); margin-top: 3px; }
  .pcols { display: grid; grid-template-columns: 244px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 920px) { .pcols { grid-template-columns: 1fr; } }

  .stepper { display: flex; gap: 6px; margin-bottom: 18px; }
  .step { flex: 1; padding: 10px 7px; border-radius: 11px; cursor: pointer; text-align: center; border: 1px solid var(--line);
    color: var(--text-3); background: linear-gradient(180deg, oklch(.325 0 0), oklch(.292 0 0));
    box-shadow: var(--lip-soft), var(--cast-1); transition: transform .1s var(--ease-out), color .13s ease; }
  .step:hover { transform: translateY(-1px); color: var(--text); }
  .step .sl { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .step .sn { font-size: 11px; margin-top: 2px; opacity: .85; }
  .step[aria-selected="true"] { color: var(--yolk-ink); border-color: var(--yolk-edge);
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0/.5), var(--cast-1), 0 6px 15px -5px oklch(.8 .16 88/.55); }

  .frow { display: grid; grid-template-columns: minmax(100px,auto) 1fr; gap: 8px 14px; font-size: 14px; }
  .frow dt { font-weight: 600; color: var(--text-2); }
  .frow dd { margin: 0; color: var(--text-3); }
  .lvl { font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 5px; margin-left: 6px; vertical-align: 1.5px; }
  .lvl.L0 { color: var(--text-2); background: oklch(1 0 0/.09); }
  .lvl.L1 { color: var(--blue); background: color-mix(in oklch, var(--blue) 20%, transparent); }
  .lvl.L2 { color: var(--amber); background: color-mix(in oklch, var(--amber) 20%, transparent); }
  .lvl.L3 { color: var(--purple); background: color-mix(in oklch, var(--purple) 20%, transparent); }
  .locked { margin-top: 15px; padding-top: 13px; border-top: 1px solid oklch(0 0 0/.3); box-shadow: inset 0 1px 0 oklch(1 0 0/.05); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; font-family: ui-monospace, Menlo, monospace; padding: 5px 9px; border-radius: 8px;
    background: var(--well); box-shadow: var(--sink); color: var(--text-4); }
  .chip.red { color: var(--red); }

  /* ── settings ───────────────────────────────────────────────────────── */
  .setgrid { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .setgrid { grid-template-columns: 1fr; } }
  .fieldset { margin-bottom: 18px; }
  .fhead2 { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
  .fhead2 .lvl { margin: 0; }
  .fhead2 .ttl { font-size: 15px; font-weight: 600; }
  .fhead2 .cnt { margin-left: auto; font-size: 12.5px; color: var(--text-4); }
  .inrow { display: grid; grid-template-columns: 128px 1fr; gap: 10px 13px; align-items: center; margin-bottom: 8px; }
  .inrow label { font-size: 13.5px; font-weight: 550; color: var(--text-2); }
  .inrow input { width: 100%; background: var(--well); border: 1px solid oklch(0 0 0/.35); border-radius: 9px;
    box-shadow: var(--sink); padding: 9px 11px; font-size: 14px; outline: none; transition: border-color .15s ease; }
  .inrow input:focus { border-color: color-mix(in oklch, var(--yolk) 50%, transparent); }
  .inrow input::placeholder { color: var(--text-4); }

  .seg3 { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--well); box-shadow: var(--sink); }
  .seg3 button { flex: 1; padding: 7px 6px; border-radius: 8px; border: none; background: none; cursor: pointer;
    font-size: 12.5px; font-weight: 600; color: var(--text-4); transition: color .13s ease; }
  .seg3 button:hover { color: var(--text-2); }
  .seg3 button[aria-pressed="true"] { color: var(--yolk-ink); background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0/.45), var(--cast-1); }
  .seg3 button[aria-pressed="true"][data-p="never"] { color: #fff; background: linear-gradient(180deg, var(--red), oklch(.58 .17 25)); }
  .polrow { display: grid; grid-template-columns: 122px 1fr; gap: 12px; align-items: center; margin-bottom: 9px; }
  .polrow .pl { font-size: 13.5px; font-weight: 600; }
  .polrow .pd { font-size: 11.5px; color: var(--text-4); }

  .tagin { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; padding: 9px; border-radius: 10px;
    background: var(--well); box-shadow: var(--sink); }
  .tagin input { flex: 1; min-width: 110px; background: none; border: none; outline: none; font-size: 13.5px; padding: 3px; }
  .nchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 6px 4px 10px;
    border-radius: 999px; color: var(--red); background: color-mix(in oklch, var(--red) 18%, transparent); box-shadow: var(--lip-soft); }
  .nchip button { border: none; background: none; cursor: pointer; color: inherit; font-size: 15px; line-height: 1; padding: 0 2px; opacity: .7; }
  .nchip button:hover { opacity: 1; }

  .slider { width: 100%; accent-color: var(--yolk); }

  .hollow { border: 1px dashed oklch(1 0 0/.1); border-radius: var(--r-card); padding: 34px 18px; text-align: center;
    font-size: 14px; color: var(--text-4); box-shadow: inset 0 1px 4px oklch(0 0 0/.25); }
  .hollow .big2 { font-size: 16.5px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
  .fix { display: inline-block; margin-top: 9px; font-size: 12px; background: var(--well); box-shadow: var(--sink);
    border-radius: 8px; padding: 5px 9px; color: var(--yolk); font-family: ui-monospace, Menlo, monospace; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, oklch(.34 0 0), oklch(.3 0 0)); border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 550;
    box-shadow: var(--lip), var(--cast-1), 0 20px 44px -14px oklch(0 0 0/.75);
    opacity: 0; transition: opacity .22s ease, transform .22s ease; pointer-events: none; z-index: 40; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-5px); }

  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-6 9-9 18-9-1 6-4 10-9 12l-3 6-2-6-6-3z"/></svg>
      </div>
      <span>Wingman</span>
    </div>

    <div class="agent" id="agent" data-pace="idle">
      <div class="stage"><div class="chikny chikny--idle" id="duck" role="img" aria-label="Wingman agent"></div></div>
      <div class="agent-state" id="agentState">Idle</div>
      <div class="agent-sub" id="agentSub">Nothing running</div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search" autocomplete="off" />
      <span class="kbd">⌘K</span>
    </div>

    <nav class="nav">
      <button class="navitem" data-view="now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10V20h13V10"/></svg>
        Overview
      </button>
      <button class="navitem" data-view="agent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V4"/><circle cx="9" cy="13" r="1.2" fill="currentColor"/><circle cx="15" cy="13" r="1.2" fill="currentColor"/></svg>
        Agent
        <span class="count" id="cAgent"></span>
      </button>
      <button class="navitem" data-view="people">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4"/><path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8"/></svg>
        People
        <span class="count" id="cPeople"></span>
      </button>
      <button class="navitem" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 7 2.6h.1A1.6 1.6 0 0 0 8.7 1V1a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15 2.6" transform="scale(0.86) translate(2 2)"/></svg>
        Settings
      </button>
      <a class="navitem" href="/status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 20v-5"/><path d="M12 20V8"/><path d="M18 20v-9"/></svg>
        Status
      </a>
    </nav>

    <div class="grow"></div>

    <a class="whoami" href="#/settings">
      <div class="av">Y</div>
      <div>
        <div class="nm">You</div>
        <div class="st" id="meState">No profile yet</div>
      </div>
    </a>
  </aside>

  <main class="main">
    <div class="main-top">
      <h1 id="title">Overview</h1>
      <div class="acts" id="acts"></div>
    </div>
    <div id="body"></div>
  </main>

</div>
<div class="toast" id="toast"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
const ago = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return clock(iso);
};

let view = 'now', person = null, query = '';
let events = [], approvals = [], profiles = [], status = { checks: [], tools: [] };
let schema = { levels: ['L0','L1','L2','L3'], levelLabels: {}, fieldLevels: {} };
let catalogue = { fields: [] };
const levelOf = new Map();
let openStep = null, editingId = null, drafts = new Map(), lastSnap = '';
let landed = new Set();          // blocks already animated, so they land once
let showAgentSettings = false;
let meDraft = null;              // unsaved settings edits

const TONE = { maya: 'blue', devon: 'green', priya: 'purple', sam: 'amber', lena: 'gray' };
const LEVEL_TONE = { L0: 'gray', L1: 'blue', L2: 'amber', L3: 'purple' };
const LEVEL_CSS = { L0: 'oklch(0.72 0 0)', L1: 'var(--blue)', L2: 'var(--amber)', L3: 'var(--purple)' };
const ACT_LABEL = { share_detail: 'Share a detail', send_intro: 'Send an introduction', book_date: 'Propose a date' };
const hit = (s) => !query || s.toLowerCase().includes(query.toLowerCase());
const me = () => profiles.find(p => !p.isPersona);

function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* Count a number up instead of snapping to it. */
function countUp(el, to, suffix = '') {
  const from = Number(el.dataset.v || 0);
  if (from === to) { el.textContent = to + suffix; return; }
  el.dataset.v = to;
  const t0 = performance.now(), dur = 520;
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * eased) + suffix;
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function animateNumbers() {
  document.querySelectorAll('[data-count]').forEach(el => countUp(el, Number(el.dataset.count), el.dataset.suffix || ''));
  // bars/arcs start at 0 in markup, then transition to their real value
  requestAnimationFrame(() => {
    document.querySelectorAll('[data-w]').forEach(el => { el.style.width = el.dataset.w + '%'; });
    document.querySelectorAll('[data-arc]').forEach(el => { el.style.background = el.dataset.arc; });
  });
}

/* ═══════════════════════════════════════════════════ the run, as blocks */
const STEPS = [
  { label: 'Read your profile',     rx: /reading your profile/i,      why: 'Loaded what you have told it so far, using the read-only get_profile tool. Reading your own file is not a disclosure, so it never stops to ask.' },
  { label: 'Compare 5 candidates',  rx: /comparing you against/i,     why: 'Pulled every seeded candidate with list_candidates and compared them against your interests, schedule and dealbreakers. Still nothing has left your device.' },
  { label: 'Pick the best match',   rx: /found a strong match/i,      why: 'Chose the candidate with the most overlap and can say, in plain words, which shared detail decided it.' },
  { label: 'Open the conversation', rx: /opening a conversation/i,    why: 'Started at L0 (public) — vibe and broad interests only. Nothing identifying is on the table yet.' },
  { label: 'Share a detail',        action: 'share_detail' },
  { label: 'They answer back',      rx: /wingman answered/i,          why: 'The other side replied. Their answer is theirs to disclose; it tells you nothing you were not offered.' },
  { label: 'Send an introduction',  action: 'send_intro' },
  { label: 'Find a time and place', rx: /finding a time/i,            why: 'Looked for somewhere between the two neighbourhoods and checked it against your stated availability.' },
  { label: 'Propose the date',      action: 'book_date' },
];

function towerState() {
  const titles = events.map(e => e.title);
  return STEPS.map(s => {
    if (s.action) {
      const a = [...approvals].reverse().find(x => x.action === s.action);
      if (!a) return 'pending';
      return a.status === 'pending' ? 'gate' : 'done';
    }
    return titles.some(t => s.rx.test(t)) ? 'done' : 'pending';
  });
}

function renderTower() {
  const st = towerState();
  const nextIdx = st.findIndex(s => s !== 'done');
  if (nextIdx !== -1 && st[nextIdx] === 'pending' && events.length) st[nextIdx] = 'active';
  const done = st.filter(s => s === 'done').length;
  const pct = Math.round((done / STEPS.length) * 100);
  const complete = done === STEPS.length;

  const blocks = STEPS.map((s, i) => {
    const k = st[i];
    const fresh = k === 'done' && !landed.has(i);
    if (k === 'done') landed.add(i);
    return `<div class="block ${k}${fresh ? ' just-landed' : ''}">
      <span class="bi">${k === 'done' ? '✓' : i + 1}</span>
      <span class="bl">${esc(s.label)}</span>
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
    </div>`;
  }).join('');

  return `
    <div class="card tower">
      <div class="tower-top"><span class="tower-pct ${complete ? 'done' : ''}" data-count="${pct}" data-suffix="%">0%</span><span class="tower-cap">${done} of ${STEPS.length} steps</span></div>
      <div class="tower-note">${complete ? 'Every block landed.' : 'A block lands only when that step really happened.'}</div>
      <div class="crown ${complete ? 'lit' : ''}">${complete ? '★ Matched — 100%' : 'Top block = done'}</div>
      <div class="blocks">${blocks}</div>
    </div>`;
}

/* ══════════════════════════════════════════ plain-English step explainer */
function plainFor(kind, item) {
  if (kind === 'approval') {
    const budget = me()?.budget;
    const lv = item.fields.map(f => schema.fieldLevels[f]).filter(Boolean);
    const top = lv.sort((a, b) => b.localeCompare(a))[0] ?? 'L1';
    const pol = budget?.levels?.[top] ?? 'ask';
    return `
      <b>What it wants to do.</b> Send one sentence to ${esc(item.candidateName)}'s wingman.<br>
      <b>What that reveals.</b> ${item.fields.length ? item.fields.map(f => `${esc(f)} (${schema.fieldLevels[f]})`).join(', ') : 'nothing new'}.<br>
      <b>Why it stopped.</b> The highest rung here is <b>${top}</b>, and you set ${top} to <b>${esc(pol)}</b>, so it has to ask before it speaks.<br>
      <b>Your options.</b> Approve sends it as written. Edit sends your words instead. Say less swaps in a vaguer version. Decline sends nothing and it will offer something softer.
      <div class="row">${item.fields.map(f => `<span class="tag tag-${LEVEL_TONE[schema.fieldLevels[f]] ?? 'gray'}">${esc(f)} · ${esc(schema.fieldLevels[f] ?? '')}</span>`).join('')}</div>`;
  }
  const step = STEPS.find(s => s.rx && s.rx.test(item.title));
  // A resolved disclosure did stop for consent, so it must never be captioned
  // as something that ran unattended.
  if (item.state === 'waiting' || /^waiting on you/i.test(item.title)) {
    return `
      <b>In plain English.</b> ${esc(item.detail)}<br>
      <b>Why it stopped.</b> This step would have revealed something about you, so it asked first.<br>
      <b>When.</b> ${clock(item.ts)} (${ago(item.ts)}).`;
  }
  if (/^sent|^declined/i.test(item.title)) {
    return `
      <b>In plain English.</b> ${esc(item.detail)}<br>
      <b>How this got here.</b> You decided this one yourself — it did not go out until you said so.<br>
      <b>When.</b> ${clock(item.ts)} (${ago(item.ts)}).`;
  }
  const extra = step?.why ?? 'This step ran on its own because it did not disclose anything about you.';
  return `
    <b>In plain English.</b> ${esc(item.detail)}<br>
    <b>Why it did not ask you.</b> ${esc(extra)}<br>
    <b>When.</b> ${clock(item.ts)} (${ago(item.ts)}).`;
}

function approvalItem(a) {
  const isOpen = openStep === a.id;
  const draft = drafts.has(a.id) ? drafts.get(a.id) : a.sentence;
  return `
    <div class="card fitem anim-rise" data-step="${a.id}">
      <div class="fhead">
        <span class="fdot waiting"></span>
        <span class="ftitle">${esc(ACT_LABEL[a.action] ?? a.action)} — waiting for you</span>
        <span class="fstamp">${clock(a.ts)}<br>${ago(a.ts)}</span>
      </div>
      <div class="fdetail">Nothing below leaves your device until you decide.</div>
      <div class="fquote">${esc(a.sentence)}</div>
      ${isOpen ? `<div class="plain">${plainFor('approval', a)}</div>` : ''}
      <div class="facts">
        <button class="btn btn-yolk btn-lg" data-act="approve" data-id="${a.id}">Approve</button>
        <button class="btn btn-lg" data-act="decline" data-id="${a.id}">Decline</button>
        <button class="btn" data-act="edit" data-id="${a.id}">Edit</button>
        <button class="btn" data-act="vaguer" data-id="${a.id}">Say less</button>
      </div>
      ${editingId === a.id ? `
        <div class="editbox">
          <textarea id="editText">${esc(draft)}</textarea>
          <div class="facts" style="margin-left:0"><button class="btn btn-yolk" data-act="send-edit" data-id="${a.id}">Send edited</button></div>
        </div>` : ''}
    </div>`;
}

function eventItem(e) {
  const isOpen = openStep === e.id;
  return `
    <div class="card fitem anim-rise" data-step="${e.id}">
      <div class="fhead">
        <span class="fdot ${e.state}"></span>
        <span class="ftitle">${esc(e.title)}</span>
        <span class="fstamp">${clock(e.ts)}<br>${ago(e.ts)}</span>
      </div>
      <div class="fdetail">${esc(e.detail)}</div>
      ${isOpen ? `<div class="plain">${plainFor('event', e)}</div>` : ''}
    </div>`;
}

/* ══════════════════════════════════════════════════ Overview (your stats) */
function renderNow() {
  $('title').textContent = 'Overview';
  $('acts').innerHTML = `<span class="tick">${clock(new Date().toISOString())}</span>`;

  const m = me();
  const known = m?.known ?? 0, total = m?.total ?? 15;
  const pct = total ? Math.round((known / total) * 100) : 0;
  const cands = profiles.filter(p => p.isPersona);
  const last = [...approvals].reverse()[0] ?? null;
  const pending = approvals.filter(a => a.status === 'pending').length;

  const cont = last ? `
    <div class="card cont anim-pop">
      <div class="av tag-${TONE[last.candidateId] ?? 'gray'}">${esc(last.candidateName.trim()[0].toUpperCase())}</div>
      <div style="min-width:0">
        <div class="who">${esc(last.candidateName)}</div>
        <div class="last">${pending ? 'Your wingman is waiting on you' : 'Last step'} · ${esc(ACT_LABEL[last.action] ?? last.action)} · ${ago(last.ts)}</div>
      </div>
      <div class="go">
        <button class="btn btn-yolk" data-goto="#/agent">${pending ? 'Review and continue' : 'Continue chat'}</button>
        <button class="btn" data-goto="#/people/${esc(last.candidateId)}">View profile</button>
      </div>
    </div>`
    : `<div class="card cont anim-pop">
        <div class="av tag-gray">?</div>
        <div style="min-width:0">
          <div class="who">No conversation yet</div>
          <div class="last">Start a run and your wingman will open one for you.</div>
        </div>
        <div class="go"><button class="btn btn-yolk" data-goto="#/agent">Go to Agent</button></div>
      </div>`;

  // fields you have filled in, per rung
  const perLevel = schema.levels.map(l => {
    const all = catalogue.fields.filter(f => f.level === l);
    const filled = m ? all.filter(f => m.fields[f.field] != null && m.fields[f.field] !== '').length : 0;
    return { l, filled, all: all.length };
  });
  const bars = perLevel.map(x => `
    <div class="lrow">
      <span class="lname">${x.l} ${esc(schema.levelLabels[x.l] ?? '')}</span>
      <div class="ltrack"><div class="lfill" data-w="${x.all ? (x.filled / x.all) * 100 : 0}" style="background:linear-gradient(90deg, color-mix(in oklch, ${LEVEL_CSS[x.l]} 55%, transparent), ${LEVEL_CSS[x.l]})"></div></div>
      <span class="lct">${x.filled}/${x.all}</span>
    </div>`).join('');

  // how far up the ladder each candidate could currently see you
  const budget = m?.budget;
  const knows = cands.map(c => {
    const reach = schema.levels.filter(l => (budget?.levels?.[l] ?? 'ask') === 'free');
    const pips = schema.levels.map(l => {
      const on = reach.includes(l);
      return `<span class="pip ${on ? 'on' : ''}" style="${on ? `background:${LEVEL_CSS[l]};color:${LEVEL_CSS[l]}` : ''}"></span>`;
    }).join('');
    return `<div class="know">
      <div class="av tag-${TONE[c.userId] ?? 'gray'}">${esc((c.fields.name || c.userId).trim()[0].toUpperCase())}</div>
      <div class="nm">${esc(c.fields.name || c.userId)}</div>
      <div class="pips">${pips}</div>
    </div>`;
  }).join('');

  const deg = pct * 3.6;
  $('body').innerHTML = `
    <div class="headline">${m ? 'Here is where you stand.' : 'Your wingman does not know you yet.'}</div>
    <p class="sub-line">${m ? 'What is on file about you, and how much of it your wingman is currently allowed to pass on.' : 'Fill in your profile in Settings and this page fills up with it.'}</p>
    ${cont}
    <div class="grid2 stagger">
      <div class="card panel" style="--i:0">
        <span class="eyebrow">Your profile</span>
        <div class="dial">
          <div class="ring" data-arc="conic-gradient(var(--yolk) ${deg}deg, oklch(1 0 0/.06) ${deg}deg)" style="background:conic-gradient(var(--yolk) 0deg, oklch(1 0 0/.06) 0deg)"></div>
          <div class="hole"><div class="big num" data-count="${known}">0</div><div class="small">of ${total} filled</div></div>
        </div>
        <div class="dial-cap">${pct}% complete · <a href="#/settings" style="color:var(--yolk);text-decoration:none">edit</a></div>
      </div>
      <div class="card panel" style="--i:1">
        <span class="eyebrow">Filled in, by rung</span>
        ${bars}
      </div>
      <div class="card panel" style="--i:2">
        <span class="eyebrow">How far each candidate could see</span>
        ${knows || '<div class="dial-cap">No candidates seeded.</div>'}
        <div class="dial-cap" style="margin-top:12px">Lit pips are rungs your budget marks <b>free</b>. Anything else has to ask you first.</div>
      </div>
    </div>`;

  wireGoto();
  animateNumbers();
}

/* ═══════════════════════════════════════════════════ Agent (agent stats) */
function renderAgent() {
  $('title').textContent = 'Agent';
  $('acts').innerHTML = `
    <span class="tick">${clock(new Date().toISOString())}</span>
    <button class="btn iconbtn" id="gear" title="Approval settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
    </button>
    <button class="btn btn-yolk" id="run">Run</button>
    <button class="btn" id="clear">Reset</button>`;
  $('run').onclick = async () => { await fetch('/api/demo/run', { method: 'POST' }); landed.clear(); toast('Wingman is on it.'); await load(true); };
  $('clear').onclick = async () => {
    await fetch('/api/demo/reset', { method: 'POST' });
    drafts.clear(); editingId = null; openStep = null; landed.clear(); toast('Cleared.'); await load(true);
  };
  $('gear').onclick = () => { showAgentSettings = !showAgentSettings; draw(); };

  const pending = approvals.filter(a => a.status === 'pending');
  const st = towerState();
  const pct = Math.round((st.filter(s => s === 'done').length / STEPS.length) * 100);
  const headline = pending.length ? 'Your wingman is waiting on you.'
    : !events.length ? 'Your wingman is idle.'
    : pct === 100 ? 'Your wingman finished the run.' : 'Your wingman is working.';

  const budget = me()?.budget;
  const gearPanel = showAgentSettings ? `
    <div class="card panel anim-rise" style="margin-bottom:18px">
      <span class="eyebrow">When should it stop and ask you?</span>
      ${schema.levels.map(l => {
        const pol = budget?.levels?.[l] ?? 'ask';
        return `<div class="polrow">
          <div><div class="pl">${l} ${esc(schema.levelLabels[l] ?? '')}</div><div class="pd">${esc((catalogue.fields.filter(f => f.level === l).map(f => f.field).join(', ')) || '')}</div></div>
          <div class="seg3">
            ${['free','ask','never'].map(p => `<button data-pol="${l}" data-p="${p}" aria-pressed="${pol === p}">${p === 'free' ? 'Just do it' : p === 'ask' ? 'Ask me' : 'Never'}</button>`).join('')}
          </div>
        </div>`;
      }).join('')}
      <div class="dial-cap" style="text-align:left;margin-top:10px">This is the same consent budget the disclosure tools read — changing it here changes what the agent may say.</div>
    </div>` : '';

  // A pending approval already has its own card at the top; the "waiting on you"
  // event it also emits would sit right under it saying the same thing twice.
  const pendingIds = new Set(pending.map(a => a.id));
  const items = [
    ...pending.map(approvalItem),
    ...[...events].reverse()
      .filter(e => !(e.approvalId && pendingIds.has(e.approvalId)))
      .filter(e => hit(e.title + ' ' + e.detail))
      .map(eventItem),
  ].join('') || `<div class="hollow"><div class="big2">Nothing has happened yet</div>Press <b>Run</b> and every step will appear here with a timestamp.</div>`;

  $('body').innerHTML = `
    <div class="headline ${pending.length ? 'hot' : ''}">${headline}</div>
    <p class="sub-line">Every step your wingman takes, in order, with the time it happened. Tap any step to read what it actually did in plain English.</p>
    ${gearPanel}
    <div class="run">
      ${renderTower()}
      <div class="feed">${items}</div>
    </div>`;

  // tapping a step toggles its plain-English explanation
  $('body').querySelectorAll('[data-step]').forEach(el => el.addEventListener('click', ev => {
    if (ev.target.closest('button, textarea, input')) return;
    openStep = openStep === el.dataset.step ? null : el.dataset.step;
    draw();
  }));
  $('body').querySelectorAll('[data-pol]').forEach(b => b.addEventListener('click', async () => {
    await saveBudget({ levels: { [b.dataset.pol]: b.dataset.p } });
    toast(`${b.dataset.pol} → ${b.dataset.p}`);
  }));
  wireActs();
  animateNumbers();
}

/* ══════════════════════════════════════════════════════════════ People */
function renderPeople() {
  $('title').textContent = 'People';
  $('acts').innerHTML = `<span class="tick">${clock(new Date().toISOString())}</span>`;
  const list = profiles.filter(p => p.isPersona).filter(p => hit(p.userId + ' ' + Object.values(p.fields).join(' ')));
  if (!list.length) { $('body').innerHTML = `<div class="hollow"><div class="big2">No candidates</div><span class="fix">npm run seed</span></div>`; return; }

  $('body').innerHTML = `
    <p class="sub-line">Tap anyone to see exactly what your wingman may reveal about them, rung by rung.</p>
    <div class="pgrid stagger">${list.map((p, i) => {
      const tone = TONE[p.userId] ?? 'gray';
      const name = p.fields.name || p.userId;
      const segs = schema.levels.map((l, li) => {
        const n = Object.keys(p.views[l].fields).length;
        const prev = li ? Object.keys(p.views[schema.levels[li - 1]].fields).length : 0;
        return `<span class="seg ${n > prev ? 'on' : ''}" style="${n > prev ? `background:${LEVEL_CSS[l]};color:${LEVEL_CSS[l]}` : ''}"></span>`;
      }).join('');
      return `<div class="card ptile" style="--i:${i}" data-person="${esc(p.userId)}">
        <div class="av tag-${tone}">${esc(name.trim()[0].toUpperCase())}</div>
        <div class="nm">${esc(name)}</div>
        <div class="rl">Candidate</div>
        <div class="bar">${segs}</div>
        <div class="cap">${p.known}/${p.total} fields on file</div>
      </div>`;
    }).join('')}</div>`;

  $('body').querySelectorAll('[data-person]').forEach(el =>
    el.addEventListener('click', () => go('#/people/' + encodeURIComponent(el.dataset.person))));
}

function renderPerson() {
  const p = profiles.find(x => x.userId === person);
  if (!p) { view = 'people'; person = null; return renderPeople(); }
  const name = p.fields.name || p.userId, tone = TONE[p.userId] ?? 'gray';
  const lvl = levelOf.get(p.userId) ?? 'L0';
  const v = p.views[lvl];
  $('title').textContent = name;
  $('acts').innerHTML = `<span class="tick">${clock(new Date().toISOString())}</span>`;

  const shown = Object.keys(v.fields).length;
  const pctSeen = p.total ? Math.round((shown / p.total) * 100) : 0;
  const stepper = schema.levels.map(l =>
    `<button class="step" role="tab" aria-selected="${l === lvl}" data-level="${l}">
      <div class="sl">${l}</div><div class="sn">${esc(schema.levelLabels[l] ?? '')} · ${Object.keys(p.views[l].fields).length}</div>
    </button>`).join('');

  const perLevel = schema.levels.map((l, i) => {
    const n = Object.keys(p.views[l].fields).length;
    const prev = i ? Object.keys(p.views[schema.levels[i - 1]].fields).length : 0;
    return { l, add: n - prev };
  });
  const maxAdd = Math.max(1, ...perLevel.map(x => x.add));
  const bars = perLevel.map(x => `
    <div class="lrow">
      <span class="lname">${x.l} ${esc(schema.levelLabels[x.l] ?? '')}</span>
      <div class="ltrack"><div class="lfill" data-w="${(x.add / maxAdd) * 100}" style="background:linear-gradient(90deg, color-mix(in oklch, ${LEVEL_CSS[x.l]} 55%, transparent), ${LEVEL_CSS[x.l]})"></div></div>
      <span class="lct">+${x.add}</span>
    </div>`).join('');
  const rows = Object.entries(v.fields).map(([k, val]) =>
    `<dt>${esc(k)}<span class="lvl ${schema.fieldLevels[k]}">${schema.fieldLevels[k]}</span></dt><dd>${esc(val)}</dd>`).join('');
  const deg = pctSeen * 3.6;

  $('body').innerHTML = `
    <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>All people</button>
    <div class="phero">
      <div class="av tag-${tone}">${esc(name.trim()[0].toUpperCase())}</div>
      <div><h2>${esc(name)}</h2><div class="meta">Seeded candidate · ${p.known}/${p.total} fields on file</div></div>
    </div>
    <div class="pcols">
      <div class="card panel">
        <span class="eyebrow">Visible at ${lvl}</span>
        <div class="dial">
          <div class="ring" data-arc="conic-gradient(${LEVEL_CSS[lvl]} ${deg}deg, oklch(1 0 0/.06) ${deg}deg)" style="background:conic-gradient(${LEVEL_CSS[lvl]} 0deg, oklch(1 0 0/.06) 0deg)"></div>
          <div class="hole"><div class="big num" data-count="${shown}">0</div><div class="small">of ${p.total}</div></div>
        </div>
        <div class="dial-cap">${pctSeen}% of everything on file</div>
      </div>
      <div>
        <div class="stepper">${stepper}</div>
        <div class="card panel" style="margin-bottom:16px"><span class="eyebrow">Unlocked at each rung</span>${bars}</div>
        <div class="card panel">
          <span class="eyebrow">A stranger's agent at ${lvl} sees</span>
          ${rows ? `<dl class="frow">${rows}</dl>` : `<div class="dial-cap" style="text-align:left">Nothing at ${lvl}.</div>`}
          ${(v.redacted.length || v.withheldAbove.length) ? `<div class="locked"><span class="eyebrow" style="display:block;margin-bottom:9px">Withheld</span><div class="chips">
            ${v.redacted.map(f => `<span class="chip red">${esc(f)} — never-share</span>`).join('')}
            ${v.withheldAbove.map(f => `<span class="chip">${esc(f)}</span>`).join('')}</div></div>` : ''}
        </div>
      </div>
    </div>`;

  $('back').onclick = () => go('#/people');
  $('body').querySelectorAll('.step').forEach(b => b.addEventListener('click', () => {
    levelOf.set(p.userId, b.dataset.level); renderPerson(); animateNumbers();
  }));
  animateNumbers();
}

/* ═════════════════════════════════════════════════════════════ Settings */
async function saveProfile(patch) {
  await fetch('/api/profile/me', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ patch }) });
  await load(true);
}
async function saveBudget(body) {
  await fetch('/api/profile/me/budget', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  await load(true);
}

function renderSettings() {
  $('title').textContent = 'Settings';
  $('acts').innerHTML = `<button class="btn btn-yolk" id="saveAll">Save profile</button>`;
  const m = me();
  const budget = m?.budget ?? { levels: {}, neverShare: [], forwardness: 3 };
  if (!meDraft) meDraft = { ...(m?.fields ?? {}) };

  const groups = schema.levels.map(l => {
    const fs = catalogue.fields.filter(f => f.level === l);
    const filled = fs.filter(f => (meDraft[f.field] ?? '') !== '').length;
    return `
      <div class="fieldset">
        <div class="fhead2">
          <span class="lvl ${l}">${l}</span>
          <span class="ttl">${esc(schema.levelLabels[l] ?? l)}</span>
          <span class="cnt">${filled}/${fs.length}</span>
        </div>
        ${fs.map(f => `
          <div class="inrow">
            <label for="in-${f.field}">${esc(f.field)}</label>
            <input id="in-${f.field}" data-field="${f.field}" value="${esc(meDraft[f.field] ?? '')}" placeholder="${esc(f.aliases[0] ?? f.field)}" />
          </div>`).join('')}
      </div>`;
  }).join('');

  $('body').innerHTML = `
    <div class="headline">Everything your wingman knows — and what it may repeat.</div>
    <p class="sub-line">These are the exact fields the MCP server stores. The consent budget on the right is what the disclosure tools read before they say anything.</p>
    <div class="setgrid">
      <div class="card panel"><span class="eyebrow">Your profile</span>${groups}</div>
      <div>
        <div class="card panel" style="margin-bottom:16px">
          <span class="eyebrow">Consent — when to ask you</span>
          ${schema.levels.map(l => {
            const pol = budget.levels[l] ?? 'ask';
            return `<div class="polrow">
              <div><div class="pl">${l} ${esc(schema.levelLabels[l] ?? '')}</div></div>
              <div class="seg3">${['free','ask','never'].map(p =>
                `<button data-pol="${l}" data-p="${p}" aria-pressed="${pol === p}">${p === 'free' ? 'Just do it' : p === 'ask' ? 'Ask me' : 'Never'}</button>`).join('')}</div>
            </div>`;
          }).join('')}
        </div>
        <div class="card panel" style="margin-bottom:16px">
          <span class="eyebrow">Never share</span>
          <div class="tagin" id="neverBox">
            ${budget.neverShare.map(n => `<span class="nchip">${esc(n)}<button data-rm="${esc(n)}">×</button></span>`).join('')}
            <input id="neverIn" placeholder="e.g. my employer — then Enter" />
          </div>
          <div class="dial-cap" style="text-align:left;margin-top:9px">Beats every rung above. Matched against field names and their aliases, so "my employer" really does block <b>job</b>.</div>
        </div>
        <div class="card panel">
          <span class="eyebrow">Forwardness — ${budget.forwardness}/5</span>
          <input class="slider" type="range" min="1" max="5" value="${budget.forwardness}" id="fwd" />
          <div class="dial-cap" style="text-align:left;margin-top:6px">1 is coy, 5 is forward. Feeds how your wingman opens a conversation.</div>
        </div>
      </div>
    </div>`;

  $('body').querySelectorAll('[data-field]').forEach(i =>
    i.addEventListener('input', () => { meDraft[i.dataset.field] = i.value; }));
  $('saveAll').onclick = async () => { await saveProfile(meDraft); toast('Profile saved.'); };
  $('body').querySelectorAll('[data-pol]').forEach(b => b.addEventListener('click', async () => {
    await saveBudget({ levels: { [b.dataset.pol]: b.dataset.p } }); toast(`${b.dataset.pol} → ${b.dataset.p}`);
  }));
  $('body').querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', async () => {
    await saveBudget({ neverShare: budget.neverShare.filter(n => n !== b.dataset.rm) }); toast('Removed.');
  }));
  $('neverIn').addEventListener('keydown', async e => {
    if (e.key !== 'Enter' || !e.target.value.trim()) return;
    await saveBudget({ neverShare: [...budget.neverShare, e.target.value.trim()] });
    toast('Added — it will never be shared.');
  });
  $('fwd').addEventListener('change', async e => { await saveBudget({ forwardness: Number(e.target.value) }); toast('Saved.'); });
}

/* ────────────────────────────────────────────────────────────────── wiring */
function wireGoto() {
  $('body').querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => go(b.dataset.goto)));
}
function wireActs() {
  $('body').querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    const { act, id } = b.dataset;
    if (act === 'edit') { editingId = editingId === id ? null : id; return draw(); }
    if (act === 'send-edit') return decide(id, 'edit', $('editText').value);
    return decide(id, act);
  }));
  const ta = $('editText');
  if (ta && editingId) {
    ta.addEventListener('input', () => drafts.set(editingId, ta.value));
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}
async function decide(id, decision, editedText) {
  await fetch(`/api/approvals/${id}/decision`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ decision, editedText }),
  });
  editingId = null; drafts.delete(id); openStep = null;
  toast(decision === 'decline' ? 'Declined — it will offer something vaguer.' : 'Sent.');
  await load(true);
}

function paintDuck() {
  const pending = approvals.some(a => a.status === 'pending');
  const last = events[events.length - 1];
  const p = pending ? 'waiting'
    : last && /matched/i.test(last.title) ? 'matched'
    : last && Date.now() - new Date(last.ts).getTime() < 10000 ? 'doing'
    : events.length ? 'resting' : 'idle';
  const map = {
    waiting: ['thinking', 'Waiting on you', 'Approve before it sends'],
    doing: ['negotiating', 'Negotiating', 'Talking to another wingman'],
    matched: ['matched', 'Matched', 'Both sides said yes'],
    resting: ['resting', 'All clear', 'Nothing pending'],
    idle: ['idle', 'Idle', 'Nothing running'],
  };
  const [pose, label, sub] = map[p];
  $('duck').className = `chikny chikny--${pose}`;
  $('agent').dataset.pace = p;
  $('agentState').textContent = label;
  $('agentSub').textContent = sub;
}

function readHash() {
  const [, a, b] = (location.hash || '#/now').split('/');
  if (a === 'people') { view = b ? 'person' : 'people'; person = b ? decodeURIComponent(b) : null; }
  else if (a === 'agent') { view = 'agent'; person = null; }
  else if (a === 'settings') { view = 'settings'; person = null; }
  else { view = 'now'; person = null; }
}
const go = (h) => { if (location.hash === h) draw(); else location.hash = h; };
addEventListener('hashchange', () => { readHash(); meDraft = null; draw(); });

function draw() {
  const activeFor = { now: 'now', agent: 'agent', people: 'people', person: 'people', settings: 'settings' }[view];
  document.querySelectorAll('.navitem[data-view]').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.view === activeFor)));
  const setCount = (el, n, hot = false) => {
    el.textContent = n || ''; el.style.display = n ? 'flex' : 'none';
    el.classList.toggle('hot', Boolean(n) && hot);
  };
  setCount($('cAgent'), approvals.filter(a => a.status === 'pending').length, true);
  setCount($('cPeople'), profiles.filter(p => p.isPersona).length);
  const m = me();
  $('meState').textContent = m ? `${m.known}/${m.total} fields known` : 'No profile yet';

  paintDuck();
  if (view === 'now') renderNow();
  else if (view === 'agent') renderAgent();
  else if (view === 'people') renderPeople();
  else if (view === 'person') renderPerson();
  else renderSettings();
}

document.querySelectorAll('.navitem[data-view]').forEach(b =>
  b.addEventListener('click', () => go({ now: '#/now', agent: '#/agent', people: '#/people', settings: '#/settings' }[b.dataset.view])));
$('q').addEventListener('input', e => { query = e.target.value; draw(); });
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape' && view === 'person') go('#/people');
});

async function load(force = false) {
  if ((editingId || view === 'settings') && !force) return;   // never yank a field the user is typing in
  try {
    const [act, pr, sc, st, cat] = await Promise.all([
      fetch('/api/activity').then(r => r.json()),
      fetch('/api/profiles').then(r => r.json()),
      fetch('/api/schema').then(r => r.json()),
      fetch('/api/status').then(r => r.json()),
      fetch('/api/fields').then(r => r.json()),
    ]);
    const snap = JSON.stringify([act.events, act.approvals, pr.profiles, st.checks, st.tools]);
    if (!force && snap === lastSnap) return;
    lastSnap = snap;
    events = act.events; approvals = act.approvals; profiles = pr.profiles;
    schema = sc; status = st; catalogue = cat;
    draw();
  } catch { /* keep the last good frame */ }
}

// make sure a "me" profile exists so Settings has something to write into
await fetch('/api/profile/me', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ patch: {} }) }).catch(() => {});
readHash();
await load(true);
setInterval(() => load(), 2000);
</script>
</body>
</html>
