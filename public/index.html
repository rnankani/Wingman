<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wingman</title>
<link rel="icon" href="/brand/icon-32.png" />
<link rel="apple-touch-icon" href="/brand/icon-180.png" />
<link rel="stylesheet" href="/brand/wingman.css" />
<link rel="stylesheet" href="/theme.css" />
<style>
  body { overflow: hidden; }
  .app { display: grid; grid-template-columns: 286px 1fr; height: 100vh; height: 100dvh; }

  /* ══════════════════════════════════════════════════════════════ sidebar */
  .sidebar {
    border-right: 1px solid oklch(0 0 0 / 0.4); box-shadow: 1px 0 0 oklch(1 0 0 / 0.03);
    display: flex; flex-direction: column; padding: 20px 18px 18px; min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 16px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5), inset 0 -1px 0 oklch(0.55 0.12 70 / 0.5),
                var(--cast-1), 0 5px 14px -5px oklch(0.8 0.16 88 / 0.55);
  }
  .brand-mark svg { width: 17px; height: 17px; color: var(--yolk-ink); }
  .brand span { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }

  .agent {
    background: linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
    border: 1px solid var(--line); border-radius: var(--r-card);
    box-shadow: var(--raise); padding: 12px 12px 13px; margin-bottom: 18px; text-align: center;
  }
  .stage {
    position: relative; border-radius: 12px; background: var(--well); box-shadow: var(--sink);
    padding: 6px 0 2px; margin-bottom: 10px; display: flex; justify-content: center; overflow: hidden;
  }
  .stage::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(60% 55% at 50% 78%, oklch(0.865 0.163 94 / 0.13), transparent 70%);
    pointer-events: none;
  }
  .stage .chikny { --chikny-scale: 0.5; position: relative; z-index: 1; }
  .agent[data-pace="waiting"] .stage, .agent[data-pace="doing"] .stage { animation: breathe 1.9s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { box-shadow: var(--sink), 0 0 0 1.5px color-mix(in oklch, var(--yolk) 50%, transparent), 0 0 0 0 oklch(0.865 0.163 94 / 0.3); }
    50%     { box-shadow: var(--sink), 0 0 0 1.5px color-mix(in oklch, var(--yolk) 70%, transparent), 0 0 22px 3px oklch(0.865 0.163 94 / 0.16); }
  }
  .agent-state { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
  .agent[data-pace="waiting"] .agent-state { color: var(--yolk); }
  .agent-sub { font-size: 13px; color: var(--text-4); margin-top: 1px; }

  .search {
    display: flex; align-items: center; gap: 10px; background: var(--well);
    border: 1px solid oklch(0 0 0 / 0.35); border-radius: var(--r-ctl);
    box-shadow: var(--sink); padding: 10px 12px; margin-bottom: 16px;
  }
  .search svg { width: 16px; height: 16px; color: var(--text-4); flex: none; }
  .search input { background: none; border: none; outline: none; flex: 1; min-width: 0; font-size: 14.5px; }
  .search input::placeholder { color: var(--text-4); }
  .kbd {
    flex: none; font-size: 12px; font-weight: 500; color: var(--text-4);
    background: linear-gradient(180deg, oklch(0.33 0 0), oklch(0.29 0 0));
    border-radius: 6px; padding: 2px 6px; box-shadow: var(--lip-soft), 0 1px 2px oklch(0 0 0 / 0.4);
  }

  .nav { display: flex; flex-direction: column; gap: 7px; }
  .navitem {
    position: relative; display: flex; align-items: center; gap: 13px; width: 100%;
    text-align: left; cursor: pointer; padding: 11px 13px; border-radius: var(--r-ctl);
    font-size: 15.5px; font-weight: 500; letter-spacing: -0.006em; color: var(--text-2);
    background: linear-gradient(180deg, oklch(0.305 0 0), oklch(0.283 0 0));
    border: 1px solid var(--line); text-decoration: none;
    box-shadow: var(--lip-soft), var(--cast-1), 0 3px 7px -3px oklch(0 0 0 / 0.4);
    transition: transform .11s ease, box-shadow .16s ease, color .14s ease;
  }
  .navitem svg { width: 19px; height: 19px; flex: none; color: var(--text-3); transition: color .14s ease; }
  .navitem:hover { transform: translateY(-1px); color: var(--text); box-shadow: var(--lip), var(--cast-1), 0 7px 15px -4px oklch(0 0 0 / 0.48); }
  .navitem:active { transform: translateY(1px); box-shadow: var(--sink); }
  .navitem[aria-current="true"] {
    color: var(--text); background: linear-gradient(180deg, oklch(0.355 0 0), oklch(0.305 0 0));
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.13), var(--keel), var(--cast-1), 0 8px 18px -5px oklch(0 0 0 / 0.5);
  }
  .navitem[aria-current="true"] svg { color: var(--yolk); }
  .navitem[aria-current="true"]::before {
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; border-radius: 0 3px 3px 0;
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: 0 0 10px oklch(0.865 0.163 94 / 0.55);
  }
  .navitem .count {
    margin-left: auto; font-size: 13px; font-weight: 600; color: var(--text-3);
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: var(--well); box-shadow: var(--sink); font-variant-numeric: tabular-nums;
  }
  .navitem .count.hot { color: var(--yolk-ink); background: linear-gradient(180deg, var(--yolk), var(--yolk-deep)); box-shadow: inset 0 1px 0 oklch(1 0 0/.45), 0 2px 6px -1px oklch(0.8 0.16 88 / .5); }

  .grow { flex: 1; }
  .whoami {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; margin-top: 14px;
    border-radius: var(--r-ctl); background: linear-gradient(180deg, oklch(0.30 0 0), oklch(0.281 0 0));
    border: 1px solid var(--line); box-shadow: var(--lip-soft), var(--cast-1);
  }
  .whoami .av {
    width: 34px; height: 34px; border-radius: 50%; flex: none; background: var(--well);
    box-shadow: var(--sink); display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--text-3);
  }
  .whoami .nm { font-size: 15px; font-weight: 550; }
  .whoami .st { font-size: 13px; color: var(--text-4); }

  /* ═════════════════════════════════════════════════════════════════ main */
  .main { overflow-y: auto; padding: 26px 30px 60px; min-height: 0; }
  .main-top { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .main-top h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.024em; }
  .main-top .acts { margin-left: auto; display: flex; gap: 9px; align-items: center; }
  .tick { font-size: 13px; color: var(--text-4); font-variant-numeric: tabular-nums; }

  .headline { font-size: 21px; font-weight: 550; letter-spacing: -0.018em; margin: 14px 0 4px; }
  .headline.hot { color: var(--yolk); }
  .sub-line { color: var(--text-3); font-size: 15px; margin: 0 0 22px; }

  /* stat tiles */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 13px; margin-bottom: 26px; }
  .stat { padding: 14px 16px; }
  .stat .n { font-size: 27px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .k { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-4); margin-top: 5px; }
  .stat.hot .n { color: var(--yolk); }

  /* ── the run: block tower + step feed ───────────────────────────────── */
  .run { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 1080px) { .run { grid-template-columns: 1fr; } }

  .tower { padding: 18px 16px 16px; }
  .tower-top { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; }
  .tower-pct { font-size: 33px; font-weight: 650; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
  .tower-pct.done { color: var(--green); }
  .tower-cap { font-size: 13px; color: var(--text-4); }
  .tower-note { font-size: 13px; color: var(--text-4); margin-bottom: 15px; }

  /* stacks bottom-up: first step at the bottom, top block = 100% */
  .blocks { display: flex; flex-direction: column-reverse; gap: 6px; }
  .block {
    position: relative; display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px; font-size: 13.6px; font-weight: 550;
    border: 1px solid oklch(0 0 0 / 0.3); color: var(--text-4);
    background: var(--well); box-shadow: var(--sink);
    transition: transform .2s cubic-bezier(.2,.9,.3,1.2), box-shadow .25s ease, color .2s ease;
  }
  .block .bi {
    width: 20px; height: 20px; border-radius: 6px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--text-4);
    background: oklch(1 0 0 / 0.06);
  }
  .block .bl { flex: 1; min-width: 0; }
  .block .lock { width: 14px; height: 14px; flex: none; opacity: 0; transition: opacity .25s ease; }

  /* landed block: raised, solid, locked in */
  .block.done {
    color: var(--text); border-color: var(--line);
    background: linear-gradient(180deg, oklch(0.345 0 0), oklch(0.30 0 0));
    box-shadow: var(--lip), var(--keel), var(--cast-1), 0 4px 10px -3px oklch(0 0 0 / 0.45);
    animation: land .34s cubic-bezier(.2,.9,.3,1.25);
  }
  .block.done .bi { color: var(--green); background: color-mix(in oklch, var(--green) 24%, transparent); }
  .block.done .lock { opacity: 1; color: var(--green); }
  @keyframes land { 0% { transform: translateY(-9px) scale(1.03); } 60% { transform: translateY(2px); } 100% { transform: none; } }

  /* the block being worked on right now */
  .block.active {
    color: var(--text); border-color: color-mix(in oklch, var(--yolk) 40%, transparent);
    background: linear-gradient(180deg, oklch(0.35 0 0), oklch(0.30 0 0));
    box-shadow: var(--lip), var(--cast-1), 0 0 0 1px color-mix(in oklch, var(--yolk) 25%, transparent);
    animation: working 1.5s ease-in-out infinite;
  }
  .block.active .bi { color: var(--yolk-ink); background: linear-gradient(180deg, var(--yolk), var(--yolk-deep)); }
  @keyframes working {
    0%,100% { box-shadow: var(--lip), var(--cast-1), 0 0 0 1px color-mix(in oklch, var(--yolk) 25%, transparent), 0 0 0 0 oklch(0.865 0.163 94 / 0.25); }
    50%     { box-shadow: var(--lip), var(--cast-1), 0 0 0 1px color-mix(in oklch, var(--yolk) 45%, transparent), 0 0 20px 2px oklch(0.865 0.163 94 / 0.16); }
  }

  /* stopped, needs a human */
  .block.gate {
    color: var(--yolk); border-color: var(--yolk-edge);
    background: linear-gradient(180deg, color-mix(in oklch, var(--yolk) 20%, oklch(0.32 0 0)), color-mix(in oklch, var(--yolk) 12%, oklch(0.28 0 0)));
    box-shadow: var(--lip), var(--cast-1), 0 0 22px -4px oklch(0.865 0.163 94 / 0.5);
    animation: working 1.1s ease-in-out infinite;
  }
  .block.gate .bi { color: var(--yolk-ink); background: linear-gradient(180deg, var(--yolk), var(--yolk-deep)); }

  .crown {
    margin-bottom: 8px; text-align: center; padding: 9px; border-radius: 10px;
    font-size: 13px; font-weight: 650; color: var(--text-4);
    border: 1px dashed oklch(1 0 0 / 0.11); background: var(--well); box-shadow: var(--sink);
  }
  .crown.lit {
    color: var(--yolk-ink); border: 1px solid var(--yolk-edge); border-style: solid;
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0/.5), var(--cast-1), 0 8px 22px -6px oklch(0.8 0.16 88 / .65);
  }

  /* step feed */
  .feed { display: flex; flex-direction: column; gap: 11px; }
  .fitem { padding: 14px 16px; }
  .fhead { display: flex; align-items: flex-start; gap: 10px; }
  .fdot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 6px; box-shadow: 0 0 9px currentColor; }
  .fdot.doing { background: var(--blue);  color: oklch(0.72 0.14 250 / .7); }
  .fdot.did   { background: var(--green); color: oklch(0.72 0.13 145 / .7); }
  .fdot.waiting { background: var(--yolk); color: oklch(0.865 0.163 94 / .7); }
  .ftitle { flex: 1; font-size: 15.5px; font-weight: 600; letter-spacing: -0.012em; }
  .ftime { font-size: 12.5px; color: var(--text-4); flex: none; font-variant-numeric: tabular-nums; }
  .fdetail { margin: 6px 0 0 19px; font-size: 14px; color: var(--text-3); line-height: 1.45; }
  .fquote {
    margin: 11px 0 0 19px; padding: 11px 13px; border-radius: 11px; font-size: 15px; line-height: 1.5;
    background: var(--well); box-shadow: var(--sink), inset 0 0 26px oklch(0.865 0.163 94 / .05);
    border: 1px solid color-mix(in oklch, var(--yolk) 26%, transparent);
  }
  .facts { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0 19px; }
  .ftags { display: flex; gap: 6px; flex-wrap: wrap; margin: 9px 0 0 19px; }
  .editbox { margin: 10px 0 0 19px; }
  .editbox textarea {
    width: 100%; min-height: 76px; resize: vertical; background: var(--well);
    border: 1px solid oklch(0 0 0 / .35); border-radius: 11px; box-shadow: var(--sink);
    padding: 10px 12px; font-size: 15px; line-height: 1.5; outline: none;
  }
  .editbox textarea:focus { border-color: color-mix(in oklch, var(--yolk) 50%, transparent); }

  /* health strip */
  .health { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-top: 26px; padding-top: 18px; border-top: 1px solid oklch(0 0 0 / .3); box-shadow: inset 0 1px 0 oklch(1 0 0 / .05); }
  .hchip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px; font-size: 13px; font-weight: 550; background: var(--well); box-shadow: var(--sink); color: var(--text-3); }
  .hchip .d { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .hchip .d.ok { background: var(--green); color: oklch(.72 .13 145/.7); }
  .hchip .d.warn { background: var(--amber); color: oklch(.76 .13 75/.7); }
  .hchip .d.down { background: var(--red); color: oklch(.68 .17 25/.7); }

  /* ═══════════════════════════════════════════════════════ people (grid) */
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .ptile {
    padding: 20px 18px; text-align: center; cursor: pointer;
    transition: transform .14s cubic-bezier(.22,.9,.3,1), box-shadow .18s ease;
  }
  .ptile:hover { transform: translateY(-4px); box-shadow: var(--raise-hi); }
  .ptile .av {
    width: 62px; height: 62px; border-radius: 50%; margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700;
    box-shadow: var(--lip), var(--cast-1), 0 7px 18px -6px oklch(0 0 0 / .55);
  }
  .ptile .nm { font-size: 16.5px; font-weight: 600; letter-spacing: -0.014em; }
  .ptile .rl { font-size: 13px; color: var(--text-4); margin-top: 2px; }
  .ptile .bar { display: flex; gap: 3px; margin-top: 13px; }
  .ptile .seg { height: 5px; flex: 1; border-radius: 3px; background: oklch(1 0 0 / .08); box-shadow: inset 0 1px 2px oklch(0 0 0/.4); }
  .ptile .seg.on { box-shadow: var(--lip-soft), 0 0 8px -1px currentColor; }
  .ptile .cap { font-size: 12px; color: var(--text-4); margin-top: 9px; }

  /* ═════════════════════════════════════════════════════ person (detail) */
  .back {
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: 16px;
    font-size: 14px; font-weight: 550; color: var(--text-3); cursor: pointer;
    background: none; border: none; padding: 6px 4px;
  }
  .back:hover { color: var(--text); }
  .back svg { width: 16px; height: 16px; }

  .phero { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; flex-wrap: wrap; }
  .phero .av {
    width: 84px; height: 84px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 33px; font-weight: 700;
    box-shadow: var(--lip), var(--cast-1), 0 10px 26px -8px oklch(0 0 0 / .6);
  }
  .phero h2 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.026em; }
  .phero .meta { font-size: 14.5px; color: var(--text-3); margin-top: 3px; }

  .pcols { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 940px) { .pcols { grid-template-columns: 1fr; } }

  /* radial disclosure gauge */
  .gauge { padding: 20px 18px; text-align: center; }
  .dial { width: 168px; height: 168px; margin: 4px auto 14px; position: relative; border-radius: 50%; }
  .dial .ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: var(--sink); }
  .dial .hole {
    position: absolute; inset: 19px; border-radius: 50%;
    background: linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
    box-shadow: var(--lip), var(--cast-1), 0 6px 16px -6px oklch(0 0 0/.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .dial .big { font-size: 34px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
  .dial .small { font-size: 12px; color: var(--text-4); margin-top: 5px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }
  .gauge .lbl { font-size: 14px; color: var(--text-3); }

  /* level stepper */
  .stepper { display: flex; gap: 7px; margin-bottom: 20px; }
  .step {
    flex: 1; padding: 11px 8px; border-radius: 11px; cursor: pointer; text-align: center;
    border: 1px solid var(--line); color: var(--text-3);
    background: linear-gradient(180deg, oklch(.325 0 0), oklch(.292 0 0));
    box-shadow: var(--lip-soft), var(--cast-1); transition: transform .1s ease, color .13s ease;
  }
  .step:hover { transform: translateY(-1px); color: var(--text); }
  .step .sl { font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
  .step .sn { font-size: 11.5px; margin-top: 2px; opacity: .85; }
  .step[aria-selected="true"] {
    color: var(--yolk-ink); border-color: var(--yolk-edge);
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0/.5), var(--cast-1), 0 6px 15px -5px oklch(.8 .16 88/.55);
  }

  /* horizontal field bars per level */
  .lvlbars { padding: 18px; margin-bottom: 20px; }
  .lrow { display: grid; grid-template-columns: 88px 1fr 54px; gap: 12px; align-items: center; padding: 7px 0; }
  .lrow .lname { font-size: 13.5px; font-weight: 600; color: var(--text-2); }
  .ltrack { height: 15px; border-radius: 8px; background: var(--well); box-shadow: var(--sink); overflow: hidden; }
  .lfill { height: 100%; border-radius: 8px; box-shadow: var(--lip-soft); transition: width .5s cubic-bezier(.2,.9,.3,1); }
  .lrow .lct { font-size: 12.5px; color: var(--text-4); text-align: right; font-variant-numeric: tabular-nums; }

  .fields { padding: 18px; }
  .frow { display: grid; grid-template-columns: minmax(104px,auto) 1fr; gap: 9px 15px; font-size: 14.5px; }
  .frow dt { font-weight: 600; color: var(--text-2); }
  .frow dd { margin: 0; color: var(--text-3); }
  .lvl { font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 5px; margin-left: 6px; vertical-align: 1.5px; }
  .lvl.L0 { color: var(--text-2); background: oklch(1 0 0 / .09); }
  .lvl.L1 { color: var(--blue);   background: color-mix(in oklch, var(--blue) 20%, transparent); }
  .lvl.L2 { color: var(--amber);  background: color-mix(in oklch, var(--amber) 20%, transparent); }
  .lvl.L3 { color: var(--purple); background: color-mix(in oklch, var(--purple) 20%, transparent); }
  .locked { margin-top: 16px; padding-top: 14px; border-top: 1px solid oklch(0 0 0/.3); box-shadow: inset 0 1px 0 oklch(1 0 0/.05); }
  .locked .eyebrow { display: block; margin-bottom: 9px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; padding: 5px 9px; border-radius: 8px;
    background: var(--well); box-shadow: var(--sink); color: var(--text-4);
  }
  .chip.red { color: var(--red); }

  .hollow {
    border: 1px dashed oklch(1 0 0 / .1); border-radius: var(--r-card); padding: 30px 16px;
    text-align: center; font-size: 14.5px; color: var(--text-4); box-shadow: inset 0 1px 4px oklch(0 0 0/.25);
  }
  .fix { display: inline-block; margin-top: 9px; font-size: 12.5px; background: var(--well); box-shadow: var(--sink); border-radius: 8px; padding: 5px 9px; color: var(--yolk); font-family: ui-monospace, Menlo, monospace; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, oklch(.34 0 0), oklch(.3 0 0)); border: 1px solid var(--line);
    padding: 11px 19px; border-radius: 999px; font-size: 14.5px; font-weight: 550;
    box-shadow: var(--lip), var(--cast-1), 0 20px 44px -14px oklch(0 0 0/.75);
    opacity: 0; transition: opacity .22s ease, transform .22s ease; pointer-events: none; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-5px); }

  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-6 9-9 18-9-1 6-4 10-9 12l-3 6-2-6-6-3z"/></svg>
      </div>
      <span>Wingman</span>
    </div>

    <div class="agent" id="agent" data-pace="idle">
      <div class="stage"><div class="chikny chikny--idle" id="duck" role="img" aria-label="Wingman agent"></div></div>
      <div class="agent-state" id="agentState">Idle</div>
      <div class="agent-sub" id="agentSub">Nothing running</div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search people & steps" autocomplete="off" />
      <span class="kbd">⌘K</span>
    </div>

    <nav class="nav">
      <button class="navitem" data-view="now" aria-current="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2.5"/></svg>
        Now
        <span class="count" id="cNow"></span>
      </button>
      <button class="navitem" data-view="people">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4"/><path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8"/></svg>
        People
        <span class="count" id="cPeople"></span>
      </button>
      <a class="navitem" href="/status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 20v-5"/><path d="M12 20V8"/><path d="M18 20v-9"/></svg>
        Status
      </a>
    </nav>

    <div class="grow"></div>

    <div class="whoami">
      <div class="av">Y</div>
      <div>
        <div class="nm">You</div>
        <div class="st" id="meState">No profile yet</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-top">
      <h1 id="title">Now</h1>
      <div class="acts" id="acts"></div>
    </div>
    <div id="body"></div>
  </main>

</div>
<div class="toast" id="toast"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
};

let view = 'now', person = null, query = '';
let events = [], approvals = [], profiles = [], status = { checks: [], tools: [] };
let schema = { levels: ['L0','L1','L2','L3'], levelLabels: {}, fieldLevels: {} };
const levelOf = new Map();
let editingId = null, drafts = new Map(), lastSnap = '';

const TONE = { maya: 'blue', devon: 'green', priya: 'purple', sam: 'amber', lena: 'gray' };
const LEVEL_TONE = { L0: 'gray', L1: 'blue', L2: 'amber', L3: 'purple' };
const LEVEL_CSS  = { L0: 'oklch(0.72 0 0)', L1: 'var(--blue)', L2: 'var(--amber)', L3: 'var(--purple)' };
const ACT_LABEL = { share_detail: 'Share a detail', send_intro: 'Send an introduction', book_date: 'Propose a date' };
const hit = (s) => !query || s.toLowerCase().includes(query.toLowerCase());

function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ══════════════════════════════════════════ the run, as a stack of blocks
   Each block is one step of the negotiation. A block only lands when the
   matching thing actually happened in /api/activity — the tower is a readout
   of real state, never a timed animation. */
const STEPS = [
  { label: 'Read your profile',        rx: /reading your profile/i },
  { label: 'Compare 5 candidates',     rx: /comparing you against/i },
  { label: 'Pick the best match',      rx: /found a strong match/i },
  { label: 'Open the conversation',    rx: /opening a conversation/i },
  { label: 'Share a detail',           action: 'share_detail' },
  { label: 'They answer back',         rx: /wingman answered/i },
  { label: 'Send an introduction',     action: 'send_intro' },
  { label: 'Find a time and place',    rx: /finding a time/i },
  { label: 'Propose the date',         action: 'book_date' },
];

function towerState() {
  const titles = events.map(e => e.title);
  return STEPS.map(s => {
    if (s.action) {
      const a = [...approvals].reverse().find(x => x.action === s.action);
      if (!a) return 'pending';
      return a.status === 'pending' ? 'gate' : 'done';
    }
    return titles.some(t => s.rx.test(t)) ? 'done' : 'pending';
  });
}

function renderTower() {
  const st = towerState();
  // the first not-done block is the one being worked on
  const nextIdx = st.findIndex(s => s !== 'done');
  if (nextIdx !== -1 && st[nextIdx] === 'pending' && events.length) st[nextIdx] = 'active';

  const done = st.filter(s => s === 'done').length;
  const pct = Math.round((done / STEPS.length) * 100);
  const complete = done === STEPS.length;

  const blocks = STEPS.map((s, i) => {
    const k = st[i];
    return `<div class="block ${k}">
      <span class="bi">${k === 'done' ? '✓' : i + 1}</span>
      <span class="bl">${esc(s.label)}</span>
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
    </div>`;
  }).join('');

  return `
    <div class="card tower">
      <div class="tower-top">
        <span class="tower-pct ${complete ? 'done' : ''}">${pct}%</span>
        <span class="tower-cap">${done} of ${STEPS.length} steps</span>
      </div>
      <div class="tower-note">${complete ? 'Every block landed.' : 'Blocks land as the agent finishes each step.'}</div>
      <div class="crown ${complete ? 'lit' : ''}">${complete ? '★ Matched — 100%' : 'Top block = done'}</div>
      <div class="blocks">${blocks}</div>
    </div>`;
}

/* ─────────────────────────────────────────────────────────── the step feed */
function approvalItem(a) {
  const tags = a.fields.map(f =>
    `<span class="tag tag-${LEVEL_TONE[schema.fieldLevels[f]] ?? 'gray'}">${esc(f)} · ${esc(schema.fieldLevels[f] ?? '')}</span>`).join('');
  const draft = drafts.has(a.id) ? drafts.get(a.id) : a.sentence;
  return `
    <div class="card fitem">
      <div class="fhead">
        <span class="fdot waiting"></span>
        <span class="ftitle">${esc(ACT_LABEL[a.action] ?? a.action)} — needs you</span>
        <span class="ftime">${ago(a.ts)}</span>
      </div>
      <div class="fdetail">Nothing below leaves your device until you say so.</div>
      <div class="fquote">${esc(a.sentence)}</div>
      <div class="ftags">${tags}</div>
      <div class="facts">
        <button class="btn btn-yolk" data-act="approve" data-id="${a.id}">Approve</button>
        <button class="btn" data-act="edit" data-id="${a.id}">Edit</button>
        <button class="btn" data-act="vaguer" data-id="${a.id}">Say less</button>
        <button class="btn" data-act="decline" data-id="${a.id}">Decline</button>
      </div>
      ${editingId === a.id ? `
        <div class="editbox">
          <textarea id="editText">${esc(draft)}</textarea>
          <div class="facts" style="margin-left:0"><button class="btn btn-yolk" data-act="send-edit" data-id="${a.id}">Send edited</button></div>
        </div>` : ''}
    </div>`;
}

function eventItem(e) {
  return `
    <div class="card fitem">
      <div class="fhead">
        <span class="fdot ${e.state}"></span>
        <span class="ftitle">${esc(e.title)}</span>
        <span class="ftime">${ago(e.ts)}</span>
      </div>
      <div class="fdetail">${esc(e.detail)}</div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════ Now */
function renderNow() {
  $('title').textContent = 'Now';
  $('acts').innerHTML = `
    <span class="tick" id="tick"></span>
    <button class="btn btn-yolk" id="run">Run</button>
    <button class="btn" id="clear">Reset</button>`;
  $('run').onclick = async () => { await fetch('/api/demo/run', { method: 'POST' }); toast('Wingman is on it.'); await load(true); };
  $('clear').onclick = async () => {
    await fetch('/api/demo/reset', { method: 'POST' });
    drafts.clear(); editingId = null; toast('Cleared.'); await load(true);
  };

  const pending = approvals.filter(a => a.status === 'pending');
  const held = approvals.filter(a => a.decision === 'decline' || a.decision === 'vaguer').length;
  const sent = approvals.filter(a => a.status === 'resolved' && a.decision !== 'decline').length;
  const st = towerState();
  const pct = Math.round((st.filter(s => s === 'done').length / STEPS.length) * 100);

  const headline = pending.length ? 'Wingman is waiting on you.'
    : events.length === 0 ? 'Wingman is idle.'
    : pct === 100 ? 'Wingman finished the run.'
    : 'Wingman is working.';
  const subline = pending.length ? `${pending.length} step${pending.length > 1 ? 's' : ''} stopped for your approval — nothing sends without it.`
    : events.length === 0 ? 'Press Run to watch it work, step by step.'
    : pct === 100 ? 'Every block landed. Reset to run it again.'
    : 'Blocks land in the tower as each step completes.';

  const feed = [
    ...pending.map(approvalItem),
    ...[...events].reverse().filter(e => hit(e.title + ' ' + e.detail)).slice(0, 12).map(eventItem),
  ].join('') || `<div class="hollow">No steps yet. Press <b>Run</b> to start a negotiation.</div>`;

  $('body').innerHTML = `
    <div class="headline ${pending.length ? 'hot' : ''}">${headline}</div>
    <p class="sub-line">${subline}</p>

    <div class="stats">
      <div class="card stat"><div class="n">${pct}%</div><div class="k">Run progress</div></div>
      <div class="card stat ${pending.length ? 'hot' : ''}"><div class="n">${pending.length}</div><div class="k">Awaiting you</div></div>
      <div class="card stat"><div class="n">${sent}</div><div class="k">Disclosed</div></div>
      <div class="card stat ${held ? 'hot' : ''}"><div class="n">${held}</div><div class="k">Held back</div></div>
    </div>

    <div class="run">
      ${renderTower()}
      <div class="feed">${feed}</div>
    </div>

    <div class="health">${status.checks.map(c =>
      `<span class="hchip"><span class="d ${c.state}"></span>${esc(c.label)}</span>`).join('')
      || '<span class="hchip">No pipeline data</span>'}
      <span class="hchip">${status.tools.length} tools · ${status.tools.filter(t => t.gated).length} gated</span>
    </div>`;

  wireActs();
}

/* ════════════════════════════════════════════════════════════════ People */
function renderPeople() {
  $('title').textContent = 'People';
  $('acts').innerHTML = `<span class="tick" id="tick"></span>`;

  const list = profiles.filter(p => hit(p.userId + ' ' + Object.values(p.fields).join(' ')));
  if (!list.length) {
    $('body').innerHTML = `<div class="hollow">No profiles match.<div class="fix">npm run seed</div></div>`;
    return;
  }

  $('body').innerHTML = `
    <p class="sub-line">Tap anyone to see what your wingman may reveal about them, level by level.</p>
    <div class="pgrid">${list.map(p => {
      const tone = TONE[p.userId] ?? 'gray';
      const name = p.fields.name || p.userId;
      const segs = schema.levels.map(l => {
        const n = Object.keys(p.views[l].fields).length;
        const prev = schema.levels.indexOf(l) ? Object.keys(p.views[schema.levels[schema.levels.indexOf(l) - 1]].fields).length : 0;
        return `<span class="seg ${n > prev ? 'on' : ''}" style="${n > prev ? `background:${LEVEL_CSS[l]};color:${LEVEL_CSS[l]}` : ''}"></span>`;
      }).join('');
      return `
        <div class="card ptile" data-person="${esc(p.userId)}">
          <div class="av tag-${tone}">${esc(name.trim()[0].toUpperCase())}</div>
          <div class="nm">${esc(name)}</div>
          <div class="rl">${p.isPersona ? 'Candidate' : 'You'}</div>
          <div class="bar">${segs}</div>
          <div class="cap">${p.known}/${p.total} fields on file</div>
        </div>`;
    }).join('')}</div>`;

  $('body').querySelectorAll('[data-person]').forEach(el =>
    el.addEventListener('click', () => go('#/people/' + encodeURIComponent(el.dataset.person))));
}

/* ═══════════════════════════════════════════════════════ Person (detail) */
function renderPerson() {
  const p = profiles.find(x => x.userId === person);
  if (!p) { view = 'people'; person = null; return renderPeople(); }

  const name = p.fields.name || p.userId;
  const tone = TONE[p.userId] ?? 'gray';
  const lvl = levelOf.get(p.userId) ?? 'L0';
  const v = p.views[lvl];

  $('title').textContent = name;
  $('acts').innerHTML = `<span class="tick" id="tick"></span>`;

  const shown = Object.keys(v.fields).length;
  const pctSeen = p.total ? Math.round((shown / p.total) * 100) : 0;

  const stepper = schema.levels.map(l => {
    const n = Object.keys(p.views[l].fields).length;
    return `<button class="step" role="tab" aria-selected="${l === lvl}" data-level="${l}">
      <div class="sl">${l}</div><div class="sn">${esc(schema.levelLabels[l] ?? '')} · ${n}</div>
    </button>`;
  }).join('');

  // fields unlocked *at* each level (not cumulative), as a bar chart
  const perLevel = schema.levels.map((l, i) => {
    const n = Object.keys(p.views[l].fields).length;
    const prev = i ? Object.keys(p.views[schema.levels[i - 1]].fields).length : 0;
    return { l, add: n - prev, cum: n };
  });
  const maxAdd = Math.max(1, ...perLevel.map(x => x.add));
  const bars = perLevel.map(x => `
    <div class="lrow">
      <span class="lname">${x.l} ${esc(schema.levelLabels[x.l] ?? '')}</span>
      <div class="ltrack"><div class="lfill" style="width:${(x.add / maxAdd) * 100}%;background:linear-gradient(90deg, color-mix(in oklch, ${LEVEL_CSS[x.l]} 55%, transparent), ${LEVEL_CSS[x.l]})"></div></div>
      <span class="lct">+${x.add}</span>
    </div>`).join('');

  const rows = Object.entries(v.fields).map(([k, val]) =>
    `<dt>${esc(k)}<span class="lvl ${schema.fieldLevels[k]}">${schema.fieldLevels[k]}</span></dt><dd>${esc(val)}</dd>`).join('');

  const deg = pctSeen * 3.6;
  $('body').innerHTML = `
    <button class="back" id="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      All people
    </button>

    <div class="phero">
      <div class="av tag-${tone}">${esc(name.trim()[0].toUpperCase())}</div>
      <div>
        <h2>${esc(name)}</h2>
        <div class="meta">${p.isPersona ? 'Seeded candidate' : 'You'} · ${p.known}/${p.total} fields on file · budget ${esc(p.budget.levels[lvl])} at ${lvl}</div>
      </div>
    </div>

    <div class="pcols">
      <div>
        <div class="card gauge">
          <div class="dial">
            <div class="ring" style="background: conic-gradient(${LEVEL_CSS[lvl]} ${deg}deg, oklch(1 0 0 / .06) ${deg}deg)"></div>
            <div class="hole">
              <div class="big">${shown}</div>
              <div class="small">of ${p.total} shown</div>
            </div>
          </div>
          <div class="lbl">Visible at <b>${lvl}</b> — ${pctSeen}% of everything on file</div>
        </div>
      </div>

      <div>
        <div class="stepper">${stepper}</div>
        <div class="card lvlbars">
          <span class="eyebrow" style="display:block;margin-bottom:10px">Fields unlocked at each rung</span>
          ${bars}
        </div>
        <div class="card fields">
          <span class="eyebrow" style="display:block;margin-bottom:12px">A stranger's agent at ${lvl} sees</span>
          ${rows ? `<dl class="frow">${rows}</dl>` : `<div class="lbl" style="color:var(--text-4)">Nothing is visible at ${lvl}.</div>`}
          ${(v.redacted.length || v.withheldAbove.length) ? `
            <div class="locked">
              <span class="eyebrow">Withheld</span>
              <div class="chips">
                ${v.redacted.map(f => `<span class="chip red">${esc(f)} — never-share</span>`).join('')}
                ${v.withheldAbove.map(f => `<span class="chip">${esc(f)}</span>`).join('')}
              </div>
            </div>` : ''}
        </div>
      </div>
    </div>`;

  $('back').addEventListener('click', () => go('#/people'));
  $('body').querySelectorAll('.step').forEach(b => b.addEventListener('click', () => {
    levelOf.set(p.userId, b.dataset.level); renderPerson();
  }));
}

/* ────────────────────────────────────────────────────────────────── wiring */
function wireActs() {
  $('body').querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    const { act, id } = b.dataset;
    if (act === 'edit') { editingId = editingId === id ? null : id; return draw(); }
    if (act === 'send-edit') return decide(id, 'edit', $('editText').value);
    return decide(id, act);
  }));
  const ta = $('editText');
  if (ta && editingId) {
    ta.addEventListener('input', () => drafts.set(editingId, ta.value));
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}

async function decide(id, decision, editedText) {
  await fetch(`/api/approvals/${id}/decision`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ decision, editedText }),
  });
  editingId = null; drafts.delete(id);
  toast(decision === 'decline' ? 'Declined — it will offer something vaguer.' : 'Sent.');
  await load(true);
}

function paintDuck() {
  const pending = approvals.some(a => a.status === 'pending');
  const last = events[events.length - 1];
  const p = pending ? 'waiting'
    : last && /matched/i.test(last.title) ? 'matched'
    : last && Date.now() - new Date(last.ts).getTime() < 10000 ? 'doing'
    : events.length ? 'resting' : 'idle';
  const map = {
    waiting: ['thinking',    'Waiting on you', 'Approve before it sends'],
    doing:   ['negotiating', 'Negotiating',    'Talking to another wingman'],
    matched: ['matched',     'Matched',        'Both sides said yes'],
    resting: ['resting',     'All clear',      'Nothing pending'],
    idle:    ['idle',        'Idle',           'Press Run to begin'],
  };
  const [pose, label, sub] = map[p];
  $('duck').className = `chikny chikny--${pose}`;
  $('agent').dataset.pace = p;
  $('agentState').textContent = label;
  $('agentSub').textContent = sub;
}

function draw() {
  document.querySelectorAll('.navitem[data-view]').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.view === view || (view === 'person' && b.dataset.view === 'people'))));
  const setCount = (el, n, hot = false) => {
    el.textContent = n || ''; el.style.display = n ? 'flex' : 'none';
    el.classList.toggle('hot', Boolean(n) && hot);
  };
  const pending = approvals.filter(a => a.status === 'pending').length;
  setCount($('cNow'), pending, true);
  setCount($('cPeople'), profiles.length);
  const me = profiles.find(p => !p.isPersona);
  $('meState').textContent = me ? `${me.known}/${me.total} fields known` : 'No profile yet';

  paintDuck();
  if (view === 'now') renderNow();
  else if (view === 'people') renderPeople();
  else renderPerson();

  const t = $('tick');
  if (t) t.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
}

/* Hash routing: the open person survives a reload, back/forward work, and a
   view can be linked to directly — #/people/maya. */
function readHash() {
  const [, a, b] = (location.hash || '#/now').split('/');
  if (a === 'people') { view = b ? 'person' : 'people'; person = b ? decodeURIComponent(b) : null; }
  else { view = 'now'; person = null; }
}
const go = (h) => { if (location.hash === h) draw(); else location.hash = h; };
addEventListener('hashchange', () => { readHash(); draw(); });

document.querySelectorAll('.navitem[data-view]').forEach(b =>
  b.addEventListener('click', () => go(b.dataset.view === 'people' ? '#/people' : '#/now')));
$('q').addEventListener('input', e => { query = e.target.value; draw(); });
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape' && view === 'person') go('#/people');
});

async function load(force = false) {
  if (editingId && !force) return;
  try {
    const [act, pr, sc, st] = await Promise.all([
      fetch('/api/activity').then(r => r.json()),
      fetch('/api/profiles').then(r => r.json()),
      fetch('/api/schema').then(r => r.json()),
      fetch('/api/status').then(r => r.json()),
    ]);
    const snap = JSON.stringify([act.events, act.approvals, pr.profiles, st.checks, st.tools]);
    if (!force && snap === lastSnap) return;
    lastSnap = snap;
    events = act.events; approvals = act.approvals; profiles = pr.profiles; schema = sc; status = st;
    draw();
  } catch { /* keep the last good frame on the screen */ }
}

readHash();
await load(true);
setInterval(() => load(), 2000);
</script>
</body>
</html>
