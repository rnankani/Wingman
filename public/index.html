<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wingman — dashboard</title>
<link rel="icon" href="/brand/icon-32.png" />
<link rel="stylesheet" href="/brand/wingman.css" />
<style>
  :root {
    color-scheme: dark;

    /* ---- surfaces ---------------------------------------------------- */
    --bg:      oklch(0.26 0 0);
    --panel:   oklch(0.301 0 0);
    --inset:   oklch(0.269 0 0);
    --line:    oklch(1 0 0 / 0.07);

    /* ---- text -------------------------------------------------------- */
    --t1: oklch(0.907 0 0);
    --t2: oklch(0.798 0 0);
    --t3: oklch(0.683 0 0);
    --t4: oklch(0.62 0 0);

    /* ---- accents ----------------------------------------------------- */
    --blue:   oklch(0.72 0.14 250);
    --green:  oklch(0.72 0.13 145);
    --amber:  oklch(0.76 0.13 75);
    --purple: oklch(0.72 0.14 300);
    --gray:   oklch(0.72 0 0);

    /* Semantic aliases. The ladder gets hotter as it gets more identifying;
       there is no red in the palette, so purple carries "stop". */
    --ok: var(--green);
    --warn: var(--amber);
    --down: var(--purple);
    --l0: var(--green);
    --l1: var(--blue);
    --l2: var(--amber);
    --l3: var(--purple);

    --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN",
            -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    /* Reserved for literal identifiers — tool names, field keys, shell commands.
       Everything a human reads as prose uses --font. */
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* A chip tinted by whatever --accent is in scope. Derived with color-mix so
     every tint traces back to the five palette hues instead of a hand-picked
     hex that would drift the moment the palette changes.
     Mix against `transparent`, never against a surface: the surfaces are pure
     grays (chroma 0, hue 0), and oklch interpolates hue, so mixing green with
     one lands at hue ~23 and the chip renders brown. Against transparent the
     hue is preserved and alpha does the work. */
  .tint {
    background: color-mix(in oklch, var(--accent) 18%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 32%, transparent);
    color: var(--accent);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--t1);
    font: 15px/1.55 var(--font);
    -webkit-font-smoothing: antialiased;
    padding: 1.5rem 1.25rem 5rem;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ---------------------------------------------------------------- header */
  header { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.35rem; }
  header .chikny { --chikny-scale: 0.5; }
  .brand { font-weight: 800; font-size: 1.9rem; letter-spacing: -0.03em; line-height: 1; }
  .brand b { color: var(--t1); font-weight: 800; }
  .brand i { font-style: normal; color: var(--amber); }
  .sub { color: var(--t4); font-size: 0.85rem; margin-top: 0.2rem; }
  header nav { margin-left: auto; display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  header nav a, .ghost {
    font: 600 0.82rem var(--font);
    text-decoration: none; color: var(--t2); background: var(--inset);
    border: 1px solid var(--line); border-radius: 999px; padding: 0.38rem 0.85rem;
    cursor: pointer; transition: color 0.12s, border-color 0.12s;
  }
  header nav a:hover, .ghost:hover { color: var(--t1); border-color: oklch(1 0 0 / 0.16); }
  #tick { color: var(--t4); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .me { color: var(--t2); font-size: 0.82rem; font-weight: 650; }

  h2 {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--t4); font-weight: 700; margin: 2.2rem 0 0.75rem;
  }
  h2:first-of-type { margin-top: 1.6rem; }
  h2 .note { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--t4); }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 1rem 1.1rem;
  }

  /* --------------------------------------------------------------- checks */
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 0.7rem; }
  .check { display: flex; gap: 0.6rem; align-items: flex-start; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 0.45rem; flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.down { background: var(--down); }
  .check b { display: block; font-size: 0.86rem; color: var(--t1); font-weight: 650; }
  .check span { color: var(--t3); font-size: 0.76rem; overflow-wrap: anywhere; }
  .check code {
    display: inline-block; margin-top: 0.35rem; font: 0.72rem var(--mono);
    background: var(--inset); border: 1px solid var(--line);
    border-radius: 7px; padding: 0.18rem 0.45rem; color: var(--amber);
    overflow-wrap: anywhere;
  }

  /* ---------------------------------------------------------------- tools */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--t4); font-weight: 700; padding: 0 0.6rem 0.55rem 0;
  }
  td { padding: 0.55rem 0.6rem; border-top: 1px solid var(--line); vertical-align: top; }
  td:last-child, th:last-child { padding-right: 0; }
  td:first-child, th:first-child { padding-left: 0; }
  td.name { font: 600 0.82rem var(--mono); color: var(--t1); white-space: nowrap; }
  td.desc { color: var(--t3); font-size: 0.78rem; }
  .tag {
    display: inline-block; font: 600 0.7rem var(--mono);
    padding: 0.14rem 0.5rem; border-radius: 7px; white-space: nowrap;
  }
  .tag.ro { --accent: var(--green); }
  .tag.w  { --accent: var(--amber); }
  .tag.d  { --accent: var(--purple); }
  .tag.u  { --accent: var(--purple); }
  .gate { font-size: 0.78rem; font-weight: 650; white-space: nowrap; }
  .gate.on { color: var(--amber); }
  .gate.off { color: var(--t4); font-weight: 500; }

  /* --------------------------------------------------------- negotiations */
  .clist { display: grid; gap: 0.8rem; }
  .c-head { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  .c-head .chikny { --chikny-scale: 0.5; margin: -0.5rem 0; }
  .vs { font-weight: 700; font-size: 1rem; color: var(--t1); }
  .vs em { font-style: normal; color: var(--t4); font-weight: 500; margin: 0 0.35rem; }
  .c-meta { margin-left: auto; font-size: 0.76rem; color: var(--t4); font-variant-numeric: tabular-nums; }

  .turns { margin-top: 0.9rem; border-top: 1px solid var(--line); padding-top: 0.85rem; display: grid; gap: 0.5rem; }
  .turn { display: flex; }
  .turn.right { justify-content: flex-end; }
  .bubble {
    max-width: min(78%, 30rem); background: var(--inset);
    border: 1px solid var(--line); border-radius: 14px; padding: 0.5rem 0.7rem;
    font-size: 0.83rem; color: var(--t2);
  }
  .turn.right .bubble { border-color: oklch(1 0 0 / 0.12); }
  .bubble .from {
    display: block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--t4); margin-bottom: 0.2rem;
  }
  .bubble .msg { overflow-wrap: anywhere; }

  .discl { margin-top: 0.85rem; display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }
  .discl .lab { font-size: 0.72rem; color: var(--t4); margin-right: 0.15rem; }
  .dchip {
    font: 600 0.71rem var(--mono); padding: 0.16rem 0.5rem; border-radius: 999px;
  }
  .dchip.approved::after { content: " ·  approved"; font-family: var(--font); font-weight: 500; opacity: 0.75; }
  .dchip.free::after { content: " ·  free"; font-family: var(--font); font-weight: 500; opacity: 0.75; }

  .verdicts { margin-top: 0.8rem; display: grid; gap: 0.35rem; }
  .vrow { font-size: 0.79rem; color: var(--t3); }
  .vrow b { font-weight: 700; }
  .vrow b.match { color: var(--green); }
  .vrow b.pass { color: var(--purple); }
  .vrow b.needs_human { color: var(--amber); }

  .outcome {
    margin-top: 0.8rem; border-radius: 12px; padding: 0.6rem 0.75rem; font-size: 0.82rem;
  }

  /* ------------------------------------------------------------- profiles */
  .plist { display: grid; gap: 0.8rem; }
  .p-head { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  .p-head .chikny { --chikny-scale: 0.5; margin: -0.5rem 0; }
  .who { font-weight: 750; font-size: 1.05rem; color: var(--t1); }
  .who small { font: 500 0.76rem var(--mono); color: var(--t4); margin-left: 0.4rem; }
  .pill {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0.18rem 0.55rem; border-radius: 999px;
    background: var(--inset); border: 1px solid var(--line); color: var(--t3);
  }
  .pill.on { --accent: var(--blue); background: color-mix(in oklch, var(--accent) 18%, transparent);
             border-color: color-mix(in oklch, var(--accent) 32%, transparent); color: var(--accent); }
  .meter { margin-left: auto; font-size: 0.76rem; color: var(--t4); font-variant-numeric: tabular-nums; }

  .budget { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.8rem 0 0.15rem; }
  .lv { font: 600 0.72rem var(--mono); padding: 0.24rem 0.55rem; border-radius: 8px; }
  .lv em { font-style: normal; opacity: 0.7; }
  .lv[data-policy="free"]  { --accent: var(--green); }
  .lv[data-policy="ask"]   { --accent: var(--amber); }
  .lv[data-policy="never"] { --accent: var(--purple); }

  .never { margin-top: 0.55rem; font-size: 0.78rem; color: var(--t3); }
  .never b { color: var(--purple); font-weight: 650; }

  .ladder { margin-top: 0.9rem; border-top: 1px solid var(--line); padding-top: 0.85rem; }
  .tabs { display: flex; gap: 0.3rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .tab {
    font: 600 0.76rem var(--mono); padding: 0.32rem 0.65rem; border-radius: 9px;
    border: 1px solid var(--line); background: var(--inset); color: var(--t3); cursor: pointer;
    transition: color 0.12s, border-color 0.12s;
  }
  .tab:hover { color: var(--t1); }
  .tab[aria-selected="true"] {
    background: color-mix(in oklch, var(--t1) 92%, transparent);
    color: var(--bg); border-color: transparent;
  }
  .seen { font-size: 0.82rem; font-weight: 650; color: var(--t2); }

  .kv { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 0.35rem 0.9rem; font-size: 0.84rem; margin: 0.55rem 0 0; }
  .kv dt { font: 600 0.78rem var(--mono); color: var(--t2); }
  .kv dd { margin: 0; color: var(--t1); overflow-wrap: anywhere; }
  .lvl {
    font: 700 0.62rem var(--mono); padding: 0.08rem 0.34rem; border-radius: 5px;
    margin-left: 0.3rem; vertical-align: 1px;
  }
  .lvl.L0 { --accent: var(--l0); } .lvl.L1 { --accent: var(--l1); }
  .lvl.L2 { --accent: var(--l2); } .lvl.L3 { --accent: var(--l3); }

  .withheld { margin-top: 0.75rem; font-size: 0.78rem; color: var(--t3); }
  .withheld code {
    font: 0.74rem var(--mono); background: var(--inset); border: 1px solid var(--line);
    border-radius: 6px; padding: 0.1rem 0.35rem; color: var(--t3);
  }
  .withheld code.redacted { color: var(--purple); border-color: color-mix(in oklch, var(--purple) 30%, transparent); font-weight: 600; }
  .empty { color: var(--t4); font-style: italic; font-size: 0.85rem; }

  .hollow { text-align: center; padding: 2.5rem 1rem; color: var(--t3); }
  .hollow .chikny { --chikny-scale: 0.5; margin: 0 auto 0.6rem; }

  /* ------------------------------------------------------- connect / token */
  .conn-lead { font-size: 0.85rem; color: var(--t3); margin-bottom: 0.8rem; }
  .conn-lead b { color: var(--t1); font-weight: 650; }
  .tokrow { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .tok {
    flex: 1 1 22rem; min-width: 0; background: var(--inset); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.55rem 0.7rem; font: 0.82rem var(--mono);
    color: var(--amber); overflow-x: auto; white-space: nowrap;
  }
  .tok.hidden { color: var(--t4); letter-spacing: 0.1em; }
  .btn {
    font: 650 0.8rem var(--font); padding: 0.5rem 0.85rem; border-radius: 10px;
    border: 1px solid var(--line); background: var(--inset); color: var(--t2); cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { color: var(--t1); border-color: oklch(1 0 0 / 0.16); }
  .btn.danger { color: var(--purple); border-color: color-mix(in oklch, var(--purple) 30%, transparent); }
  pre.cmd {
    background: var(--inset); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.8rem 0.9rem; margin: 0.8rem 0 0; overflow-x: auto;
    font: 600 0.78rem/1.6 var(--mono); color: var(--t2);
  }
  .conn-warn {
    margin-top: 0.8rem; padding: 0.6rem 0.75rem; border-radius: 12px; font-size: 0.8rem;
    background: color-mix(in oklch, var(--amber) 14%, transparent);
    border: 1px solid color-mix(in oklch, var(--amber) 32%, transparent);
    color: var(--amber);
  }

  @media (max-width: 620px) {
    .meter, .c-meta { margin-left: 0; width: 100%; }
    .bubble { max-width: 100%; }
  }

  /* ================================================================= shell
     Sidebar + one visible panel. Everything used to be stacked on a single
     scrolling page, so the thing you actually wanted was always three
     screens down past the parts you did not. */
  body { padding: 0; }
  /* The rail paints the sidebar column for the FULL page height. `.side` itself
     is sticky and only 100vh tall, so on a long panel its background ran out
     partway down and the column turned into body grey below the fold. */
  .shell {
    display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh;
    background: linear-gradient(to right, var(--panel) 0 232px, transparent 232px);
  }

  .side {
    position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 0.15rem;
    padding: 1.15rem 0.8rem 1rem;
    border-right: 1px solid var(--line);
  }
  .side-brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 0.35rem 1rem; }
  .side-brand .chikny { --chikny-scale: 0.375; }
  .side-brand .brand { font-size: 1.25rem; letter-spacing: -0.03em; }

  .side-label {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--t4); font-weight: 700; padding: 0.9rem 0.6rem 0.4rem;
  }

  /* navtab, not tab: `.tab` already belongs to the L0-L3 level switcher inside
     the profile card, and a shared name here flattened it into a column of
     full-width buttons. */
  .navtab {
    position: relative;
    display: flex; align-items: center; gap: 0.6rem; width: 100%;
    padding: 0.5rem 0.6rem; border: 0; border-radius: 10px;
    background: transparent; color: var(--t3); cursor: pointer;
    font: 600 0.88rem var(--font); text-align: left; text-decoration: none;
    transition: background 0.12s, color 0.12s;
  }
  .navtab:hover { background: var(--inset); color: var(--t1); }
  .navtab[aria-current="page"] { background: var(--inset); color: var(--t1); }
  /* The active rail reads as "you are here" without relying on colour alone. */
  .navtab[aria-current="page"]::before {
    content: ""; position: absolute; left: 0.15rem; width: 3px; height: 1.15rem;
    border-radius: 2px; background: var(--amber);
  }
  .navtab .ico { width: 1.1rem; text-align: center; flex: none; font-size: 0.95rem; opacity: 0.9; }
  .navtab .count {
    margin-left: auto; font: 700 0.7rem var(--mono); padding: 0.05rem 0.4rem;
    border-radius: 999px; background: var(--bg); color: var(--t3);
  }
  .navtab[aria-current="page"] .count { color: var(--amber); }

  .side-foot { margin-top: auto; padding-top: 0.8rem; border-top: 1px solid var(--line); }
  .side-me { padding: 0.15rem 0.6rem 0.6rem; font-size: 0.78rem; color: var(--t3); overflow-wrap: anywhere; }
  .side-me b { display: block; color: var(--t1); font-size: 0.86rem; font-weight: 650; }
  .side-foot form { display: block; }
  .side-foot .navtab { font-weight: 500; font-size: 0.82rem; color: var(--t4); }

  .main { padding: 1.5rem 1.6rem 5rem; min-width: 0; }
  .main-head {
    display: flex; align-items: baseline; gap: 0.7rem;
    margin-bottom: 1.1rem; flex-wrap: wrap;
  }
  .main-head h1 { margin: 0; font-size: 1.35rem; font-weight: 750; letter-spacing: -0.02em; }
  .main-head .blurb { color: var(--t4); font-size: 0.85rem; }
  .main-head .right { margin-left: auto; display: flex; align-items: center; gap: 0.6rem; }

  .panel[hidden] { display: none; }
  .panel > h2:first-child { margin-top: 0; }


  @media (max-width: 800px) {
    .shell { grid-template-columns: 1fr; background: none; }
    .side {
      position: static; max-height: none;
      flex-direction: row; flex-wrap: nowrap; align-items: center;
      background: var(--panel);
      gap: 0.3rem; overflow-x: auto; overflow-y: visible; padding: 0.7rem 0.8rem;
      border-right: 0; border-bottom: 1px solid var(--line);
    }
    /* #tabs is its own flex item, so its buttons kept stacking inside it and the
       bar rendered as a ragged grid. display:contents dissolves the wrapper so
       every tab becomes a direct child of the row. */
    .side #tabs { display: contents; }
    /* width:100% is what stacks them in the rail; on one row it forces a wrap. */
    .side .navtab { width: auto; flex: 0 0 auto; white-space: nowrap; }
    .side-brand, .side-label, .side-me { display: none; }
    .side-foot { margin: 0; padding: 0; border: 0; display: flex; flex: 0 0 auto; }
    .navtab[aria-current="page"]::before { display: none; }
    .main { padding: 1.1rem 1rem 4rem; }
  }
</style>
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="side-brand">
      <div class="chikny chikny--logo" role="img" aria-label="Wingman mascot"></div>
      <div class="brand"><b>Wing</b><i>man</i></div>
    </div>

    <nav id="tabs">
      <button class="navtab" data-panel="profile"><span class="ico">&#9673;</span> Profile</button>
      <button class="navtab" data-panel="channels"><span class="ico">&#8644;</span> Negotiations <span class="count" id="cChannels" hidden></span></button>
      <button class="navtab" data-panel="candidates"><span class="ico">&#10022;</span> Candidates <span class="count" id="cCandidates" hidden></span></button>
      <button class="navtab" data-panel="connect"><span class="ico">&#9095;</span> Connect</button>
      <button class="navtab" data-panel="system" id="tabSystem" hidden><span class="ico">&#9881;</span> System</button>
    </nav>

    <div class="side-label">Settings</div>
    <a class="navtab" href="/settings"><span class="ico">&#9703;</span> Consent budget</a>
    <a class="navtab" href="/brand/"><span class="ico">&#9680;</span> Brand</a>

    <div class="side-foot">
      <div class="side-me" id="me"></div>
      <form method="POST" action="/logout">
        <button class="navtab" type="submit"><span class="ico">&#8594;</span> Sign out</button>
      </form>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <h1 id="panelTitle">Profile</h1>
      <span class="blurb" id="panelBlurb"></span>
      <div class="right">
        <span id="tick"></span>
        <button class="ghost" id="refresh">Refresh</button>
      </div>
    </div>

    <section class="panel" id="p-profile">
      <div class="plist" id="profiles"></div>
    </section>

    <section class="panel" id="p-channels" hidden>
      <div class="clist" id="channels"></div>
    </section>

    <section class="panel" id="p-candidates" hidden>
      <div class="clist" id="candidates"></div>
    </section>

    <section class="panel" id="p-connect" hidden>
      <div class="card" id="connect"></div>
    </section>

    <!-- Owner-only: this machine&rsquo;s TrueForge wiring, which is nobody else&rsquo;s
         business. The tab itself stays hidden for everyone else. -->
    <section class="panel" id="p-system" hidden>
      <h2>Pipeline</h2>
      <div class="card"><div class="checks" id="checks"></div></div>
      <h2>Tool surface <span class="note" id="policyNote"></span></h2>
      <div class="card" id="toolsCard"></div>
    </section>
  </main>

</div>

<script type="module">
/**
 * Auth is a session cookie now, set at /login and sent automatically with
 * same-origin requests — there is no key for this page to hold. If the session
 * has expired the server answers 401 and we bounce to the login form.
 */
const api = async (path, init = {}) => {
  const res = await fetch(path, init);
  if (res.status === 401) { location.href = '/login'; throw new Error('signed out'); }
  return res;
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const time = (iso) => new Date(iso).toLocaleTimeString();

/* ---------------------------------------------------------------- sections
   One panel visible at a time. The choice is remembered, because a dashboard
   that snaps back to the first tab on every refresh is worse than no tabs. */
const PANELS = {
  profile:    { title: 'Profile',      blurb: 'what your wingman knows about you' },
  channels:   { title: 'Negotiations', blurb: 'your agent talking to other agents' },
  candidates: { title: 'Candidates',   blurb: 'everyone else, at L0 only' },
  connect:    { title: 'Connect',      blurb: 'point a machine at this server' },
  system:     { title: 'System',       blurb: 'this host\'s TrueForge wiring' },
};
const PANEL_STORE = 'wingman.panel';

function showPanel(name) {
  if (!PANELS[name]) name = 'profile';
  const tab = document.querySelector(`.navtab[data-panel="${name}"]`);
  if (tab?.hidden) name = 'profile';   // e.g. System, for a non-owner

  for (const key of Object.keys(PANELS)) {
    $(`p-${key}`).hidden = key !== name;
    document
      .querySelector(`.navtab[data-panel="${key}"]`)
      ?.setAttribute('aria-current', key === name ? 'page' : 'false');
  }
  $('panelTitle').textContent = PANELS[name].title;
  $('panelBlurb').textContent = PANELS[name].blurb;
  localStorage.setItem(PANEL_STORE, name);
}

document.querySelectorAll('.navtab[data-panel]').forEach((b) =>
  b.addEventListener('click', () => showPanel(b.dataset.panel)),
);

/** Counts on the rail, so you can see there is something waiting without opening it. */
function setCount(id, n) {
  const el = $(id);
  el.textContent = n;
  el.hidden = !n;
}

let schema = { levels: ['L0','L1','L2','L3'], levelLabels: {}, fieldLevels: {} };
const selectedLevel = new Map();   // userId -> level, survives refresh

const TAG = { '@read-only': 'ro', '@write': 'w', '@destructive': 'd', '@unannotated': 'u' };

/** userId -> display name, so negotiations read as people rather than as ids. */
let names = new Map();
const nameOf = (id) => names.get(id) ?? id;

function renderChecks(checks) {
  $('checks').innerHTML = checks.map(c => `
    <div class="check">
      <div class="dot ${c.state}"></div>
      <div>
        <b>${esc(c.label)}</b>
        <span>${esc(c.detail)}</span>
        ${c.fix ? `<code>${esc(c.fix)}</code>` : ''}
      </div>
    </div>`).join('');
}

function renderTools(tools, policy) {
  $('policyNote').textContent = policy
    ? `— require_approval_for_tools: ${policy.length ? policy.join(', ') : '(none)'}`
    : '— no agent yet, so no policy in force';

  if (!tools.length) {
    $('toolsCard').innerHTML = `<div class="empty">TrueForge cannot see any tools.</div>`;
    return;
  }
  $('toolsCard').innerHTML = `
    <div class="scroll"><table>
      <thead><tr><th>Tool</th><th>Class</th><th>Approval</th><th>What it does</th></tr></thead>
      <tbody>${tools.map(t => `
        <tr>
          <td class="name">${esc(t.name)}</td>
          <td><span class="tag tint ${TAG[t.klass] ?? 'u'}">${esc(t.klass)}</span></td>
          <td class="gate ${t.gated ? 'on' : 'off'}">${t.gated ? 'asks you' : 'autonomous'}</td>
          <td class="desc">${esc(t.description)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
}

/**
 * Live negotiations. The server strips disclosed *values* from this feed and
 * sends only field names — so the dashboard can show that a disclosure
 * happened, and under what authority, without becoming a way to read the
 * other side's profile.
 */
function renderChannels(channels) {
  if (!channels.length) {
    $('channels').innerHTML = `
      <div class="card hollow">
        <div class="chikny chikny--resting"></div>
        <div>No negotiations yet. When two wingmen open a channel it shows up here.</div>
      </div>`;
    return;
  }

  $('channels').innerHTML = channels.map(c => {
    const [a, b] = c.parties;
    const verdicts = Object.entries(c.verdicts ?? {});
    const allMatch = verdicts.length === 2 && verdicts.every(([, v]) => v.verdict === 'match');
    const anyPass = verdicts.some(([, v]) => v.verdict === 'pass');

    // Pose doubles as the status light: the mascot is the state.
    const pose = allMatch ? 'matched' : anyPass ? 'passed' : c.closed ? 'thinking' : 'negotiating';

    const turns = (c.turns ?? []).map(t => `
      <div class="turn ${t.from === b ? 'right' : ''}">
        <div class="bubble">
          <span class="from">${esc(nameOf(t.from))} · ${esc(t.level)}</span>
          <span class="msg">${esc(t.message)}</span>
        </div>
      </div>`).join('');

    const discl = (c.disclosures ?? []).map(d => `
      <span class="dchip tint ${esc(d.via)}" style="--accent: var(--${String(d.level).toLowerCase()})">
        ${esc(nameOf(d.from))}: ${esc(d.field)}
      </span>`).join('');

    const vrows = verdicts.map(([who, v]) => `
      <div class="vrow">
        ${esc(nameOf(who))} returned <b class="${esc(v.verdict)}">${esc(v.verdict)}</b>${v.reason ? ` — ${esc(v.reason)}` : ''}
      </div>`).join('');

    const outcome = c.date
      ? `<div class="outcome tint" style="--accent: var(--green)">
           Date · ${esc(c.date.venue)} at ${esc(new Date(c.date.isoTime).toLocaleString())}
           — proposed by ${esc(nameOf(c.date.proposedBy))}, accepted by ${esc((c.date.acceptedBy ?? []).map(nameOf).join(', ') || 'nobody yet')}
         </div>`
      : c.intro
        ? `<div class="outcome tint" style="--accent: var(--blue)">
             Intro from ${esc(nameOf(c.intro.from))} — ${esc(c.intro.text)}
           </div>`
        : '';

    return `
      <div class="card">
        <div class="c-head">
          <div class="chikny chikny--${pose}"></div>
          <span class="vs">${esc(nameOf(a))}<em>vs</em>${esc(nameOf(b))}</span>
          <span class="lv tint" data-policy="free" style="--accent: var(--${String(c.level?.[a] ?? 'L0').toLowerCase()})">${esc(c.level?.[a] ?? 'L0')}</span>
          <span class="lv tint" data-policy="free" style="--accent: var(--${String(c.level?.[b] ?? 'L0').toLowerCase()})">${esc(c.level?.[b] ?? 'L0')}</span>
          <span class="c-meta">
            ${c.exchanges}/${c.maxExchanges} exchanges ·
            ${c.closed ? 'closed' : `waiting on ${esc(nameOf(c.waitingOn))}`} ·
            opened ${esc(time(c.createdAt))}
          </span>
        </div>

        ${turns ? `<div class="turns">${turns}</div>` : `<div class="turns"><div class="empty">No turns posted yet.</div></div>`}
        ${discl ? `<div class="discl"><span class="lab">disclosed:</span>${discl}</div>` : ''}
        ${vrows ? `<div class="verdicts">${vrows}</div>` : ''}
        ${outcome}
      </div>`;
  }).join('');
}

/**
 * The token your own machine authenticates with. Masked until asked for: this
 * page gets screen-shared during the demo, and the token IS the identity —
 * anyone who reads it off a screenshot can act as you.
 */
let connectData = null;
let panelReady = false;
let tokenShown = false;

function renderConnect() {
  if (!connectData) return;
  const masked = '•'.repeat(28);
  // Mask it in the command too. Hiding the token in one box while printing it
  // in full in the box underneath would be security theatre.
  const shownCmd = tokenShown
    ? connectData.command
    : connectData.command.split(connectData.token).join(masked);
  $('connect').innerHTML = `
    <div class="conn-lead">
      Your agent proves who it is with this token. Paste it on <b>your</b> machine —
      it reaches your profile and nobody else's.
    </div>
    <div class="tokrow">
      <div class="tok ${tokenShown ? '' : 'hidden'}" id="tok">${
        tokenShown ? esc(connectData.token) : masked
      }</div>
      <button class="btn" id="reveal">${tokenShown ? 'Hide' : 'Reveal'}</button>
      <button class="btn" id="copyTok">Copy token</button>
      <button class="btn danger" id="rotate">Regenerate</button>
    </div>
    <pre class="cmd" id="cmd">${esc(shownCmd)}</pre>
    <button class="btn" id="copyCmd" style="margin-top:.6rem">Copy setup command</button>
    <div class="conn-warn">
      Run that on your own laptop after <code>npm install</code>. Regenerating
      invalidates the old token immediately — any machine still using it stops working.
    </div>`;

  $('reveal').onclick = () => { tokenShown = !tokenShown; renderConnect(); };
  $('copyTok').onclick = async () => {
    await navigator.clipboard.writeText(connectData.token);
    $('copyTok').textContent = 'Copied';
    setTimeout(() => ($('copyTok').textContent = 'Copy token'), 1500);
  };
  $('copyCmd').onclick = async () => {
    await navigator.clipboard.writeText(connectData.command);
    $('copyCmd').textContent = 'Copied';
    setTimeout(() => ($('copyCmd').textContent = 'Copy setup command'), 1500);
  };
  $('rotate').onclick = async () => {
    $('rotate').disabled = true;
    $('rotate').textContent = 'Regenerating…';
    connectData = await api('/api/token/rotate', { method: 'POST' }).then(r => r.json());
    tokenShown = true; // they just asked for a new one; hiding it would be perverse
    renderConnect();
  };
}

/** Your own profile — the one profile this dashboard shows in full. */
function renderProfiles(profiles) {
  if (!profiles.length) {
    $('profiles').innerHTML = `
      <div class="card hollow">
        <div class="chikny chikny--resting"></div>
        <div>No profile yet. Talk to your agent and it will write one here.</div>
      </div>`;
    return;
  }

  $('profiles').innerHTML = profiles.map(p => {
    const level = selectedLevel.get(p.userId) ?? 'L0';
    const view = p.views[level];
    const entries = Object.entries(view.fields);

    const budget = schema.levels.map(l => `
      <span class="lv tint" data-policy="${esc(p.budget.levels[l])}">
        ${l} <em>${esc(schema.levelLabels[l] ?? '')}</em> · ${esc(p.budget.levels[l])}
      </span>`).join('');

    const tabs = schema.levels.map(l => `
      <button class="tab" role="tab" aria-selected="${l === level}"
              data-user="${esc(p.userId)}" data-level="${l}">
        ${l} ${esc(schema.levelLabels[l] ?? '')}
      </button>`).join('');

    const rows = entries.length
      ? `<dl class="kv">${entries.map(([k, v]) => `
          <dt>${esc(k)}<span class="lvl tint ${schema.fieldLevels[k]}">${schema.fieldLevels[k]}</span></dt>
          <dd>${esc(v)}</dd>`).join('')}</dl>`
      : `<div class="empty">Nothing visible at ${level}.</div>`;

    return `
      <div class="card">
        <div class="p-head">
          <div class="chikny chikny--${p.isPersona ? 'idle' : 'learning'}"></div>
          <span class="who">${esc(p.displayName ?? p.userId)}${
            // Case-insensitive: "Bob" over id "bob" would otherwise read "Bobbob".
            p.displayName && p.displayName.toLowerCase() !== p.userId.toLowerCase()
              ? `<small>${esc(p.userId)}</small>` : ''
          }</span>
          <span class="pill">${p.isPersona ? 'persona' : 'you'}</span>
          ${p.enrolled ? `<span class="pill on">enrolled</span>` : ''}
          <span class="meter">${p.known}/${p.total} fields · updated ${esc(time(p.updatedAt))}</span>
        </div>

        <div class="budget">${budget}</div>
        <div class="never">
          never share:
          ${p.budget.neverShare.length
            ? p.budget.neverShare.map(n => `<b>${esc(n)}</b>`).join(', ')
            : '<span class="empty">nothing</span>'}
          · forwardness ${p.budget.forwardness}/5
        </div>

        <div class="ladder">
          <div class="tabs" role="tablist">${tabs}</div>
          <div class="seen">A stranger's agent at ${level} sees:</div>
          ${rows}
          ${view.redacted.length ? `<div class="withheld">stripped by never-share: ${view.redacted.map(f => `<code class="redacted">${esc(f)}</code>`).join(' ')}</div>` : ''}
          ${view.withheldAbove.length ? `<div class="withheld">above this level: ${view.withheldAbove.map(f => `<code>${esc(f)}</code>`).join(' ')}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  // Level switching is local — no refetch, since all four views are already here.
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedLevel.set(btn.dataset.user, btn.dataset.level);
      renderProfiles(lastProfiles);
    });
  });
}

/**
 * Everyone else. L0 only — this is the same projection the list_candidates tool
 * hands an agent, so the dashboard cannot show you more about a stranger than
 * your wingman could learn on its own.
 */
function renderCandidates(candidates) {
  if (!candidates.length) {
    $('candidates').innerHTML = `
      <div class="card hollow">
        <div class="chikny chikny--idle"></div>
        <div>Nobody else has joined yet. Share the join link.</div>
      </div>`;
    return;
  }

  $('candidates').innerHTML = candidates.map(c => {
    const entries = Object.entries(c.fields ?? {});
    const rows = entries.length
      ? `<dl class="kv">${entries.map(([k, v]) => `
          <dt>${esc(k)}<span class="lvl tint ${schema.fieldLevels[k]}">${schema.fieldLevels[k]}</span></dt>
          <dd>${esc(v)}</dd>`).join('')}</dl>`
      : `<div class="empty">Nothing public yet.</div>`;

    return `
      <div class="card">
        <div class="p-head">
          <div class="chikny chikny--${c.isPersona ? 'idle' : 'resting'}"></div>
          <span class="who">${esc(c.displayName ?? c.userId)}</span>
          <span class="pill">${c.isPersona ? 'persona' : 'person'}</span>
          <span class="meter">L0 public only</span>
        </div>
        ${rows}
        ${c.redacted?.length
          ? `<div class="withheld">they never share: ${c.redacted.map(f => `<code class="redacted">${esc(f)}</code>`).join(' ')}</div>`
          : ''}
      </div>`;
  }).join('');
}

let lastProfiles = [];

async function load() {
  try {
    const me = await api('/api/me').then(r => r.json());
    const [sc, ch, cand] = await Promise.all([
      api('/api/schema').then(r => r.json()),
      api('/api/channels').then(r => r.json()),
      api('/api/candidates').then(r => r.json()),
    ]);

    schema = sc;
    lastProfiles = [me];
    // Names for the negotiation transcript: me plus everyone at L0.
    names = new Map([[me.userId, me.displayName ?? me.userId],
                     ...(cand.candidates ?? []).map(c => [c.userId, c.displayName ?? c.userId])]);

    $('me').textContent = `${me.displayName}${me.username ? ` · @${me.username}` : ''}`;

    // The pipeline panel is the host's own wiring, so it is fetched only when
    // this session actually owns the server — a 403 here is expected for
    // everyone else and must not blank the rest of the page.
    if (me.isOwner) {
      $('tabSystem').hidden = false;
      const st = await api('/api/status').then(r => r.json());
      renderChecks(st.checks);
      renderTools(st.tools, st.approvalPolicy);
    }

    // Fetched once, not on every poll: the token only changes when you rotate
    // it, and re-rendering the panel every 5s would snap it back to masked and
    // wipe the "Copied" feedback mid-click.
    if (!connectData) {
      connectData = await api('/api/token').then(r => r.json());
      renderConnect();
    }

    renderProfiles(lastProfiles);
    renderChannels(ch.channels ?? []);
    renderCandidates(cand.candidates ?? []);
    setCount('cChannels', (ch.channels ?? []).length);
    setCount('cCandidates', (cand.candidates ?? []).length);
    // Restored after the owner tab is known, so a saved "system" choice is not
    // silently downgraded to Profile on every load.
    if (!panelReady) { showPanel(localStorage.getItem(PANEL_STORE) ?? 'profile'); panelReady = true; }
    $('tick').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    // The 401 path already redirected to /login; anything else is a real failure.
    if (e?.message !== 'signed out') $('tick').textContent = 'refresh failed';
  }
}

$('refresh').addEventListener('click', load);
await load();
setInterval(load, 5000);
</script>
</body>
</html>
