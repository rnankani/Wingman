<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wingman</title>
<link rel="icon" href="/brand/icon-32.png" />
<link rel="apple-touch-icon" href="/brand/icon-180.png" />
<link rel="stylesheet" href="/brand/wingman.css" />
<link rel="stylesheet" href="/theme.css" />
<style>
  body { overflow: hidden; }
  .app { display: grid; grid-template-columns: 286px 1fr; height: 100vh; height: 100dvh; }

  /* ══════════════════════════════════════════════════════════════ sidebar */
  .sidebar {
    border-right: 1px solid oklch(0 0 0 / 0.4);
    box-shadow: 1px 0 0 oklch(1 0 0 / 0.03);
    display: flex; flex-direction: column; padding: 20px 18px 18px; min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 16px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5), inset 0 -1px 0 oklch(0.55 0.12 70 / 0.5),
                var(--cast-1), 0 5px 14px -5px oklch(0.8 0.16 88 / 0.55);
  }
  .brand-mark svg { width: 17px; height: 17px; color: var(--yolk-ink); }
  .brand span { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }

  .agent {
    background: linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
    border: 1px solid var(--line); border-radius: var(--r-card);
    box-shadow: var(--raise); padding: 12px 12px 13px; margin-bottom: 18px; text-align: center;
  }
  .stage {
    position: relative; border-radius: 12px; background: var(--well);
    box-shadow: var(--sink); padding: 6px 0 2px; margin-bottom: 10px;
    display: flex; justify-content: center; overflow: hidden;
  }
  .stage::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(60% 55% at 50% 78%, oklch(0.865 0.163 94 / 0.13), transparent 70%);
    pointer-events: none;
  }
  .stage .chikny { --chikny-scale: 0.5; position: relative; z-index: 1; }
  .agent[data-pace="warn"] .stage,
  .agent[data-pace="down"] .stage { animation: breathe 1.9s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { box-shadow: var(--sink), 0 0 0 1.5px color-mix(in oklch, var(--yolk) 50%, transparent), 0 0 0 0 oklch(0.865 0.163 94 / 0.30); }
    50%      { box-shadow: var(--sink), 0 0 0 1.5px color-mix(in oklch, var(--yolk) 70%, transparent), 0 0 22px 3px oklch(0.865 0.163 94 / 0.16); }
  }
  .agent-state { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
  .agent[data-pace="down"] .agent-state { color: var(--yolk); }
  .agent-sub { font-size: 13px; color: var(--text-4); margin-top: 1px; }

  .search {
    display: flex; align-items: center; gap: 10px; background: var(--well);
    border: 1px solid oklch(0 0 0 / 0.35); border-radius: var(--r-ctl);
    box-shadow: var(--sink); padding: 10px 12px; margin-bottom: 16px;
  }
  .search svg { width: 16px; height: 16px; color: var(--text-4); flex: none; }
  .search input { background: none; border: none; outline: none; flex: 1; min-width: 0; font-size: 14.5px; }
  .search input::placeholder { color: var(--text-4); }
  .kbd {
    flex: none; font-size: 12px; font-weight: 500; color: var(--text-4);
    background: linear-gradient(180deg, oklch(0.33 0 0), oklch(0.29 0 0));
    border-radius: 6px; padding: 2px 6px;
    box-shadow: var(--lip-soft), 0 1px 2px oklch(0 0 0 / 0.4);
  }

  .nav { display: flex; flex-direction: column; gap: 7px; }
  .navitem {
    position: relative; display: flex; align-items: center; gap: 13px; width: 100%;
    text-align: left; cursor: pointer; padding: 11px 13px; border-radius: var(--r-ctl);
    font-size: 15.5px; font-weight: 500; letter-spacing: -0.006em; color: var(--text-2);
    background: linear-gradient(180deg, oklch(0.305 0 0), oklch(0.283 0 0));
    border: 1px solid var(--line); text-decoration: none;
    box-shadow: var(--lip-soft), var(--cast-1), 0 3px 7px -3px oklch(0 0 0 / 0.4);
    transition: transform .11s ease, box-shadow .16s ease, color .14s ease;
  }
  .navitem svg { width: 19px; height: 19px; flex: none; color: var(--text-3); transition: color .14s ease; }
  .navitem:hover { transform: translateY(-1px); color: var(--text); box-shadow: var(--lip), var(--cast-1), 0 7px 15px -4px oklch(0 0 0 / 0.48); }
  .navitem:active { transform: translateY(1px); box-shadow: var(--sink); }
  .navitem[aria-current="true"] {
    color: var(--text);
    background: linear-gradient(180deg, oklch(0.355 0 0), oklch(0.305 0 0));
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.13), var(--keel), var(--cast-1), 0 8px 18px -5px oklch(0 0 0 / 0.5);
  }
  .navitem[aria-current="true"] svg { color: var(--yolk); }
  .navitem[aria-current="true"]::before {
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; border-radius: 0 3px 3px 0;
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: 0 0 10px oklch(0.865 0.163 94 / 0.55);
  }
  .navitem .count {
    margin-left: auto; font-size: 13px; font-weight: 600; color: var(--text-3);
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: var(--well); box-shadow: var(--sink); font-variant-numeric: tabular-nums;
  }
  .navitem .count.hot { color: var(--yolk-ink); background: linear-gradient(180deg, var(--yolk), var(--yolk-deep)); box-shadow: inset 0 1px 0 oklch(1 0 0/.45), 0 2px 6px -1px oklch(0.8 0.16 88 / .5); }

  .grow { flex: 1; }
  .whoami {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; margin-top: 14px;
    border-radius: var(--r-ctl); background: linear-gradient(180deg, oklch(0.30 0 0), oklch(0.281 0 0));
    border: 1px solid var(--line); box-shadow: var(--lip-soft), var(--cast-1);
  }
  .whoami .av {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--well); box-shadow: var(--sink);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--text-3);
  }
  .whoami .nm { font-size: 15px; font-weight: 550; }
  .whoami .st { font-size: 13px; color: var(--text-4); }

  /* ═════════════════════════════════════════════════════════════════ main */
  .main { overflow-y: auto; padding: 26px 30px 60px; min-height: 0; }
  .main-top { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .main-top h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.024em; }
  .main-top .acts { margin-left: auto; display: flex; gap: 9px; align-items: center; }
  .tick { font-size: 13px; color: var(--text-4); font-variant-numeric: tabular-nums; }
  .lede { color: var(--text-3); font-size: 15px; margin: 0 0 24px; max-width: 62ch; }

  section.block { margin-bottom: 30px; }
  section.block > .eyebrow { display: block; margin-bottom: 11px; padding-left: 3px; }

  /* pipeline checks */
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .check { padding: 15px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .check .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 6px;
    box-shadow: 0 0 10px currentColor;
  }
  .check .dot.ok   { background: var(--green); color: oklch(0.72 0.13 145 / 0.7); }
  .check .dot.warn { background: var(--amber); color: oklch(0.76 0.13 75 / 0.7); }
  .check .dot.down { background: var(--red);   color: oklch(0.68 0.17 25 / 0.7); }
  .check b { display: block; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
  .check p { margin: 3px 0 0; font-size: 13.8px; color: var(--text-3); line-height: 1.45; overflow-wrap: anywhere; }
  .fix {
    display: inline-block; margin-top: 9px; font-size: 12.5px;
    background: var(--well); box-shadow: var(--sink); border-radius: 8px;
    padding: 5px 9px; color: var(--yolk); overflow-wrap: anywhere;
  }

  /* tool surface */
  .tools { padding: 4px 0; overflow-x: auto; }
  .trow {
    display: grid; grid-template-columns: minmax(150px,1fr) 120px 110px minmax(200px,2fr);
    gap: 14px; align-items: center; padding: 13px 18px;
  }
  .trow + .trow { border-top: 1px solid oklch(0 0 0 / 0.28); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.04); }
  .thead { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-4); padding-bottom: 4px; }
  .tname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; font-weight: 600; }
  .tdesc { font-size: 13.5px; color: var(--text-3); }
  .gate { font-size: 13.5px; font-weight: 600; }
  .gate.on { color: var(--yolk); } .gate.off { color: var(--text-4); font-weight: 500; }

  /* profiles */
  .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 18px; }
  .profile { padding: 17px 18px; }
  .p-head { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
  .p-av {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;
    box-shadow: var(--lip), var(--cast-1), 0 5px 12px -4px oklch(0 0 0 / 0.5);
  }
  .p-name { font-size: 17.5px; font-weight: 600; letter-spacing: -0.014em; }
  .p-meter { margin-left: auto; font-size: 13px; color: var(--text-4); font-variant-numeric: tabular-nums; text-align: right; }

  .budget { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
  .never { margin-top: 10px; font-size: 13.5px; color: var(--text-4); }
  .never b { color: var(--yolk); font-weight: 600; }

  .ladder { margin-top: 15px; border-top: 1px solid oklch(0 0 0 / 0.3); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.05); padding-top: 14px; }
  .tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 13px; }
  .tab {
    padding: 7px 13px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 600;
    color: var(--text-3); border: 1px solid var(--line);
    background: linear-gradient(180deg, oklch(0.325 0 0), oklch(0.292 0 0));
    box-shadow: var(--lip-soft), var(--cast-1);
    transition: transform .1s ease, color .13s ease;
  }
  .tab:hover { transform: translateY(-1px); color: var(--text); }
  .tab[aria-selected="true"] {
    color: var(--yolk-ink); border-color: var(--yolk-edge);
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5), var(--cast-1), 0 5px 13px -5px oklch(0.8 0.16 88 / 0.55);
  }
  .seen { font-size: 13.5px; color: var(--text-4); margin-bottom: 10px; }
  .kv { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 8px 14px; font-size: 14.5px; }
  .kv dt { font-weight: 600; color: var(--text-2); }
  .kv dd { margin: 0; color: var(--text-3); }
  .lvl { font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 5px; margin-left: 6px; vertical-align: 1.5px; }
  .lvl.L0 { color: var(--text-2); background: oklch(1 0 0 / 0.09); }
  .lvl.L1 { color: var(--blue);   background: color-mix(in oklch, var(--blue) 20%, transparent); }
  .lvl.L2 { color: var(--amber);  background: color-mix(in oklch, var(--amber) 20%, transparent); }
  .lvl.L3 { color: var(--purple); background: color-mix(in oklch, var(--purple) 20%, transparent); }
  .note { margin-top: 12px; font-size: 13px; color: var(--text-4); }
  .note code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--well); box-shadow: var(--sink); border-radius: 6px; padding: 2px 6px; margin-right: 4px; display: inline-block; }
  .note code.red { color: var(--red); }

  .hollow {
    border: 1px dashed oklch(1 0 0 / 0.1); border-radius: var(--r-card);
    padding: 30px 16px; text-align: center; font-size: 14.5px; color: var(--text-4);
    box-shadow: inset 0 1px 4px oklch(0 0 0 / 0.25);
  }
  .hollow .fix { margin-top: 10px; }

  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-6 9-9 18-9-1 6-4 10-9 12l-3 6-2-6-6-3z"/></svg>
      </div>
      <span>Wingman</span>
    </div>

    <div class="agent" id="agent" data-pace="idle">
      <div class="stage"><div class="chikny chikny--idle" id="duck" role="img" aria-label="Wingman agent"></div></div>
      <div class="agent-state" id="agentState">Checking…</div>
      <div class="agent-sub" id="agentSub">Reading the pipeline</div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search tools & profiles" autocomplete="off" />
      <span class="kbd">⌘K</span>
    </div>

    <nav class="nav">
      <button class="navitem" data-view="now" aria-current="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2.5"/></svg>
        Now
        <span class="count" id="cNow"></span>
      </button>
      <button class="navitem" data-view="people">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4"/><path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8"/></svg>
        People
        <span class="count" id="cPeople"></span>
      </button>
      <a class="navitem" href="/status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 20v-5"/><path d="M12 20V8"/><path d="M18 20v-9"/></svg>
        Status
      </a>
    </nav>

    <div class="grow"></div>

    <div class="whoami">
      <div class="av">Y</div>
      <div>
        <div class="nm">You</div>
        <div class="st" id="meState">No profile yet</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-top">
      <h1 id="title">Now</h1>
      <div class="acts">
        <span class="tick" id="tick"></span>
        <button class="btn" id="refresh">Refresh</button>
      </div>
    </div>
    <p class="lede" id="lede"></p>
    <div id="body"></div>
  </main>

</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let view = 'now', query = '';
let status = { checks: [], tools: [], approvalPolicy: null, trueforgeUrl: '' };
let profiles = [], schema = { levels: ['L0','L1','L2','L3'], levelLabels: {}, fieldLevels: {} };
const levelOf = new Map();   // userId -> selected ladder level, survives refresh
let lastSnap = '';

const hit = (s) => !query || s.toLowerCase().includes(query.toLowerCase());
const KLASS_TONE = { '@read-only': 'green', '@write': 'amber', '@destructive': 'red', '@unannotated': 'red' };
const TONE = { maya: 'blue', devon: 'green', priya: 'purple', sam: 'amber', lena: 'gray' };

/* ─────────────────────────────────────────── the duck mirrors pipeline health */
function paintDuck() {
  const worst = status.checks.some(c => c.state === 'down') ? 'down'
              : status.checks.some(c => c.state === 'warn') ? 'warn' : 'ok';
  const map = {
    ok:   ['idle',     'Connected',       'Pipeline is healthy'],
    warn: ['thinking', 'Needs a look',    'Something is misconfigured'],
    down: ['resting',  'Not connected',   'TrueForge is unreachable'],
  };
  const [pose, label, sub] = map[worst];
  $('duck').className = `chikny chikny--${pose}`;
  $('agent').dataset.pace = worst;
  $('agentState').textContent = label;
  $('agentSub').textContent = sub;
}

/* ────────────────────────────────────────────────────────────── Now: system */
function renderNow() {
  $('title').textContent = 'Now';
  $('lede').textContent = 'What the agent is wired to right now — the pipeline it depends on, and every tool it can reach, with the approval gate each one sits behind.';

  const checks = status.checks.filter(c => hit(c.label + ' ' + c.detail));
  const tools  = status.tools.filter(t => hit(t.name + ' ' + t.description));

  const checksHtml = checks.length ? `<div class="checks">${checks.map(c => `
    <div class="card check">
      <div class="dot ${c.state}"></div>
      <div style="min-width:0">
        <b>${esc(c.label)}</b>
        <p>${esc(c.detail)}</p>
        ${c.fix ? `<span class="fix mono">${esc(c.fix)}</span>` : ''}
      </div>
    </div>`).join('')}</div>`
    : `<div class="hollow">No checks match that search.</div>`;

  const policy = status.approvalPolicy;
  const policyNote = policy
    ? `Gated tools: ${policy.length ? policy.join(', ') : 'none'}`
    : 'No agent yet, so no approval policy is in force.';

  const toolsHtml = tools.length ? `
    <div class="card tools">
      <div class="trow thead"><span>Tool</span><span>Class</span><span>Approval</span><span>What it does</span></div>
      ${tools.map(t => `
        <div class="trow">
          <span class="tname">${esc(t.name)}</span>
          <span><span class="tag tag-${KLASS_TONE[t.klass] ?? 'gray'}">${esc(t.klass)}</span></span>
          <span class="gate ${t.gated ? 'on' : 'off'}">${t.gated ? 'Asks you' : 'Autonomous'}</span>
          <span class="tdesc">${esc(t.description)}</span>
        </div>`).join('')}
    </div>`
    : `<div class="hollow">
         TrueForge cannot see any tools.
         <br><span class="fix mono">npm run setup</span>
       </div>`;

  $('body').innerHTML = `
    <section class="block">
      <span class="eyebrow">Pipeline</span>
      ${checksHtml}
    </section>
    <section class="block">
      <span class="eyebrow">Tool surface — ${esc(policyNote)}</span>
      ${toolsHtml}
    </section>`;
}

/* ──────────────────────────────────────────────────────────── People: profiles */
function renderPeople() {
  $('title').textContent = 'People';
  $('lede').textContent = 'Every profile in the store, and exactly what a stranger’s agent would see at each rung of the disclosure ladder. These previews come from the same function the MCP tools call.';

  const list = profiles.filter(p => hit(p.userId + ' ' + Object.values(p.fields).join(' ')));
  if (!list.length) {
    $('body').innerHTML = `<div class="hollow">No profiles match.<br><span class="fix mono">npm run seed</span></div>`;
    return;
  }

  $('body').innerHTML = `<div class="plist">${list.map(p => {
    const lvl = levelOf.get(p.userId) ?? 'L0';
    const v = p.views[lvl];
    const tone = TONE[p.userId] ?? 'gray';
    const initial = (p.fields.name || p.userId).trim()[0].toUpperCase();

    const budget = schema.levels.map(l => {
      const pol = p.budget.levels[l];
      const t = pol === 'free' ? 'green' : pol === 'ask' ? 'amber' : 'red';
      return `<span class="tag tag-${t}">${l} ${esc(schema.levelLabels[l] ?? '')} · ${esc(pol)}</span>`;
    }).join('');

    const tabs = schema.levels.map(l =>
      `<button class="tab" role="tab" aria-selected="${l === lvl}" data-user="${esc(p.userId)}" data-level="${l}">${l} ${esc(schema.levelLabels[l] ?? '')}</button>`
    ).join('');

    const entries = Object.entries(v.fields);
    const rows = entries.length
      ? `<dl class="kv">${entries.map(([k, val]) =>
          `<dt>${esc(k)}<span class="lvl ${schema.fieldLevels[k]}">${schema.fieldLevels[k]}</span></dt><dd>${esc(val)}</dd>`).join('')}</dl>`
      : `<div class="seen">Nothing is visible at ${lvl}.</div>`;

    return `
      <div class="card profile">
        <div class="p-head">
          <div class="p-av tag-${tone}">${esc(initial)}</div>
          <div>
            <div class="p-name">${esc(p.fields.name || p.userId)}</div>
            <div class="seen" style="margin:0">${p.isPersona ? 'Seeded persona' : 'You'} · ${esc(p.userId)}</div>
          </div>
          <div class="p-meter">${p.known}/${p.total} fields<br>${new Date(p.updatedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>
        </div>

        <div class="budget">${budget}</div>
        <div class="never">Never share: ${
          p.budget.neverShare.length ? p.budget.neverShare.map(n => `<b>${esc(n)}</b>`).join(', ') : 'nothing'
        } · forwardness ${p.budget.forwardness}/5</div>

        <div class="ladder">
          <div class="tabs" role="tablist">${tabs}</div>
          <div class="seen">A stranger’s agent at ${lvl} sees:</div>
          ${rows}
          ${v.redacted.length ? `<div class="note">Stripped by never-share: ${v.redacted.map(f => `<code class="red">${esc(f)}</code>`).join('')}</div>` : ''}
          ${v.withheldAbove.length ? `<div class="note">Above this level: ${v.withheldAbove.map(f => `<code>${esc(f)}</code>`).join('')}</div>` : ''}
        </div>
      </div>`;
  }).join('')}</div>`;

  // Level switching is local — all four views already shipped with the payload.
  $('body').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    levelOf.set(b.dataset.user, b.dataset.level);
    renderPeople();
  }));
}

/* ─────────────────────────────────────────────────────────────────── plumbing */
function draw() {
  document.querySelectorAll('.navitem[data-view]').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.view === view)));

  // An empty pill still paints as a stray circle, so hide it rather than blank it.
  const setCount = (el, n, hot = false) => {
    el.textContent = n || '';
    el.style.display = n ? 'flex' : 'none';
    el.classList.toggle('hot', Boolean(n) && hot);
  };
  setCount($('cNow'), status.tools.length, status.tools.some(t => t.gated));
  setCount($('cPeople'), profiles.length);

  const me = profiles.find(p => !p.isPersona);
  $('meState').textContent = me ? `${me.known}/${me.total} fields known` : 'No profile yet';

  paintDuck();
  view === 'now' ? renderNow() : renderPeople();
}

document.querySelectorAll('.navitem[data-view]').forEach(b =>
  b.addEventListener('click', () => { view = b.dataset.view; draw(); }));
$('q').addEventListener('input', e => { query = e.target.value; draw(); });
$('refresh').addEventListener('click', () => load(true));
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); }
});

async function load(force = false) {
  try {
    const [st, pr, sc] = await Promise.all([
      fetch('/api/status').then(r => r.json()),
      fetch('/api/profiles').then(r => r.json()),
      fetch('/api/schema').then(r => r.json()),
    ]);
    const snap = JSON.stringify([st, pr.profiles]);
    if (!force && snap === lastSnap) return;
    lastSnap = snap;
    status = st; profiles = pr.profiles; schema = sc;
    $('tick').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    draw();
  } catch {
    $('tick').textContent = 'refresh failed';
  }
}

await load(true);
setInterval(() => load(), 5000);
</script>
</body>
</html>
