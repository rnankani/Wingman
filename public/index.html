<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wingman</title>
<link rel="icon" href="/brand/icon-32.png" />
<link rel="apple-touch-icon" href="/brand/icon-180.png" />
<style>
  :root {
    /* surfaces */
    --bg:        oklch(0.26 0 0);
    --panel:     oklch(0.301 0 0);
    --inset:     oklch(0.269 0 0);
    --line:      oklch(1 0 0 / 0.07);

    /* text */
    --text:      oklch(0.907 0 0);
    --text-2:    oklch(0.798 0 0);
    --text-3:    oklch(0.683 0 0);
    --text-4:    oklch(0.62 0 0);

    /* accents */
    --blue:      oklch(0.72 0.14 250);
    --green:     oklch(0.72 0.13 145);
    --amber:     oklch(0.76 0.13 75);
    --purple:    oklch(0.72 0.14 300);
    --gray:      oklch(0.72 0 0);

    --radius-panel: 20px;
    --radius-card: 14px;
    --radius-ctl: 10px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN",
                 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  svg { display: block; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: oklch(1 0 0 / 0.10); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; height: 100dvh; }

  /* ═══════════════════════════════════════════════════════════════ sidebar */
  .sidebar {
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 22px 18px 18px;
    min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 26px; }
  .brand svg { width: 24px; height: 24px; color: var(--text-2); }
  .brand span { font-size: 21px; font-weight: 600; letter-spacing: -0.015em; color: var(--text); }

  .search {
    display: flex; align-items: center; gap: 10px;
    background: var(--inset); border: 1px solid var(--line);
    border-radius: var(--radius-ctl); padding: 10px 12px; margin-bottom: 22px;
  }
  .search svg { width: 16px; height: 16px; color: var(--text-4); flex: none; }
  .search input { background: none; border: none; outline: none; flex: 1; min-width: 0; font-size: 14.5px; }
  .search input::placeholder { color: var(--text-4); }
  .kbd {
    flex: none; font-size: 12px; font-weight: 500; color: var(--text-4);
    background: oklch(1 0 0 / 0.06); border-radius: 6px; padding: 2px 6px;
  }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .navitem {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: none; border: none; border-radius: var(--radius-ctl);
    padding: 11px 12px; color: var(--text-2); cursor: pointer;
    font-size: 16px; font-weight: 450; letter-spacing: -0.005em;
  }
  .navitem svg { width: 20px; height: 20px; flex: none; color: var(--text-3); }
  .navitem:hover { background: oklch(1 0 0 / 0.04); color: var(--text); }
  .navitem[aria-current="true"] { background: var(--panel); color: var(--text); font-weight: 550; }
  .navitem[aria-current="true"] svg { color: var(--text-2); }
  .navitem .count { margin-left: auto; font-size: 14.5px; color: var(--text-4); font-variant-numeric: tabular-nums; }
  .navitem .live { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }

  .grow { flex: 1; }

  .whoami { display: flex; align-items: center; gap: 12px; padding: 16px 8px 2px; border-top: 1px solid var(--line); margin-top: 12px; }
  .whoami .av {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--inset); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--text-3);
  }
  .whoami .nm { font-size: 15px; font-weight: 500; color: var(--text); }
  .whoami .st { font-size: 13.5px; color: var(--text-4); }

  /* ══════════════════════════════════════════════════════════════════ main */
  .main { overflow-y: auto; padding: 26px 30px 60px; min-height: 0; }
  .main-top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .main-top h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.022em; }
  .main-top .acts { margin-left: auto; display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: var(--radius-ctl); padding: 9px 16px;
    font-size: 14.5px; font-weight: 500; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--text-2);
    transition: background .13s ease, color .13s ease, transform .07s ease;
  }
  .btn:hover { background: oklch(0.34 0 0); color: var(--text); }
  .btn:active { transform: scale(0.975); }
  .btn-blue  { color: var(--blue);  background: color-mix(in oklch, var(--blue) 16%, transparent);  border-color: color-mix(in oklch, var(--blue) 26%, transparent); }
  .btn-blue:hover  { background: color-mix(in oklch, var(--blue) 24%, transparent); color: var(--blue); }
  .btn-amber { color: var(--amber); background: color-mix(in oklch, var(--amber) 15%, transparent); border-color: color-mix(in oklch, var(--amber) 25%, transparent); }
  .btn-amber:hover { background: color-mix(in oklch, var(--amber) 23%, transparent); color: var(--amber); }
  .btn-quiet { color: var(--text-3); }

  /* ═════════════════════════════════════════════════════════════ columns */
  .cols { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .col {
    flex: 1 1 330px; min-width: 300px; max-width: 420px;
    background: var(--inset); border: 1px solid var(--line);
    border-radius: var(--radius-panel); padding: 16px 14px;
  }
  .col-head { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; }
  .col-dot { width: 11px; height: 11px; border-radius: 3.5px; flex: none; }
  .col-dot.amber { background: var(--amber); }
  .col-dot.blue  { background: var(--blue); }
  .col-dot.green { background: var(--green); }
  .col-name { font-size: 17.5px; font-weight: 600; letter-spacing: -0.01em; }
  .col-count {
    width: 23px; height: 23px; border-radius: 50%; flex: none;
    background: oklch(1 0 0 / 0.07); color: var(--text-3);
    font-size: 13px; font-weight: 550; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .col-meta { margin-left: auto; font-size: 14.5px; color: var(--text-3); }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  /* ════════════════════════════════════════════════════════════════ card */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-card); overflow: hidden; cursor: pointer;
  }
  .card:hover { border-color: oklch(1 0 0 / 0.13); }
  .card-pad { padding: 15px 16px; }
  .card-head { display: flex; align-items: flex-start; gap: 11px; }
  .card-num {
    width: 26px; height: 26px; border-radius: 50%; flex: none; margin-top: 1px;
    background: oklch(1 0 0 / 0.07); color: var(--text-3);
    font-size: 13px; font-weight: 550; display: flex; align-items: center; justify-content: center;
  }
  .card-title { flex: 1; font-size: 17px; font-weight: 550; letter-spacing: -0.012em; line-height: 1.32; color: var(--text); }
  .card-chev { flex: none; width: 17px; height: 17px; color: var(--text-4); margin-top: 4px; transition: transform .16s ease; }
  .card[data-open="true"] .card-chev { transform: rotate(180deg); }

  .tags { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 11px; }
  .tags.indent, .desc.indent, .divider.indent, .foot.indent, .expand.indent { margin-left: 37px; }

  .tag {
    display: inline-flex; align-items: center; border-radius: 999px;
    padding: 4px 11px; font-size: 13px; font-weight: 550; letter-spacing: -0.005em;
  }
  .tag-blue   { color: var(--blue);   background: color-mix(in oklch, var(--blue) 17%, transparent); }
  .tag-green  { color: var(--green);  background: color-mix(in oklch, var(--green) 17%, transparent); }
  .tag-amber  { color: var(--amber);  background: color-mix(in oklch, var(--amber) 17%, transparent); }
  .tag-purple { color: var(--purple); background: color-mix(in oklch, var(--purple) 17%, transparent); }
  .tag-gray   { color: var(--text-2); background: oklch(1 0 0 / 0.07); }

  .tag-time { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; color: var(--text-3); padding-left: 2px; }
  .tag-time svg { width: 13px; height: 13px; }

  .desc {
    margin-top: 11px; font-size: 14.5px; line-height: 1.5; color: var(--text-3);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card[data-open="true"] .desc { -webkit-line-clamp: unset; }

  .divider { border-top: 1px solid var(--line); margin-top: 14px; }
  .foot { display: flex; justify-content: space-between; gap: 12px; padding-top: 12px; font-size: 14px; color: var(--text-4); }
  .foot .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; letter-spacing: 0.01em; }

  /* split action bar, mirrors "Start | Push to tomorrow" */
  .actbar { display: flex; border-top: 1px solid var(--line); }
  .actbar button {
    flex: 1; background: none; border: none; padding: 13px 8px; cursor: pointer;
    font-size: 15.5px; font-weight: 500; color: var(--text-2);
    transition: background .13s ease, color .13s ease;
  }
  .actbar button:hover { background: oklch(1 0 0 / 0.045); color: var(--text); }
  .actbar button + button { border-left: 1px solid var(--line); }
  .actbar .go { color: var(--blue); font-weight: 550; }
  .actbar .go:hover { color: var(--blue); background: color-mix(in oklch, var(--blue) 12%, transparent); }

  /* expanded approval */
  .expand { margin-top: 14px; }
  .quote {
    background: color-mix(in oklch, var(--amber) 9%, transparent);
    border: 1px solid color-mix(in oklch, var(--amber) 24%, transparent);
    border-radius: 12px; padding: 13px 15px;
    font-size: 15.5px; line-height: 1.5; color: var(--text);
  }
  .expand-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .editbox { margin-top: 11px; }
  .editbox textarea {
    width: 100%; min-height: 78px; resize: vertical;
    background: var(--inset); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 15px; line-height: 1.5; outline: none;
  }
  .editbox textarea:focus { border-color: color-mix(in oklch, var(--blue) 45%, transparent); }
  .verdict { display: inline-flex; align-items: center; gap: 7px; margin-top: 12px; font-size: 14.5px; font-weight: 550; }
  .verdict.ok { color: var(--green); }
  .verdict.no { color: var(--text-3); }

  .hollow {
    border: 1px dashed var(--line); border-radius: var(--radius-card);
    padding: 22px 14px; text-align: center; font-size: 14.5px; color: var(--text-4);
  }

  /* ════════════════════════════════════════════════════════════════ people */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; width: 100%; }
  .pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 16px 17px; cursor: pointer; }
  .pcard:hover { border-color: oklch(1 0 0 / 0.13); }
  .pc-head { display: flex; align-items: center; gap: 12px; }
  .pc-av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; }
  .pc-name { font-size: 17px; font-weight: 550; letter-spacing: -0.012em; }
  .pc-why { margin-top: 13px; font-size: 14px; line-height: 1.5; color: var(--purple); background: color-mix(in oklch, var(--purple) 13%, transparent); border-radius: 10px; padding: 9px 12px; }
  .kv { display: grid; grid-template-columns: 104px 1fr; gap: 7px 12px; margin-top: 13px; font-size: 14.5px; }
  .kv dt { color: var(--text-4); }
  .kv dd { margin: 0; color: var(--text-2); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 500;
    box-shadow: 0 16px 40px -14px oklch(0 0 0 / 0.7);
    opacity: 0; transition: opacity .22s ease, transform .22s ease; pointer-events: none; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-5px); }

  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-6 9-9 18-9-1 6-4 10-9 12l-3 6-2-6-6-3z"/></svg>
      <span>Wingman</span>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search people & activity" autocomplete="off" />
      <span class="kbd">⌘K</span>
    </div>

    <nav class="nav">
      <button class="navitem" data-view="now" aria-current="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2.5"/></svg>
        Now
        <span class="count" id="cNow"></span>
      </button>
      <button class="navitem" data-view="people">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4"/><path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8"/></svg>
        People
        <span class="count" id="cPeople"></span>
      </button>
      <button class="navitem" onclick="location.href='/status'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 20v-5"/><path d="M12 20V8"/><path d="M18 20v-9"/></svg>
        Status
      </button>
    </nav>

    <div class="grow"></div>

    <div class="whoami">
      <div class="av">Y</div>
      <div>
        <div class="nm">You</div>
        <div class="st" id="meState">Not started</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-top">
      <h1 id="title">Now</h1>
      <div class="acts" id="acts"></div>
    </div>
    <div class="cols" id="cols"></div>
  </main>

</div>
<div class="toast" id="toast"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
};
const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2.5"/></svg>';
const CHEV  = '<svg class="card-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

let view = 'now', query = '';
let events = [], approvals = [], profiles = [], schema = { levelLabels: {}, fieldLevels: {} };
let open = new Set(), editingId = null, drafts = new Map(), lastSnap = '';

const CAND_TONE = { maya: 'blue', devon: 'green', priya: 'purple', sam: 'amber', lena: 'gray' };
const LEVEL_TONE = { L0: 'gray', L1: 'blue', L2: 'amber', L3: 'purple' };
const ACT_LABEL = { share_detail: 'Share a detail', send_intro: 'Send an introduction', book_date: 'Propose a date' };

const tag = (t, tone) => `<span class="tag tag-${tone}">${esc(t)}</span>`;
const time = (iso) => `<span class="tag-time">${CLOCK}${ago(iso)}</span>`;
const hit = (s) => !query || s.toLowerCase().includes(query.toLowerCase());

function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ─────────────────────────────────────────────────────────────────── cards */
function approvalCard(a, n, first) {
  const id = 'a-' + a.id, isOpen = open.has(id);
  const tags = tag(a.candidateName, CAND_TONE[a.candidateId] ?? 'gray')
    + a.fields.map(f => tag(`${f} · ${schema.fieldLevels[f] ?? ''}`, LEVEL_TONE[schema.fieldLevels[f]] ?? 'gray')).join('')
    + time(a.ts);

  return `
    <article class="card" data-open="${isOpen}" data-target="${id}">
      <div class="card-pad">
        <div class="card-head">
          <div class="card-num">${n}</div>
          <div class="card-title">${esc(ACT_LABEL[a.action] ?? a.action)}</div>
          ${CHEV}
        </div>
        <div class="tags indent">${tags}</div>
        <div class="desc indent">${esc(a.sentence)}</div>
        ${isOpen ? expandBlock(a) : `
          <div class="divider indent"></div>
          <div class="foot indent"><span>${ago(a.ts)}</span><span class="mono">${esc(a.action)}</span></div>`}
      </div>
      ${!isOpen && first ? `
        <div class="actbar">
          <button class="go" data-act="approve" data-id="${a.id}">Approve</button>
          <button data-act="open" data-target="${id}">Review</button>
        </div>` : ''}
    </article>`;
}

function expandBlock(a) {
  if (a.status === 'resolved') {
    const ok = a.decision !== 'decline';
    const how = a.decision === 'edit' ? ' (edited)' : a.decision === 'vaguer' ? ' (said less)' : '';
    return `
      <div class="expand indent">
        <div class="quote">${esc(a.sentSentence || a.sentence)}</div>
        <div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ Sent' + how : '✕ Declined'}</div>
      </div>`;
  }
  const draft = drafts.has(a.id) ? drafts.get(a.id) : a.sentence;
  return `
    <div class="expand indent">
      <div class="quote">${esc(a.sentence)}</div>
      <div class="expand-acts">
        <button class="btn btn-blue"  data-act="approve" data-id="${a.id}">Approve</button>
        <button class="btn"           data-act="edit"    data-id="${a.id}">Edit</button>
        <button class="btn btn-amber" data-act="vaguer"  data-id="${a.id}">Say less</button>
        <button class="btn btn-quiet" data-act="decline" data-id="${a.id}">Decline</button>
      </div>
      ${editingId === a.id ? `
        <div class="editbox">
          <textarea id="editText">${esc(draft)}</textarea>
          <div class="expand-acts">
            <button class="btn btn-blue" data-act="send-edit" data-id="${a.id}">Send edited</button>
          </div>
        </div>` : ''}
    </div>`;
}

function eventCard(e) {
  const id = 'e-' + e.id, isOpen = open.has(id);
  const tone = e.state === 'did' ? 'green' : 'blue';
  return `
    <article class="card" data-open="${isOpen}" data-target="${id}">
      <div class="card-pad">
        <div class="card-head">
          <div class="card-title">${esc(e.title)}</div>
          ${CHEV}
        </div>
        <div class="tags">${tag(e.actor, 'gray')}${tag(e.state === 'did' ? 'Done' : 'Working', tone)}${time(e.ts)}</div>
        <div class="desc">${esc(e.detail)}</div>
        <div class="divider"></div>
        <div class="foot"><span>${ago(e.ts)}</span><span class="mono">${esc(e.actor.toUpperCase())}</span></div>
      </div>
    </article>`;
}

const column = (tone, name, count, meta, body) => `
  <section class="col">
    <div class="col-head">
      <span class="col-dot ${tone}"></span>
      <span class="col-name">${name}</span>
      <span class="col-count">${count}</span>
      <span class="col-meta">${meta}</span>
    </div>
    <div class="stack">${body}</div>
  </section>`;

/* ───────────────────────────────────────────────────────────────── screens */
function renderNow() {
  $('title').textContent = 'Now';
  $('acts').innerHTML = `
    <button class="btn btn-blue" id="run">Run demo</button>
    <button class="btn" id="clear">Reset</button>`;
  $('run').onclick = async () => { await fetch('/api/demo/run', { method: 'POST' }); toast('Wingman is on it.'); await load(true); };
  $('clear').onclick = async () => {
    await fetch('/api/demo/reset', { method: 'POST' });
    open.clear(); drafts.clear(); editingId = null; toast('Cleared.'); await load(true);
  };

  const pend  = approvals.filter(a => a.status === 'pending' && hit(a.sentence + ' ' + a.candidateName));
  const doing = [...events].reverse().filter(e => e.state === 'doing' && hit(e.title + ' ' + e.detail)).slice(0, 6);
  const done  = [...events].reverse().filter(e => e.state === 'did'   && hit(e.title + ' ' + e.detail)).slice(0, 6);

  $('cols').innerHTML =
      column('amber', 'Waiting on you', pend.length,  pend.length ? 'needs you' : '',
        pend.length ? pend.map((a, i) => approvalCard(a, i + 1, i === 0)).join('')
                    : `<div class="hollow">Nothing needs you right now.</div>`)
    + column('blue',  'In progress',    doing.length, doing[0] ? ago(doing[0].ts) : '',
        doing.length ? doing.map(eventCard).join('') : `<div class="hollow">Nothing running.</div>`)
    + column('green', 'Done',           done.length,  done[0] ? ago(done[0].ts) : '',
        done.length ? done.map(eventCard).join('') : `<div class="hollow">Nothing finished yet.</div>`);

  wire();
}

function why(me, c) {
  if (!me) return "Your wingman doesn't know you yet — talk to it first, and this will explain the match.";
  const keys = ['interests', 'hobbies', 'tastes', 'goodSaturday'];
  const words = (s) => (s || '').toLowerCase().match(/[a-z]{4,}/g) || [];
  const mine = new Set(keys.flatMap(k => words(me.fields[k])));
  const shared = [];
  for (const k of keys) for (const w of words(c.fields[k])) if (mine.has(w) && !shared.includes(w)) shared.push(w);
  return shared.length ? `You both mention "${shared.slice(0, 2).join('" and "')}."` : 'A different vibe from yours — could be a good contrast.';
}

function renderPeople() {
  $('title').textContent = 'People';
  $('acts').innerHTML = '';
  const me = profiles.find(p => p.userId === 'me');
  const list = profiles.filter(p => p.isPersona).filter(p => hit((p.fields.name || p.userId) + ' ' + (p.fields.vibe || '')));

  $('cols').innerHTML = `<div class="grid">${list.length ? list.map(p => {
    const id = 'p-' + p.userId, isOpen = open.has(id);
    const name = p.fields.name || p.userId;
    const tone = CAND_TONE[p.userId] ?? 'gray';
    const rows = isOpen ? Object.entries(p.views.L1.fields).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') : '';
    return `
      <article class="pcard" data-target="${id}">
        <div class="pc-head">
          <div class="pc-av tag-${tone}">${esc(name.trim()[0].toUpperCase())}</div>
          <div class="pc-name">${esc(name)}</div>
        </div>
        <div class="tags">${tag(p.fields.ageBand ?? '—', 'gray')}${tag(p.fields.area ?? '—', tone)}</div>
        <div class="desc">${esc(p.fields.goodSaturday || p.fields.vibe || '')}</div>
        <div class="pc-why">${esc(why(me, p))}</div>
        ${isOpen ? `<dl class="kv">${rows}</dl>` : ''}
      </article>`;
  }).join('') : `<div class="hollow">No one matches that search.</div>`}</div>`;

  wire();
}

/* ────────────────────────────────────────────────────────────────── wiring */
function wire() {
  document.querySelectorAll('[data-target]').forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.closest('button, textarea, input')) return;
      const id = el.dataset.target;
      open.has(id) ? open.delete(id) : open.add(id);
      draw();
    });
  });
  document.querySelectorAll('[data-act]').forEach(b => {
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      const { act, id, target } = b.dataset;
      if (act === 'open')  { open.add(target); return draw(); }
      if (act === 'edit')  { editingId = editingId === id ? null : id; return draw(); }
      if (act === 'send-edit') return decide(id, 'edit', $('editText').value);
      return decide(id, act);
    });
  });
  const ta = $('editText');
  if (ta && editingId) {
    ta.addEventListener('input', () => drafts.set(editingId, ta.value));
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}

async function decide(id, decision, editedText) {
  await fetch(`/api/approvals/${id}/decision`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ decision, editedText }),
  });
  editingId = null; drafts.delete(id);
  toast(decision === 'decline' ? 'Declined — asking for something vaguer instead.' : 'Sent.');
  await load(true);
}

document.querySelectorAll('.navitem[data-view]').forEach(b =>
  b.addEventListener('click', () => { view = b.dataset.view; draw(); }));
$('q').addEventListener('input', e => { query = e.target.value; draw(); });
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); }
});

function draw() {
  document.querySelectorAll('.navitem[data-view]').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.view === view)));
  const pending = approvals.filter(a => a.status === 'pending').length;
  $('cNow').textContent = pending || '';
  $('cPeople').textContent = profiles.filter(p => p.isPersona).length || '';
  const me = profiles.find(p => p.userId === 'me');
  $('meState').textContent = me ? `${me.known}/${me.total} fields known` : 'Not started';

  view === 'now' ? renderNow() : renderPeople();
}

async function load(force = false) {
  if (editingId && !force) return;   // never yank a textarea out from under the cursor
  const [act, pr, sc] = await Promise.all([
    fetch('/api/activity').then(r => r.json()),
    fetch('/api/profiles').then(r => r.json()),
    fetch('/api/schema').then(r => r.json()),
  ]);
  const snap = JSON.stringify([act.events, act.approvals, pr.profiles]);
  if (!force && snap === lastSnap) return;   // no data change → no DOM churn
  lastSnap = snap;
  events = act.events; approvals = act.approvals; profiles = pr.profiles; schema = sc;
  draw();
}

await load(true);
setInterval(() => load(), 2000);
</script>
