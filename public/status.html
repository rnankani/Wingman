<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wingman — dashboard</title>
<link rel="icon" href="/brand/icon-32.png" />
<link rel="stylesheet" href="/brand/wingman.css" />
<style>
  :root {
    --yolk: #fdcf2e;
    --beak: #ff7709;
    --plum: #48074f;
    --plum-soft: #873f94;
    --ink: #1b1020;
    --paper: #fffaf0;
    --card: #ffffff;
    --line: rgba(72, 7, 79, 0.14);
    --ok: #1a7f4b;
    --warn: #b5651d;
    --down: #b3123c;

    --l0: #2f9e6b;
    --l1: #2b7fc4;
    --l2: #c07a12;
    --l3: #b3123c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 480px at 50% -18%, #fff3cc 0%, transparent 60%), var(--paper);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    padding: 1.5rem 1.25rem 5rem;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ---------------------------------------------------------------- header */
  header { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.35rem; }
  header .chikny { --chikny-scale: 0.5; }
  .brand { font-weight: 800; font-size: 1.9rem; letter-spacing: -0.04em; line-height: 1; }
  .brand b { color: var(--plum); } .brand i { font-style: normal; color: var(--beak); }
  .sub { color: var(--plum-soft); font-size: 0.85rem; margin-top: 0.15rem; }
  header nav { margin-left: auto; display: flex; gap: 0.4rem; align-items: center; }
  header nav a, .ghost {
    font-size: 0.82rem; text-decoration: none; color: var(--plum); background: #fff;
    border: 1px solid var(--line); border-radius: 999px; padding: 0.35rem 0.8rem; font-weight: 600;
    cursor: pointer;
  }
  #tick { color: var(--plum-soft); font-size: 0.75rem; font-variant-numeric: tabular-nums; }

  h2 {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--plum-soft); font-weight: 700; margin: 2.2rem 0 0.75rem;
  }
  h2:first-of-type { margin-top: 1.6rem; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 1rem 1.1rem;
  }

  /* --------------------------------------------------------------- checks */
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 0.6rem; }
  .check { display: flex; gap: 0.6rem; align-items: flex-start; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 0.42rem; flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.down { background: var(--down); }
  .check b { display: block; font-size: 0.86rem; }
  .check span { color: var(--plum-soft); font-size: 0.76rem; overflow-wrap: anywhere; }
  .check code {
    display: inline-block; margin-top: 0.3rem; font-size: 0.72rem; background: #fff6e0;
    border: 1px solid #f2dca6; border-radius: 6px; padding: 0.12rem 0.4rem; color: #7a4b00;
    overflow-wrap: anywhere;
  }

  /* ---------------------------------------------------------------- tools */
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--plum-soft); font-weight: 700; padding: 0 0.6rem 0.5rem 0;
  }
  td { padding: 0.5rem 0.6rem 0.5rem 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.name { font: 600 0.85rem ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  td.desc { color: var(--plum-soft); font-size: 0.78rem; }
  .tag {
    display: inline-block; font: 600 0.7rem ui-monospace, Menlo, monospace;
    padding: 0.1rem 0.45rem; border-radius: 5px; white-space: nowrap;
  }
  .tag.ro { background: #e7f6ee; color: var(--ok); }
  .tag.w  { background: #fdeee2; color: var(--warn); }
  .tag.d  { background: #fde7ed; color: var(--down); }
  .tag.u  { background: #fde7ed; color: var(--down); }
  .gate { font-size: 0.78rem; font-weight: 650; white-space: nowrap; }
  .gate.on { color: var(--down); } .gate.off { color: var(--plum-soft); font-weight: 500; }

  /* ------------------------------------------------------------- profiles */
  .plist { display: grid; gap: 0.8rem; }
  .p-head { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  .p-head .chikny { --chikny-scale: 0.5; margin: -0.5rem 0; }
  .who { font-weight: 750; font-size: 1.05rem; }
  .pill {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0.15rem 0.5rem; border-radius: 999px; background: #f4ecf6; color: var(--plum-soft);
  }
  .meter { margin-left: auto; font-size: 0.76rem; color: var(--plum-soft); font-variant-numeric: tabular-nums; }

  .budget { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.75rem 0 0.15rem; }
  .lv {
    font: 600 0.72rem ui-monospace, Menlo, monospace; padding: 0.2rem 0.5rem;
    border-radius: 6px; border: 1px solid var(--line); background: #fff;
  }
  .lv em { font-style: normal; opacity: 0.75; }
  .lv[data-policy="free"]  { border-color: #b7e4ca; background: #eefaf3; color: var(--ok); }
  .lv[data-policy="ask"]   { border-color: #f2dca6; background: #fff6e6; color: var(--warn); }
  .lv[data-policy="never"] { border-color: #f5bfcd; background: #fdeef2; color: var(--down); }

  .never { margin-top: 0.5rem; font-size: 0.78rem; color: var(--plum-soft); }
  .never b { color: var(--down); }

  .ladder { margin-top: 0.9rem; border-top: 1px solid var(--line); padding-top: 0.8rem; }
  .tabs { display: flex; gap: 0.3rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
  .tab {
    font: 600 0.76rem ui-monospace, Menlo, monospace; padding: 0.28rem 0.6rem;
    border-radius: 7px; border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--plum);
  }
  .tab[aria-selected="true"] { background: var(--plum); color: #fff; border-color: var(--plum); }

  .kv { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 0.3rem 0.9rem; font-size: 0.84rem; }
  .kv dt { font: 600 0.78rem ui-monospace, Menlo, monospace; }
  .kv dd { margin: 0; }
  .kv dt::after { content: ""; }
  .lvl { font-size: 0.62rem; font-weight: 700; padding: 0.05rem 0.3rem; border-radius: 4px; margin-left: 0.3rem; vertical-align: 1px; }
  .lvl.L0 { background: #e7f6ee; color: var(--l0); }
  .lvl.L1 { background: #e6f1fa; color: var(--l1); }
  .lvl.L2 { background: #fdf2df; color: var(--l2); }
  .lvl.L3 { background: #fde7ed; color: var(--l3); }

  .withheld { margin-top: 0.8rem; font-size: 0.78rem; color: var(--plum-soft); }
  .withheld code { font-size: 0.74rem; background: #f6f1f7; border-radius: 4px; padding: 0.06rem 0.3rem; }
  .redacted { color: var(--down); font-weight: 600; }
  .empty { color: var(--plum-soft); font-style: italic; font-size: 0.85rem; }

  .hollow {
    text-align: center; padding: 2.5rem 1rem; color: var(--plum-soft);
  }
  .hollow .chikny { --chikny-scale: 0.5; margin: 0 auto 0.6rem; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="chikny chikny--logo" role="img" aria-label="Wingman mascot"></div>
    <div>
      <div class="brand"><b>Wing</b><i>man</i></div>
      <div class="sub">engineering status · localhost:3001</div>
    </div>
    <nav>
      <span id="tick"></span>
      <button class="ghost" id="refresh">Refresh</button>
      <a href="/">Cockpit</a>
      <a href="/brand/">Brand</a>
    </nav>
  </header>

  <h2>Pipeline</h2>
  <div class="card"><div class="checks" id="checks"></div></div>

  <h2>Tool surface <span id="policyNote" style="text-transform:none;letter-spacing:0;font-weight:500"></span></h2>
  <div class="card" id="toolsCard"></div>

  <h2>Profiles</h2>
  <div class="plist" id="profiles"></div>

</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let schema = { levels: ['L0','L1','L2','L3'], levelLabels: {}, fieldLevels: {} };
const selectedLevel = new Map();   // userId -> level, survives refresh

const TAG = { '@read-only': 'ro', '@write': 'w', '@destructive': 'd', '@unannotated': 'u' };

function renderChecks(checks) {
  $('checks').innerHTML = checks.map(c => `
    <div class="check">
      <div class="dot ${c.state}"></div>
      <div>
        <b>${esc(c.label)}</b>
        <span>${esc(c.detail)}</span>
        ${c.fix ? `<code>${esc(c.fix)}</code>` : ''}
      </div>
    </div>`).join('');
}

function renderTools(tools, policy) {
  $('policyNote').textContent = policy
    ? `— require_approval_for_tools: ${policy.length ? policy.join(', ') : '(none)'}`
    : '— no agent yet, so no policy in force';

  if (!tools.length) {
    $('toolsCard').innerHTML = `<div class="empty">TrueForge cannot see any tools.</div>`;
    return;
  }
  $('toolsCard').innerHTML = `
    <table>
      <thead><tr><th>Tool</th><th>Class</th><th>Approval</th><th>What it does</th></tr></thead>
      <tbody>${tools.map(t => `
        <tr>
          <td class="name">${esc(t.name)}</td>
          <td><span class="tag ${TAG[t.klass] ?? 'u'}">${esc(t.klass)}</span></td>
          <td class="gate ${t.gated ? 'on' : 'off'}">${t.gated ? 'asks you' : 'autonomous'}</td>
          <td class="desc">${esc(t.description)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

function renderProfiles(profiles) {
  if (!profiles.length) {
    $('profiles').innerHTML = `
      <div class="card hollow">
        <div class="chikny chikny--resting"></div>
        <div>No profiles yet. Talk to the agent and it will write one here.</div>
      </div>`;
    return;
  }

  $('profiles').innerHTML = profiles.map(p => {
    const level = selectedLevel.get(p.userId) ?? 'L0';
    const view = p.views[level];
    const entries = Object.entries(view.fields);

    const budget = schema.levels.map(l => `
      <span class="lv" data-policy="${esc(p.budget.levels[l])}">
        ${l} <em>${esc(schema.levelLabels[l] ?? '')}</em> · ${esc(p.budget.levels[l])}
      </span>`).join('');

    const tabs = schema.levels.map(l => `
      <button class="tab" role="tab" aria-selected="${l === level}"
              data-user="${esc(p.userId)}" data-level="${l}">
        ${l} ${esc(schema.levelLabels[l] ?? '')}
      </button>`).join('');

    const rows = entries.length
      ? `<dl class="kv">${entries.map(([k, v]) => `
          <dt>${esc(k)}<span class="lvl ${schema.fieldLevels[k]}">${schema.fieldLevels[k]}</span></dt>
          <dd>${esc(v)}</dd>`).join('')}</dl>`
      : `<div class="empty">Nothing visible at ${level}.</div>`;

    return `
      <div class="card">
        <div class="p-head">
          <div class="chikny chikny--${p.isPersona ? 'idle' : 'learning'}"></div>
          <span class="who">${esc(p.userId)}</span>
          <span class="pill">${p.isPersona ? 'persona' : 'you'}</span>
          <span class="meter">${p.known}/${p.total} fields · updated ${new Date(p.updatedAt).toLocaleTimeString()}</span>
        </div>

        <div class="budget">${budget}</div>
        <div class="never">
          never share:
          ${p.budget.neverShare.length
            ? p.budget.neverShare.map(n => `<b>${esc(n)}</b>`).join(', ')
            : '<span class="empty">nothing</span>'}
          · forwardness ${p.budget.forwardness}/5
        </div>

        <div class="ladder">
          <div class="tabs" role="tablist">${tabs}</div>
          <div><strong style="font-size:.82rem">A stranger's agent at ${level} sees:</strong></div>
          <div style="margin-top:.5rem">${rows}</div>
          ${view.redacted.length ? `<div class="withheld">stripped by never-share: ${view.redacted.map(f => `<code class="redacted">${esc(f)}</code>`).join(' ')}</div>` : ''}
          ${view.withheldAbove.length ? `<div class="withheld">above this level: ${view.withheldAbove.map(f => `<code>${esc(f)}</code>`).join(' ')}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  // Level switching is local — no refetch, since all four views are already here.
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedLevel.set(btn.dataset.user, btn.dataset.level);
      renderProfiles(lastProfiles);
    });
  });
}

let lastProfiles = [];

async function load() {
  try {
    const [st, pr, sc] = await Promise.all([
      fetch('/api/status').then(r => r.json()),
      fetch('/api/profiles').then(r => r.json()),
      fetch('/api/schema').then(r => r.json()),
    ]);
    schema = sc;
    lastProfiles = pr.profiles;
    renderChecks(st.checks);
    renderTools(st.tools, st.approvalPolicy);
    renderProfiles(pr.profiles);
    $('tick').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('tick').textContent = 'refresh failed';
  }
}

$('refresh').addEventListener('click', load);
await load();
setInterval(load, 5000);
</script>
</body>
</html>
