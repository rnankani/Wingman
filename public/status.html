<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wingman — status</title>
<link rel="icon" href="/brand/icon-32.png" />
<link rel="stylesheet" href="/brand/wingman.css" />
<link rel="stylesheet" href="/theme.css" />
<style>
  body { padding: 30px 24px 70px; }
  .wrap { max-width: 1040px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 13px; margin-bottom: 8px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5), inset 0 -1px 0 oklch(0.55 0.12 70 / 0.5),
                var(--cast-1), 0 5px 14px -5px oklch(0.8 0.16 88 / 0.55);
  }
  .brand-mark svg { width: 19px; height: 19px; color: var(--yolk-ink); }
  h1 { margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -0.024em; }
  .sub { font-size: 13.5px; color: var(--text-4); margin-top: 1px; }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .tick { font-size: 13px; color: var(--text-4); font-variant-numeric: tabular-nums; }
  .lede { color: var(--text-3); font-size: 15px; margin: 0 0 28px; max-width: 66ch; }

  section { margin-bottom: 30px; }
  section > .eyebrow { display: block; margin-bottom: 11px; padding-left: 3px; }

  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .check { padding: 15px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .check .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 6px; box-shadow: 0 0 10px currentColor; }
  .check .dot.ok   { background: var(--green); color: oklch(0.72 0.13 145 / 0.7); }
  .check .dot.warn { background: var(--amber); color: oklch(0.76 0.13 75 / 0.7); }
  .check .dot.down { background: var(--red);   color: oklch(0.68 0.17 25 / 0.7); }
  .check b { display: block; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
  .check p { margin: 3px 0 0; font-size: 13.8px; color: var(--text-3); line-height: 1.45; overflow-wrap: anywhere; }
  .fix { display: inline-block; margin-top: 9px; font-size: 12.5px; background: var(--well); box-shadow: var(--sink); border-radius: 8px; padding: 5px 9px; color: var(--yolk); overflow-wrap: anywhere; }

  .tools { padding: 4px 0; overflow-x: auto; }
  .trow { display: grid; grid-template-columns: minmax(150px,1fr) 120px 110px minmax(200px,2fr); gap: 14px; align-items: center; padding: 13px 18px; }
  .trow + .trow { border-top: 1px solid oklch(0 0 0 / 0.28); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.04); }
  .thead { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-4); }
  .tname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; font-weight: 600; }
  .tdesc { font-size: 13.5px; color: var(--text-3); }
  .gate { font-size: 13.5px; font-weight: 600; }
  .gate.on { color: var(--yolk); } .gate.off { color: var(--text-4); font-weight: 500; }

  .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 18px; }
  .profile { padding: 17px 18px; }
  .p-head { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
  .p-av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; box-shadow: var(--lip), var(--cast-1), 0 5px 12px -4px oklch(0 0 0 / 0.5); }
  .p-name { font-size: 17.5px; font-weight: 600; letter-spacing: -0.014em; }
  .p-meter { margin-left: auto; font-size: 13px; color: var(--text-4); text-align: right; font-variant-numeric: tabular-nums; }
  .budget { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
  .never { margin-top: 10px; font-size: 13.5px; color: var(--text-4); }
  .never b { color: var(--yolk); font-weight: 600; }
  .ladder { margin-top: 15px; border-top: 1px solid oklch(0 0 0 / 0.3); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.05); padding-top: 14px; }
  .tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 13px; }
  .tab {
    padding: 7px 13px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 600;
    color: var(--text-3); border: 1px solid var(--line);
    background: linear-gradient(180deg, oklch(0.325 0 0), oklch(0.292 0 0));
    box-shadow: var(--lip-soft), var(--cast-1); transition: transform .1s ease, color .13s ease;
  }
  .tab:hover { transform: translateY(-1px); color: var(--text); }
  .tab[aria-selected="true"] {
    color: var(--yolk-ink); border-color: var(--yolk-edge);
    background: linear-gradient(180deg, var(--yolk), var(--yolk-deep));
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5), var(--cast-1), 0 5px 13px -5px oklch(0.8 0.16 88 / 0.55);
  }
  .seen { font-size: 13.5px; color: var(--text-4); margin-bottom: 10px; }
  .kv { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 8px 14px; font-size: 14.5px; }
  .kv dt { font-weight: 600; color: var(--text-2); }
  .kv dd { margin: 0; color: var(--text-3); }
  .lvl { font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 5px; margin-left: 6px; vertical-align: 1.5px; }
  .lvl.L0 { color: var(--text-2); background: oklch(1 0 0 / 0.09); }
  .lvl.L1 { color: var(--blue);   background: color-mix(in oklch, var(--blue) 20%, transparent); }
  .lvl.L2 { color: var(--amber);  background: color-mix(in oklch, var(--amber) 20%, transparent); }
  .lvl.L3 { color: var(--purple); background: color-mix(in oklch, var(--purple) 20%, transparent); }
  .note { margin-top: 12px; font-size: 13px; color: var(--text-4); }
  .note code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--well); box-shadow: var(--sink); border-radius: 6px; padding: 2px 6px; margin-right: 4px; display: inline-block; }
  .note code.red { color: var(--red); }
  .hollow { border: 1px dashed oklch(1 0 0 / 0.1); border-radius: var(--r-card); padding: 30px 16px; text-align: center; font-size: 14.5px; color: var(--text-4); box-shadow: inset 0 1px 4px oklch(0 0 0 / 0.25); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-6 9-9 18-9-1 6-4 10-9 12l-3 6-2-6-6-3z"/></svg>
    </div>
    <div>
      <h1>Status</h1>
      <div class="sub" id="host">engineering readout</div>
    </div>
    <div class="right">
      <span class="tick" id="tick"></span>
      <button class="btn" id="refresh">Refresh</button>
      <a class="btn btn-yolk" href="/">Open app</a>
    </div>
  </header>
  <p class="lede">The full engineering readout in one scroll: whether the pipeline is actually wired, which tools TrueForge can see and which of them stop for approval, and the raw disclosure ladder for every profile in the store.</p>

  <section>
    <span class="eyebrow">Pipeline</span>
    <div id="checks"></div>
  </section>

  <section>
    <span class="eyebrow" id="policyNote">Tool surface</span>
    <div id="tools"></div>
  </section>

  <section>
    <span class="eyebrow">Profiles</span>
    <div id="profiles"></div>
  </section>

</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KLASS_TONE = { '@read-only': 'green', '@write': 'amber', '@destructive': 'red', '@unannotated': 'red' };
const TONE = { maya: 'blue', devon: 'green', priya: 'purple', sam: 'amber', lena: 'gray' };

let schema = { levels: ['L0','L1','L2','L3'], levelLabels: {}, fieldLevels: {} };
let profiles = [];
const levelOf = new Map();

function renderChecks(checks) {
  $('checks').innerHTML = `<div class="checks">${checks.map(c => `
    <div class="card check">
      <div class="dot ${c.state}"></div>
      <div style="min-width:0">
        <b>${esc(c.label)}</b>
        <p>${esc(c.detail)}</p>
        ${c.fix ? `<span class="fix mono">${esc(c.fix)}</span>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

function renderTools(tools, policy) {
  $('policyNote').textContent = policy
    ? `Tool surface — gated: ${policy.length ? policy.join(', ') : 'none'}`
    : 'Tool surface — no agent yet, so no policy in force';

  $('tools').innerHTML = tools.length ? `
    <div class="card tools">
      <div class="trow thead"><span>Tool</span><span>Class</span><span>Approval</span><span>What it does</span></div>
      ${tools.map(t => `
        <div class="trow">
          <span class="tname">${esc(t.name)}</span>
          <span><span class="tag tag-${KLASS_TONE[t.klass] ?? 'gray'}">${esc(t.klass)}</span></span>
          <span class="gate ${t.gated ? 'on' : 'off'}">${t.gated ? 'Asks you' : 'Autonomous'}</span>
          <span class="tdesc">${esc(t.description)}</span>
        </div>`).join('')}
    </div>`
    : `<div class="hollow">TrueForge cannot see any tools.<br><span class="fix mono">npm run setup</span></div>`;
}

function renderProfiles() {
  if (!profiles.length) {
    $('profiles').innerHTML = `<div class="hollow">No profiles yet.<br><span class="fix mono">npm run seed</span></div>`;
    return;
  }
  $('profiles').innerHTML = `<div class="plist">${profiles.map(p => {
    const lvl = levelOf.get(p.userId) ?? 'L0';
    const v = p.views[lvl];
    const tone = TONE[p.userId] ?? 'gray';
    const initial = (p.fields.name || p.userId).trim()[0].toUpperCase();

    const budget = schema.levels.map(l => {
      const pol = p.budget.levels[l];
      const t = pol === 'free' ? 'green' : pol === 'ask' ? 'amber' : 'red';
      return `<span class="tag tag-${t}">${l} ${esc(schema.levelLabels[l] ?? '')} · ${esc(pol)}</span>`;
    }).join('');

    const tabs = schema.levels.map(l =>
      `<button class="tab" role="tab" aria-selected="${l === lvl}" data-user="${esc(p.userId)}" data-level="${l}">${l} ${esc(schema.levelLabels[l] ?? '')}</button>`).join('');

    const entries = Object.entries(v.fields);
    const rows = entries.length
      ? `<dl class="kv">${entries.map(([k, val]) =>
          `<dt>${esc(k)}<span class="lvl ${schema.fieldLevels[k]}">${schema.fieldLevels[k]}</span></dt><dd>${esc(val)}</dd>`).join('')}</dl>`
      : `<div class="seen">Nothing is visible at ${lvl}.</div>`;

    return `
      <div class="card profile">
        <div class="p-head">
          <div class="p-av tag-${tone}">${esc(initial)}</div>
          <div>
            <div class="p-name">${esc(p.fields.name || p.userId)}</div>
            <div class="seen" style="margin:0">${p.isPersona ? 'Seeded persona' : 'You'} · ${esc(p.userId)}</div>
          </div>
          <div class="p-meter">${p.known}/${p.total} fields<br>${new Date(p.updatedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>
        </div>
        <div class="budget">${budget}</div>
        <div class="never">Never share: ${p.budget.neverShare.length ? p.budget.neverShare.map(n => `<b>${esc(n)}</b>`).join(', ') : 'nothing'} · forwardness ${p.budget.forwardness}/5</div>
        <div class="ladder">
          <div class="tabs" role="tablist">${tabs}</div>
          <div class="seen">A stranger’s agent at ${lvl} sees:</div>
          ${rows}
          ${v.redacted.length ? `<div class="note">Stripped by never-share: ${v.redacted.map(f => `<code class="red">${esc(f)}</code>`).join('')}</div>` : ''}
          ${v.withheldAbove.length ? `<div class="note">Above this level: ${v.withheldAbove.map(f => `<code>${esc(f)}</code>`).join('')}</div>` : ''}
        </div>
      </div>`;
  }).join('')}</div>`;

  $('profiles').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    levelOf.set(b.dataset.user, b.dataset.level);
    renderProfiles();
  }));
}

async function load() {
  try {
    const [st, pr, sc] = await Promise.all([
      fetch('/api/status').then(r => r.json()),
      fetch('/api/profiles').then(r => r.json()),
      fetch('/api/schema').then(r => r.json()),
    ]);
    schema = sc; profiles = pr.profiles;
    $('host').textContent = `engineering readout · ${st.trueforgeUrl}`;
    renderChecks(st.checks);
    renderTools(st.tools, st.approvalPolicy);
    renderProfiles();
    $('tick').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  } catch {
    $('tick').textContent = 'refresh failed';
  }
}

$('refresh').addEventListener('click', load);
await load();
setInterval(load, 5000);
</script>
</body>
</html>
